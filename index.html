  {type:'product',typeLabel:'📦 Product',scene:'新しいタスク管理アプリを開発中。市場にはNotion・Todoistなど数百の競合が存在する。CMOとしてProduct戦略を選ぶとしたら？',q:'最も効果的な差別化戦略はどれか？',opts:['全機能搭載の「全部入り」アプリにする','AIで優先度を自動提案する特定機能に特化する','UIをとにかく美しくして見た目で勝負する','競合の半額で提供してシェアを取る'],correct:1,why:'過密市場で「全部入り」を目指すのは最も危険な戦略です。機能が増えるほど開発コストが膨らみ、ユーザーにとっては「何でもできるが何も特化していない」曖昧な製品になります。「AIで優先度を自動提案する」という明確なバリュープロポジションがあれば、「タスク管理に迷っている人」というターゲットに刺さりやすく、口コミも広がりやすい。Notion・Todoistも最初は機能を絞っていました。UIの美しさは差別化の理由にはなりにくく（真似されやすい）、価格競争は体力消耗戦になるため、特に初期フェーズでは禁物です。',tip:'「誰の・どんな痛みを・どう解決するか」を1行で言えない製品は市場に刺さりません。まずニッチに特化し、後から拡張するのが定石です。',words:[{term:'バリュープロポジション',desc:'「なぜ自社を選ぶのか」という独自の価値を定義したもの。「誰の・どんな問題を・どう解決するか」を明確にした言葉。'},{term:'ニッチ戦略',desc:'特定の小さな市場・顧客層に絞り込んで深く対応する戦略。競合が少なく、ファンを作りやすい。'}]},
  {type:'product',typeLabel:'📦 Product',scene:'ユーザーから「もっと機能を追加してほしい」という要望が多数届いている。開発チームは追加に前向きだが、あなたは慎重だ。',q:'機能追加の優先順位をどう決めるべきか？',opts:['要望数の多い順に全て追加する','競合アプリが持っている機能を全てコピーする','コアユーザーへのインタビューで本質的な課題を特定する','開発チームが作りやすいものから追加する'],correct:2,why:'ユーザーの「要望」は手段であり目的ではありません。「カレンダー連携が欲しい」という要望の裏には「締め切りを忘れたくない」という本質的な課題があります。この本質を掴まずに要望を鵜呑みにすると、使われない機能だらけの製品になります。コアユーザーへのインタビューでJobs-to-be-Done（ユーザーが製品を使って達成したいこと）を特定することが正しいアプローチです。競合コピーは差別化を失い、開発都合での追加はユーザー価値を無視します。',tip:'「何を作るか」より「何を作らないか」の方が重要。プロダクトの価値は機能の数ではなく、解決する課題の深さで決まります。',words:[{term:'Jobs-to-be-Done（JTBD）',desc:'ユーザーが製品・サービスを使って「達成したいこと」を軸に考えるフレームワーク。機能ではなく目的・文脈を重視する。'},{term:'コアユーザー',desc:'製品を最も頻繁に・深く使っているユーザー層。製品の本質的な価値を最もよく理解している人たち。'}]},
  {type:'product',typeLabel:'📦 Product',scene:'スマートフォン向けの家計簿アプリを開発している。無料版と有料版どちらを先に完成させるべきか議論になっている。',q:'MVP（最小限の製品）として最初にリリースすべきものはどれか？',opts:['全機能を搭載した完成版を一気に出す','無料で使える基本機能だけの版を先に出して反応を見る','有料版だけを先に出して収益化を優先する','デザインが完璧になるまでリリースを待つ'],correct:1,why:'MVPは「最小限の機能で市場に出せる製品」のこと。完成を待ってからリリースするのは、誰も使わないものを作るリスクを抱えたまま時間とコストをかけることになります。基本機能だけの無料版を早く出すことで、①実際のユーザー行動データが取れる、②改善のフィードバックが得られる、③口コミで早期にユーザーが広がる、という3つのメリットがあります。「完璧な製品より早い学習」がスタートアップの鉄則です。',tip:'Dropboxは最初、実際の製品ではなく「デモ動画」だけをMVPとして公開し、需要を確認してから開発を始めました。MVP思考は時間とお金を守ります。',words:[{term:'MVP（Minimum Viable Product）',desc:'最小限の機能で市場に出せる製品のこと。完成を待たずに早く出して反応を見る、スタートアップの基本戦略。'},{term:'フィードバックループ',desc:'製品を出す→ユーザーの反応を見る→改善する、を繰り返すサイクル。ループが速いほど製品が早く良くなる。'}]},
  {type:'product',typeLabel:'📦 Product',scene:'健康管理アプリのユーザーが増えてきた。次のフェーズとして「睡眠記録」「食事記録」「運動記録」の3つの新機能追加を検討している。',q:'最も正しい優先順位の決め方はどれか？',opts:['3つ全て同時に追加する','最も開発コストが低いものから追加する','ユーザーデータで最も使用頻度が高い行動から追加する','競合アプリにない機能から追加する'],correct:2,why:'ユーザーデータは「ユーザーが実際に何を求めているか」を客観的に示す最も信頼できる指標です。アプリ内での行動ログを見ると、どの機能がよく使われ、どこで離脱しているかがわかります。全て同時追加は開発リソースの分散になり、質が下がります。開発コスト優先は技術都合であり、ユーザー価値と一致しないことが多い。競合優位は一つの判断基準ですが、ユーザー需要のデータより優先すべきではありません。',tip:'Google・Facebookなどの大企業も「データドリブン」な意思決定を徹底しています。感覚より数字を信じる文化が良いプロダクトを作ります。',words:[{term:'データドリブン',desc:'データ・数字をもとに意思決定すること。感覚や経験ではなく、実際のユーザー行動データを根拠にする考え方。'},{term:'行動ログ',desc:'アプリやサービス上でユーザーが行った操作・行動の記録。どのページを見たか、何をタップしたかなどが記録される。'}]},
  {type:'product',typeLabel:'📦 Product',scene:'教育系SaaSを運営している。解約率（チャーン率）が月5%と高く、解約の理由を調査したところ「使い方がわからない」が最多だった。',q:'Productとして最優先で改善すべきことはどれか？',opts:['機能を増やして価値を高める','価格を下げて解約しにくくする','オンボーディング（導入支援）フローを改善する','解約ボタンを見つけにくくする'],correct:2,why:'「使い方がわからない」という解約理由は、製品の価値が伝わっていないことを示しています。この場合、機能を増やしても問題は解決せず（むしろ複雑になる）、価格を下げても使えなければ意味がありません。オンボーディング（ユーザーが製品に慣れるための導入フロー）を改善することで、ユーザーが「なるほど、これは使える！」と感じる体験を最初から設計できます。Slackは詳細なオンボーディングチュートリアルでチャーン率を大幅に下げた好例です。解約ボタンを隠すのは信頼を損ないます。',tip:'SaaSの解約の多くは「価値を感じられなかった」から。製品を使いこなしてもらうまでの最初の体験（オンボーディング）が最重要です。',words:[{term:'SaaS（Software as a Service）',desc:'インターネット経由でソフトウェアをサブスクで提供するビジネスモデル。SlackやNotionが代表例。'},{term:'チャーン率（解約率）',desc:'一定期間内に解約・離脱した顧客の割合。月5%のチャーン率は1年で半分以上の顧客を失う計算になる。'},{term:'オンボーディング',desc:'新しいユーザーがスムーズにサービスを使い始められるよう支援するプロセス。最初の体験が継続率を大きく左右する。'}]},
  {type:'product',typeLabel:'📦 Product',scene:'SNSアプリのユーザー数が伸び悩んでいる。分析すると新規ユーザーの70%が登録から3日以内に離脱していることがわかった。',q:'最も効果的なProduct改善はどれか？',opts:['新機能を大量に追加して魅力を増やす','広告費を増やして新規ユーザーの獲得数を増やす','登録から3日以内の体験（オンボーディング）を根本から見直す','価格を下げる'],correct:2,why:'70%が3日以内に離脱するということは、「新規ユーザーが製品の価値を体験する前に諦めている」ことを意味します。この状態で新機能を追加しても広告費を増やしても、バケツの穴から水が漏れ続けるだけです。最優先で取り組むべきは「登録からAHA Moment（この製品すごい！という気づきの瞬間）まで最短で届けること」です。Twitterは「フォローを5人すれば継続率が上がる」と発見し、オンボーディングでフォロー推薦を強化しました。',tip:'ユーザーが「この製品の価値がわかった！」と感じる瞬間をAHA Momentといいます。ここに最短でたどり着けるオンボーディング設計が離脱を防ぎます。',words:[{term:'AHA Moment',desc:'ユーザーが初めて製品の核心的な価値を体験する「気づきの瞬間」。ここに早く到達させることが継続率を上げる鍵。'},{term:'離脱率',desc:'サービスから離れていったユーザーの割合。登録後すぐの離脱は製品の第一印象・オンボーディングに問題がある可能性が高い。'}]},
  {type:'product',typeLabel:'📦 Product',scene:'スマートウォッチを開発している。市場調査では「バッテリーの持ち」が購入決定で最重要の要素だとわかった。',q:'Product戦略として最も正しい判断はどれか？',opts:['全ての機能を同等のリソースで開発する','バッテリー持続時間の向上を最優先の開発テーマにする','デザインの美しさを最優先にする','競合より安い価格設定を先に決める'],correct:1,why:'市場調査で「バッテリーの持ち」が購入決定の最重要要素とわかっているならば、そこに開発リソースを集中させるのが正しいProduct戦略です。ユーザーが最も価値を感じる部分を「コアバリュー」と呼び、ここへの投資が製品全体の評価を決めます。機能を均等に開発するのはリソースの無駄遣いで、どれも中途半端になります。価格は後からProductの価値に合わせて決めるもので、先に決めるものではありません。',tip:'「全部良くしよう」は「全部中途半端」になる近道。ユーザーが最も価値を感じる1点に集中投資することが製品の競争力を作ります。',words:[{term:'コアバリュー',desc:'ユーザーが製品を使う最大の理由・最も価値を感じる機能や体験のこと。ここへの投資が製品全体の評価を左右する。'},{term:'市場調査',desc:'製品の開発や販売戦略を立てるために、顧客ニーズ・競合・市場規模などを調べること。'}]},
  {type:'product',typeLabel:'📦 Product',scene:'ゲームアプリを運営。DAU（日次アクティブユーザー数）は多いが、課金率が低い。',q:'Product改善として最も効果的なアプローチはどれか？',opts:['ゲーム内広告を大量に増やす','無料ユーザーに強制的に課金を促すポップアップを出す','課金することで得られる体験をより魅力的に設計し直す','ゲームの難易度を上げてクリアに課金が必要な設計にする'],correct:2,why:'課金率が低い根本原因は「課金するほどの価値を感じていない」ことです。強制的なポップアップや難易度操作は短期的に課金を増やせても、ユーザーの信頼を失い長期的な離脱につながります。ゲーム内広告の増加もUXを損ないます。最も持続可能な方法は「課金することで得られる体験・アイテム・ストーリー」を魅力的に設計し直すことで、ユーザーが「これは払う価値がある」と自発的に感じる状態を作ることです。',tip:'ゲームマネタイズの鉄則は「お金を払いたくなる体験を作ること」。強制や妨害ではなく、課金が「選択肢の一つ」になる設計が長期的に成功します。',words:[{term:'DAU（Daily Active Users）',desc:'1日あたりのアクティブユーザー数。サービスの日々の利用頻度を測る重要な指標。'},{term:'課金率',desc:'サービスの利用者のうち、実際にお金を払ったユーザーの割合。フリーミアムモデルでは平均2〜5%程度。'},{term:'マネタイズ',desc:'サービスや製品から収益を得る仕組みを作ること。広告・課金・サブスク・データ販売などがある。'}]},
  {type:'product',typeLabel:'📦 Product',scene:'語学学習アプリDuolingoのような「ゲーミフィケーション」を自社の学習アプリに導入するか検討している。',q:'ゲーミフィケーション導入の最も重要な検討事項はどれか？',opts:['競合が導入しているから必ず導入すべき','楽しさ重視でポイント・バッジを大量に追加する','ゲーム要素が「学習そのものの動機づけ」になっているかを確認する','ゲーミフィケーションは子ども向けなので大人向けには不要'],correct:2,why:'ゲーミフィケーションは「外発的動機づけ（ポイントやバッジ）」を使って継続を促す手法ですが、正しく設計しないと「ポイント目当て」の行動が増え、肝心の学習効果が下がるリスクがあります。重要なのは、ゲーム要素が「学習の価値を高める」ものになっているかどうかです。Duolingoのストリーク（連続学習日数）は学習継続を直接促進しますが、意味のないバッジを乱発しても価値はありません。ゲーミフィケーションは手段であって目的ではありません。',tip:'「楽しい」と「成果が出る」を両立させることがゲーミフィケーションの本質。楽しいだけで学習効果がなければ、長期的にユーザーは離れます。',words:[{term:'ゲーミフィケーション',desc:'ゲームの要素（ポイント・バッジ・レベルアップ等）を非ゲームのサービスに取り入れ、ユーザーの行動を促進する手法。'},{term:'外発的動機づけ',desc:'報酬・罰・評価など外部からの刺激によって行動する動機。内発的動機（やりたいからやる）と対比される。'}]},
  {type:'product',typeLabel:'📦 Product',scene:'クラウド会計ソフトを提供している。競合他社が同様の機能を全て無料で提供すると発表した。',q:'Product戦略として最も適切な対応はどれか？',opts:['即座に価格を無料にして対抗する','競合と価格競争せず、自社の差別化価値（サポート品質・連携機能）を強化する','新機能の開発を止めてコスト削減に集中する','市場から撤退する'],correct:1,why:'価格競争に安易に参戦することは、収益性を破壊する最も危険な戦略です。特に競合が資金力で上回る場合、価格競争は自社が先に疲弊します。正しいアプローチは「なぜユーザーは競合が無料でも自社を選ぶのか」という差別化要因を明確にし、そこを強化することです。クラウド会計では「税理士との連携機能」「カスタマーサポートの質」「他ツールとの連携」などが差別化ポイントになり得ます。コア価値を磨き続けることが長期的な競争力を作ります。',tip:'価格競争は最後の手段。価格以外の価値で選ばれる理由を作ることが持続可能なビジネスの基本です。',words:[{term:'差別化',desc:'競合他社と異なる独自の価値・特長を持つこと。価格・品質・サービス・ブランドなど様々な軸での差別化がある。'},{term:'価格競争',desc:'競合他社と価格の引き下げ合いをすること。体力勝負になりやすく、市場全体の収益性を下げるリスクがある。'}]},
  {type:'product',typeLabel:'📦 Product',scene:'オンライン学習プラットフォームで、コース修了率が15%と低い。',q:'Product改善として最も効果的なアプローチはどれか？',opts:['コースの価格を下げて参加のハードルを下げる','コースの内容を増やして充実させる','コース設計をより細かいステップに分け、進捗可視化と達成感を設計し直す','修了できなかったユーザーに返金ポリシーを設ける'],correct:2,why:'オンライン学習の低修了率の主な原因は「継続の難しさ」です。コースが長すぎて途中で挫折するユーザーが多い場合、内容を増やすことは逆効果です。最も効果的なのは、①コースを小さな達成可能なステップに分解する、②進捗バーや修了バッジで達成感を可視化する、③適切なリマインドで学習を促す、という設計変更です。これはゲームの「レベルアップ設計」と同じ原理で、小さな成功体験の積み重ねが継続動機を維持します。Duolingoはこの設計で世界最大の語学学習アプリになりました。',tip:'学習の継続を支えるのは「コンテンツの質」より「続けやすい設計」です。小さな達成感を積み重ねる体験設計が修了率を上げます。',words:[{term:'修了率',desc:'コースや学習プログラムを最後まで完了したユーザーの割合。オンライン学習では平均10〜15%と低く、改善が課題になることが多い。'},{term:'進捗可視化',desc:'学習・作業の進み具合を数値やグラフで見えるようにすること。ユーザーの達成感と継続動機を高める効果がある。'}]},
  {type:'product',typeLabel:'📦 Product',scene:'スマートホームデバイスを開発。技術的には非常に高機能だが、初期設定が複雑でユーザーから苦情が来ている。',q:'最も根本的なProduct改善はどれか？',opts:['詳細な取扱説明書を改善する','カスタマーサポートを24時間対応にする','初期設定プロセスを誰でも5分以内に完了できるよう再設計する','高機能を売りにした上級者向けマーケティングに切り替える'],correct:2,why:'「取扱説明書を読まなければ使えない製品」は現代では競争力を持ちません。Appleがここまで成功した理由の一つは「説明書がなくても直感的に使える設計」へのこだわりです。複雑な初期設定はオンボーディングの最大の障壁で、ここでユーザーが諦めると二度と戻ってきません。取扱説明書の改善やサポート強化は補助的な解決策に過ぎず、根本はProduct自体の設計を「誰でも使えるもの」に変えることです。',tip:'「良い技術」と「良い製品」は別物。どんなに優れた技術も、使いやすく届けられなければ価値になりません。',words:[{term:'直感的なUI',desc:'説明なしでも使い方がわかるインターフェース設計。ユーザーの「当たり前」の行動パターンに合わせることが重要。'},{term:'オンボーディングの障壁',desc:'新しいユーザーが製品を使い始める際に感じる難しさ・手間・不安のこと。ここを下げることが継続率に直結する。'}]},
  {type:'price',typeLabel:'💰 Price',scene:'新しいタスク管理アプリのマネタイズを設計する。投資家から「6ヶ月でマネタイズを開始せよ」とプレッシャーがある。',q:'初期スタートアップとして最適な価格モデルはどれか？',opts:['最初から月額1,500円のサブスクのみ','完全無料で公開してユーザーを集める','基本無料＋プレミアム機能を月額800円（Freemium）','企業向けのみ年間契約10万円〜にする'],correct:2,why:'Freemiumモデルが初期スタートアップに最も適している理由は3つあります。①無料で使えることで参入障壁が下がり、口コミでユーザーが広がりやすい、②価値を体験したユーザーが自然に有料転換するため営業コストが低い、③無料ユーザーのデータから製品改善のフィードバックが大量に得られる。Slack・Dropbox・Notionはすべてこの戦略で成長しました。完全無料は収益化の道が見えず、最初から高額サブスクは認知がない段階では参入障壁が高すぎ、企業向け一本は営業サイクルが長くスタートアップの資金繰りには不向きです。',tip:'Freemiumの無料→有料転換率は平均2〜5%。100人の無料ユーザーがいれば2〜5人が有料になる計算です。無料ユーザーを多く集めることが収益の土台になります。',words:[{term:'Freemium（フリーミアム）',desc:'Free（無料）＋Premium（有料）の造語。基本機能を無料で提供し、高度な機能を有料にするビジネスモデル。Slack・Dropbox・Notionが代表例。'},{term:'有料転換率',desc:'無料ユーザーが有料プランに切り替える割合。フリーミアムモデルでは平均2〜5%程度。'},{term:'営業サイクル',desc:'商談の開始から契約締結までにかかる期間。BtoBは長く（数ヶ月〜1年）、BtoCは短い傾向がある。'}]},
  {type:'price',typeLabel:'💰 Price',scene:'SaaSの月額料金を800円から1,200円に値上げすることを検討している。既存ユーザーが5,000人いる。',q:'値上げの際に最も適切なアプローチはどれか？',opts:['全ユーザーを一斉に新価格に移行する','既存ユーザーは旧価格を維持し、新規ユーザーから新価格を適用する','値上げはユーザーが離れるので絶対にしない','告知なしに自動的に値上げする'],correct:1,why:'既存ユーザーへの突然の値上げは解約率（チャーン率）を急増させます。SaaSビジネスでは既存顧客の維持が最重要で、特に長期利用ユーザーは最も大切にすべき層です。「グランドファザリング（旧価格保護）」は既存ユーザーへの敬意と信頼の表れで、離脱を防ぎながら収益を段階的に改善できます。NetflixやSpotifyも値上げの際には既存ユーザーへの事前告知と段階的な移行を行っています。告知なしの自動値上げは信頼を大きく損ないます。',tip:'値上げは「価値の証明」です。値上げ前に「なぜこの価格になるのか」の理由（新機能・サービス改善）をユーザーに伝えることで受け入れられやすくなります。',words:[{term:'グランドファザリング',desc:'既存契約者に旧価格を継続して適用すること。新規ユーザーには新価格を適用する「既存顧客保護」の手法。'},{term:'チャーン率（解約率）',desc:'一定期間内に解約・離脱した顧客の割合。SaaSではこれを下げることが最重要経営課題。'}]},
  {type:'price',typeLabel:'💰 Price',scene:'高機能なクラウドストレージサービスを提供。100GB・500GB・2TBの3プランを設計している。',q:'ユーザーが中間プランを選びやすくするための価格設計はどれか？',opts:['100GB:300円 / 500GB:500円 / 2TB:2,000円','100GB:300円 / 500GB:980円 / 2TB:2,980円','100GB:無料 / 500GB:980円 / 2TB:1,080円','全プランを同じ価格にする'],correct:1,why:'行動経済学の「極端の回避性」という心理効果により、人は最も安いもの・最も高いものを避け、中間を選ぶ傾向があります。Bの価格設計では、100GB(300円)が安すぎてお得に見え、2TB(2,980円)は高すぎると感じ、500GB(980円)が「ちょうど良い」と感じさせます。これを「おとり効果」または「ゴルディロックス効果」と呼びます。Cのように500GBと2TBの価格差が小さいと「どうせなら2TB」と上位に流れ、バランスが崩れます。',tip:'価格設計は「いくらにするか」より「どう見せるか」が重要。3段階のプランでは中間プランが最も売れるよう設計することがビジネス上の基本です。',words:[{term:'極端の回避性',desc:'人が最も高いものや最も安いものを避け、中間の選択肢を選びやすい心理傾向。価格設計に活用される行動経済学の概念。'},{term:'ゴルディロックス効果',desc:'3つの選択肢があるとき、人は中間の選択肢を選びやすいという心理効果。「ちょうど良い」を演出する価格設計に使われる。'},{term:'おとり効果',desc:'意図的に「選ばせたいプランを選びやすくするための比較対象」を設置する価格戦略。'}]},
  {type:'price',typeLabel:'💰 Price',scene:'新しいオンライン学習コースを販売。同じ内容のコースを「19,800円」と「20,000円」どちらで設定するかを検討している。',q:'心理的価格設定として正しい判断はどれか？',opts:['20,000円の方がきりが良くて信頼感がある','19,800円の方が安く感じるため購入率が上がりやすい','価格差が200円なので違いはない','コースの内容次第で価格設定は関係ない'],correct:1,why:'「端数価格（チャーム・プライシング）」は、19,800円が20,000円より知覚的に大幅に安く感じられる心理現象を利用した価格設定です。人は価格を左から右に読むため、「1」で始まる価格は「2」で始まる価格より心理的に低い段階に置かれます。これはスーパーマーケットから高額商品まで広く使われている手法で、同じ200円の差でも「20,000円→19,800円」はより大きな割引感を生みます。ただし高級ブランドではきりの良い価格の方が「プレミアム感」を演出する場合もあります。',tip:'心理的価格設定は消費者の知覚に働きかける手法。ただしブランドポジションによっては「きりの良い価格」がプレミアム感を演出する逆の効果もあります。',words:[{term:'端数価格（チャーム・プライシング）',desc:'19,800円や9,980円のように、端数を使うことで心理的に安く感じさせる価格設定の手法。'},{term:'価格の知覚',desc:'実際の価格ではなく、消費者が「高い・安い」と感じる主観的な評価のこと。同じ価格でも見せ方で知覚が変わる。'}]},
  {type:'price',typeLabel:'💰 Price',scene:'競合他社が自社製品と全く同じ機能を30%安い価格で提供すると発表した。',q:'価格戦略として最も適切な対応はどれか？',opts:['即座に同じ価格に値下げして対抗する','競合より10%安い価格に設定して勝負する','価格を維持しながら自社の差別化価値（品質・サポート・ブランド）を強化する','市場から撤退する'],correct:2,why:'価格競争に安易に参戦することは収益性を破壊する最も危険な戦略です。特に競合が大きな資金力を持つ場合、価格競争は体力勝負になり自社が先に疲弊します。「なぜユーザーは競合が安くても自社を選ぶのか」という差別化要因を明確にし、そこを強化することが正しいアプローチです。AppleはWindowsと価格競争せず、「デザイン・エコシステム・ユーザー体験」を磨き続け、プレミアム価格を維持しながら成長しました。',tip:'価格競争は最後の手段。「安さ」で選ばれるビジネスは常に「もっと安い競合」に脅かされます。価格以外の価値で選ばれる理由を作ることが持続可能な戦略です。',words:[{term:'価格競争',desc:'競合他社と価格の引き下げ合いをすること。体力勝負になりやすく、市場全体の収益性を下げるリスクがある。'},{term:'プレミアム価格戦略',desc:'競合より高い価格を設定することで、品質・ブランド・ステータスの高さを印象づける価格戦略。'}]},
  {type:'price',typeLabel:'💰 Price',scene:'BtoB SaaSを提供。大企業（従業員1,000人以上）への販売を強化したい。現在は一律月額5,000円のプランのみ。',q:'エンタープライズ向けの価格戦略として最も適切なのはどれか？',opts:['大企業でも同じ月額5,000円を維持する','大企業向けに高機能・高価格のエンタープライズプランを設ける','大企業には特別に値引きして対応する','大企業向けの価格はケースバイケースで都度交渉する'],correct:1,why:'エンタープライズ企業はSMB（中小企業）と全く異なるニーズを持っています。セキュリティ・SSO（シングルサインオン）・SLA（サービスレベル保証）・専任サポート・カスタム機能などが求められ、それに見合った高価格は正当化されます。また大企業は「安すぎるサービスは信頼できない」と感じる傾向があります。エンタープライズプランを設けることで、中小企業向けの価格も「スタンダード感」が生まれます。Slack・Zoom・Notionも全てエンタープライズプランを持っています。',tip:'エンタープライズ営業は価格より「信頼・セキュリティ・サポート体制」が重視されます。価格を下げるより価値を上げる方が大企業には刺さります。',words:[{term:'エンタープライズ',desc:'大企業・大規模組織を指すビジネス用語。一般的に従業員1,000人以上の企業を指すことが多い。'},{term:'SSO（シングルサインオン）',desc:'一つのID・パスワードで複数のサービスにログインできる仕組み。大企業のセキュリティ管理に必須とされることが多い。'},{term:'SLA（サービスレベル保証）',desc:'サービスの稼働率・応答時間・サポート品質などを保証する契約。エンタープライズ向けサービスでは必須とされることが多い。'}]},
  {type:'price',typeLabel:'💰 Price',scene:'月額課金のフィットネスアプリを提供。年払いプランを追加することを検討している。月額1,200円で、年払いにするといくらが適切か？',q:'年払いの価格設定として最も効果的なのはどれか？',opts:['12ヶ月分そのままの14,400円','2ヶ月分無料の10,000円（月換算833円）','1ヶ月分無料の13,200円（月換算1,100円）','月額より高い16,000円にして特典をつける'],correct:1,why:'年払いの最大の目的は「チャーン率を下げること」と「キャッシュフローの改善」です。「2ヶ月分無料（約17%オフ）」は、ユーザーに「かなりお得」と感じさせながら、年間の継続コミットメントを取り付けられます。月額と同額の年払いは選ぶ動機がなく、1ヶ月分無料（8%オフ）は「お得感」が薄い。年払いをしたユーザーは解約率が月払いより大幅に低くなる傾向があり（既に1年分払っているため）、LTV向上に直結します。',tip:'年払いは「ユーザーへの割引」であると同時に「解約率を下げる最も効果的なProduct設計」の一つ。キャッシュフローも一括で改善されます。',words:[{term:'キャッシュフロー',desc:'事業に入ってくるお金と出ていくお金の流れ。年払いは一度に現金が入るためキャッシュフロー改善効果が高い。'},{term:'LTV（Life Time Value）',desc:'一人の顧客が生涯を通じてもたらす総利益・総売上。年払いユーザーはLTVが高い傾向がある。'}]},
  {type:'price',typeLabel:'💰 Price',scene:'高級ブランドのコスメをECサイトで販売。あるブランドから「もっと安く売ってほしい」という要望が来た。',q:'高級ブランド製品の価格戦略として最も正しい考え方はどれか？',opts:['安くすれば多く売れるので値下げすべき','高級ブランドの価格は維持すべきで、値下げはブランド価値を毀損する','セール時のみ割引して平常時は定価を維持する','競合より安い価格に設定してシェアを取る'],correct:1,why:'高級ブランドの価格は「機能的価値」だけでなく「感情的価値・ステータス価値」を含みます。HermesやLouis Vuittonが決してセールをしない理由は、値下げが「誰でも買える」ブランドという認識を生み、希少性・高級感というブランドの核心的価値を破壊するからです。高級コスメも同様で、価格を下げることで「このブランドはそれほどでもない」という知覚が生まれます。高級品の価格は「高いから価値がある」という逆説的な関係（ヴェブレン効果）が働きます。',tip:'高級品の価格は「コストの積み上げ」ではなく「ブランド価値の表現」です。値下げはブランドの価値を下げる自傷行為になりかねません。',words:[{term:'ブランド価値',desc:'消費者がブランドに対して感じる信頼・感情・ステータスなどの総合的な評価。'},{term:'ヴェブレン効果',desc:'価格が高いほど需要が増える現象。高級品・贅沢品において「高いから良い・高いから欲しい」という心理が働く。'}]},
  {type:'price',typeLabel:'💰 Price',scene:'スタートアップが新しいプロジェクト管理ツールをリリースする予定。価格をいくらにするか決められていない。',q:'価格設定の最も良いアプローチはどれか？',opts:['コストに利益を乗せたコストプラス法で計算する','競合製品と同じ価格にする','ターゲットユーザーが「高い」と感じる価格より少し低く設定する','まず無料で提供してユーザー数が増えてから考える'],correct:2,why:'価格設定の最も重要な基準は「ユーザーが感じる価値」です。コストプラス法は製品の価値ではなくコストを基準にするため、値付けが低すぎたり高すぎたりするリスクがあります。競合と同じ価格は差別化なしの戦略で、自社の価値を正しく反映しません。ターゲットユーザーへのインタビューで「いくらなら払う？」「いくらなら高い？」を調査し、その価格帯の中に設定するVan Westendorp法が実践的です。',tip:'価格は「作る側のコスト」ではなく「買う側の感じる価値」で決まります。ユーザーインタビューで「支払い意欲（Willingness to Pay）」を確認してから設定しましょう。',words:[{term:'コストプラス法',desc:'製造コストや原価に一定の利益を上乗せして価格を決める方法。シンプルだが市場の価値認識とズレが生じやすい。'},{term:'Van Westendorp法',desc:'「安すぎる・高すぎる・少し高い・少し安い」の4質問でユーザーの価格感度を調査する手法。適正価格範囲の特定に使われる。'},{term:'支払い意欲（WTP）',desc:'消費者が製品・サービスに対して最大いくらまで払えるかという意思の大きさ。価格設定の重要な基準。'}]},
  {type:'price',typeLabel:'💰 Price',scene:'フリーランス向けの請求書作成ツールを提供。月額300円と月額1,500円の2プランがある。ほとんどのユーザーが300円プランを選んでいる。',q:'1,500円プランへの移行を促すための最も効果的な戦略はどれか？',opts:['300円プランの機能を削減する','1,500円プランの価値（節税機能・確定申告連携など）をより明確に訴求する','中間に800円プランを追加する','1,500円プランを月額1,200円に値下げする'],correct:1,why:'価格プランへの移行が起きない理由は多くの場合「上位プランの価値が伝わっていない」ことです。1,500円プランに「確定申告との自動連携」「税理士相談機能」「売上分析レポート」などフリーランスにとって時間節約・収益向上に直結する機能があれば、月額1,200円の差は十分に正当化されます。この価値が伝わっていなければ、値下げしても同じ問題が起きます。機能削減は既存ユーザーの不満を生み、価格引き下げは収益性を下げるだけです。',tip:'上位プランへの移行は「価格の問題」より「価値の伝え方の問題」であることがほとんど。「このプランにするといくら得か」をユーザーに見せましょう。',words:[{term:'価値訴求',desc:'製品・サービスが顧客にもたらすメリット・ベネフィットを明確に伝えること。「何ができるか」より「何が得られるか」を伝える。'},{term:'アップセル',desc:'現在の商品より上位・高額なものを勧めること。既存顧客へのアップセルは新規獲得より低コストで売上を増やせる。'}]},
  {type:'price',typeLabel:'💰 Price',scene:'マーケティングエージェンシーが新サービス「SNS運用代行」の価格を設定する。',q:'最も収益性が高い価格設定モデルはどれか？',opts:['月額一律10万円の固定価格','投稿数に応じた従量課金（1投稿5,000円）','基本月額10万円＋成果に応じたボーナス報酬','最初の3ヶ月は無料でその後有料にする'],correct:2,why:'「基本固定費＋成果連動ボーナス」の混合モデルは代理店ビジネスに最も適した価格設計です。固定費で安定収益を確保しながら、成果が出た場合の上乗せでアップサイドも取れます。さらに「成果が出れば追加で払う」という仕組みはクライアントの継続意欲を高め、長期契約に繋がります。従量課金は投稿数が少ない月に収益が下がるリスクがあり、完全成果報酬は初期の工数コストを回収できないリスクがあります。',tip:'代理店ビジネスの価格設計は「固定費で安全網を作り、成果連動で上限を設けない」混合モデルが最も収益性と継続率を両立させます。',words:[{term:'従量課金',desc:'使用量・成果・回数に応じて料金が変わる課金モデル。使った分だけ払う仕組み。'},{term:'成果報酬',desc:'サービスの成果（売上増・フォロワー増など）に連動して報酬が変わる契約形態。リスクとリターンを共有する。'}]},
  {type:'place',typeLabel:'🏪 Place',scene:'BtoBアプリを運営。個人ユーザーから「職場でも使いたい」という声が増えてきた。B2B展開を検討している。',q:'B2B展開で最初に優先すべき販売チャネルはどれか？',opts:['テレビCMで認知を広げる','既存ユーザーのボトムアップ（職場への持ち込み）を活用する','大手商社と代理店契約を結ぶ','展示会・セミナーのみに集中する'],correct:1,why:'ボトムアップ戦略（PLG：Product-Led Growth）は、個人ユーザーが職場に持ち込み、チーム導入につながるモデルです。Slack・Zoom・Figmaが証明した最も強力なB2B成長エンジンで、自社のファンが営業になるため高額な広告費が不要です。「上司から導入を指示される」トップダウンより、「現場から使い始めてボトムアップで広がる」方が定着率も高い。テレビCMは大量の資金が必要で、代理店・展示会は時間とコストがかかります。',tip:'PLGの成功に最も重要なのは「製品自体が口コミで広がりやすいこと」。個人が使い始めて「チームでも使おう」と思えるような設計（共有機能・招待機能）が鍵です。',words:[{term:'PLG（Product-Led Growth）',desc:'製品そのものが成長エンジンとなる戦略。ユーザーが製品を使いながら自然に他のユーザーを招待・紹介する仕組みを持つ。'},{term:'ボトムアップ',desc:'現場の個人が使い始めて、そこから組織全体に広がっていく浸透モデル。トップダウン（上から指示）の逆。'}]},
  {type:'place',typeLabel:'🏪 Place',scene:'高品質な職人手作り革製品を販売している。これまで自社ECサイトのみで販売してきたが、売上が頭打ちになってきた。',q:'販売チャネル拡大として最も適切な選択はどれか？',opts:['Amazonに出品して大量販売を目指す','セレクトショップや百貨店との取り扱い交渉をする','大手量販店での販売を目指す','価格を下げてより多くの人に届ける'],correct:1,why:'高品質な職人製品は「どこで売るか」がブランド価値に直結します。Amazonや大手量販店での販売は数量を増やせますが、安売り商品と並べられてブランドイメージを損なうリスクがあります。一方、センスのあるセレクトショップや百貨店への出品は「ここに置かれているから良いもの」というブランドの信頼を強化します。チャネル選択はブランドポジションの表現です。',tip:'チャネルはブランドそのものです。高級ブランドがコンビニで売られていたら価値が下がるのと同じで、どこで売るかがブランドイメージを作ります。',words:[{term:'チャネル',desc:'製品を顧客に届けるための経路・手段のこと。直販・EC・小売店・代理店・卸など様々な選択肢がある。'},{term:'ブランドポジション',desc:'競合と比較して、ターゲット顧客の心の中で自社ブランドがどのような位置に置かれているかを示す概念。'}]},
  {type:'place',typeLabel:'🏪 Place',scene:'スタートアップがグローバル展開を検討。国内で5万ユーザーを達成した。',q:'グローバル展開で最初に狙うべき市場はどれか？',opts:['人口最大の中国市場にまず参入する','全世界同時展開で一気にスケールする','英語圏（米国）を最初の市場に選びそこで実績を作る','東南アジア5カ国に同時展開する'],correct:2,why:'テックアプリのグローバル展開で米国市場は必須かつ最大のプレステージです。成功すればProduct HuntやTechCrunchに取り上げられ、世界中から注目されます。英語でのサービス展開は他の英語圏（英国・カナダ・オーストラリア）への展開も同時に可能になります。中国はアプリ規制・データ規制・ローカライズのコストが膨大で、初期スタートアップには不向きです。全世界同時展開はリソースが分散して全て中途半端になります。',tip:'グローバル展開は「一つの市場で証明してから次へ」が基本。最初の海外市場での成功事例が、次の市場への信頼になります。',words:[{term:'ローカライズ',desc:'製品・サービスを特定の地域の言語・文化・規制に合わせて適応させること。単なる翻訳を超えた現地化が必要。'},{term:'プレステージ',desc:'評判・信頼・権威のこと。米国市場での成功は世界市場への参入においてプレステージを高める効果がある。'}]},
  {type:'place',typeLabel:'🏪 Place',scene:'美容院がInstagram・LINE・電話・来店の4つの予約チャネルを持っているが、スタッフの管理が煩雑になっている。',q:'チャネル戦略として最も適切な対応はどれか？',opts:['全チャネルを統合管理できる予約システムを導入する','電話のみに一本化してシンプルにする','InstagramとLINEのみに絞る','予約チャネルをさらに増やして顧客の利便性を上げる'],correct:0,why:'複数のチャネルを持つこと自体は顧客利便性のために正しい判断ですが、管理が煩雑になると予約漏れ・ダブルブッキングなどのサービス品質低下につながります。正しいアプローチは「チャネルを減らす」のではなく「全チャネルを一元管理できるシステムを導入する」ことです。これを「オムニチャネル管理」と呼び、顧客にとってはどのチャネルを使っても一貫した体験が得られ、スタッフにとっては1画面で全予約を管理できる状態を実現します。',tip:'チャネルは「多い方が良い」と「管理できる範囲に絞る」のバランスが重要。チャネルを増やすなら必ずバックオフィスの管理体制を同時に整備しましょう。',words:[{term:'オムニチャネル',desc:'複数の販売・接客チャネルを統合し、顧客がどのチャネルを使っても一貫した体験を提供する戦略。'},{term:'一元管理',desc:'複数の情報・データ・業務を1つのシステム・場所でまとめて管理すること。効率化とミス防止に効果的。'}]},
  {type:'place',typeLabel:'🏪 Place',scene:'スマートフォンケースを販売するブランドが、Amazonへの出品とD2C（自社EC）のどちらに力を入れるか検討している。',q:'長期的なブランド構築の観点から最も正しい判断はどれか？',opts:['Amazonのみに絞って販売量を最大化する','D2Cのみで展開してブランドを完全にコントロールする','Amazonで認知を広げながらD2Cの育成に並行して投資する','どちらもやらずに実店舗のみにする'],correct:2,why:'AmazonとD2Cはそれぞれ異なる強みを持ちます。Amazonは「購買意図のある顧客への到達」に優れ、D2Cは「顧客データの取得・ブランド体験の設計・LTVの最大化」に優れています。Amazon依存は「Amazonが手数料を上げた・突然出品停止になった」というプラットフォームリスクを持ちます。正しいアプローチはAmazonで認知と初期顧客を獲得しながら、D2CでLTVの高い顧客基盤を育てる並行戦略です。',tip:'Amazonは「集客装置」、D2Cは「関係構築装置」として使い分けるのが最も効果的です。どちらか一方に依存するのが最大のリスクです。',words:[{term:'D2C（Direct to Consumer）',desc:'メーカーや生産者が中間業者を介さず、直接消費者に販売するビジネスモデル。顧客データと利益率を最大化できる。'},{term:'プラットフォームリスク',desc:'特定のプラットフォーム（Amazon・SNSなど）への依存から生じるリスク。ルール変更や突然の停止が事業に大きな影響を与える可能性がある。'}]},
  {type:'place',typeLabel:'🏪 Place',scene:'学習塾を運営している。コロナ禍を経てオンライン授業への需要が増えた。対面とオンラインをどう組み合わせるか検討している。',q:'最も効果的なチャネル戦略はどれか？',opts:['対面のみに戻す','オンラインのみに切り替える','対面・オンラインのハイブリッドで、生徒のニーズに合わせて選べるようにする','対面授業の価格を下げてオンラインに対抗する'],correct:2,why:'OMO（Online Merges with Offline）の考え方で、オンラインとオフラインを「どちらか」ではなく「どちらも」という選択肢として設計することが現代のサービス業に求められます。対面は「質問しやすい・集中できる・友人ができる」、オンラインは「通学時間ゼロ・録画で復習できる・遠方でも受講可能」という異なる価値があります。生徒・保護者が自分のライフスタイルに合わせて選べる柔軟性が差別化になります。',tip:'現代のサービス業はオンラインとオフラインを「融合させる」視点が重要。「どちらか」という二項対立から「どちらも活かす」設計に発想を転換しましょう。',words:[{term:'OMO（Online Merges with Offline）',desc:'オンラインとオフラインを融合させた顧客体験を設計する考え方。どちらかに絞るのではなく、両者の良さを活かす。'},{term:'ハイブリッド',desc:'2つの異なる要素を組み合わせた状態。対面とオンラインのハイブリッドは両方の利点を活かせる。'}]},
  {type:'place',typeLabel:'🏪 Place',scene:'食品メーカーが新しいプロテインバーを発売。スーパー・コンビニ・ジム・ECのどこで最初に販売するか決める必要がある。',q:'ターゲットが「筋トレをしている20〜30代男性」の場合、最初のチャネルとして最も適切なのはどれか？',opts:['スーパーマーケット','コンビニ','フィットネスジムの売店・自動販売機','大手ECサイト'],correct:2,why:'フィットネスジムはターゲット（筋トレをしている男性）が確実にいる「ターゲット濃度の高い場所」です。さらに「運動後にプロテインを補給する」という購買コンテキスト（状況）と完全に一致しています。スーパー・コンビニは量的リーチは広いですが、ターゲット外の購買も多くプロモーション効率が下がります。ECは購買意図がある人には強いですが、ブランド認知がない段階では発見されにくい。最初は「ターゲット濃度が高い場所」からスタートし、実績を作ってから横展開するのが定石です。',tip:'「どこで売るか」はターゲットが「どこで・どんな気持ちで」購買しやすいかを起点に考えましょう。量より「ターゲット濃度」が初期チャネル選定の鍵です。',words:[{term:'購買コンテキスト',desc:'顧客が購買する際の状況・気持ち・タイミングのこと。同じ製品でも購買コンテキストによって反応が変わる。'},{term:'ターゲット濃度',desc:'特定の場所・チャネルにどれだけターゲット顧客が集まっているかの密度。初期展開では濃度の高い場所から始めるのが効率的。'}]},
  {type:'place',typeLabel:'🏪 Place',scene:'コーヒーブランドがサブスクリプションで豆を定期配送している。新たにコンビニでのカップコーヒー販売を検討している。',q:'このチャネル拡大が持つ最大のリスクはどれか？',opts:['コンビニとの契約交渉が難しい','コンビニのコーヒーとサブスク会員の既存顧客が競合してサブスク解約を招くカニバリゼーション','コンビニの価格帯に合わせると利益率が下がる','ブランドイメージとコンビニのイメージが合わない'],correct:1,why:'カニバリゼーション（共食い）は複数チャネルを展開する際の最大のリスクです。コンビニで気軽に購入できるようになることで、「わざわざサブスクで定期注文しなくていいか」と感じる既存サブスク会員が増え、解約率が上がる可能性があります。チャネルを増やす際は「新しいチャネルが既存チャネルを侵食しないか」を必ず検討する必要があります。',tip:'チャネル拡大は「売上の増加」だけでなく「既存チャネルへの影響」を常にセットで考えましょう。新チャネルが既存顧客を奪わないよう設計することが重要です。',words:[{term:'カニバリゼーション',desc:'自社の複数の製品・チャネルが互いの顧客を奪い合う現象（共食い）。新チャネル展開時に必ず検討すべきリスク。'},{term:'サブスクリプション（サブスク）',desc:'月額・年額などの定期料金を支払うことでサービスを継続利用できるビジネスモデル。'}]},
  {type:'place',typeLabel:'🏪 Place',scene:'子ども向けプログラミング教育サービスを学校に導入してもらおうとしている。',q:'学校へのPlace（流通）戦略として最も効果的なアプローチはどれか？',opts:['各学校に個別に営業メールを送る','教育委員会や文部科学省との連携でトップダウンに採用を促す','パイロット校（試験導入校）での実績を作りその事例で他校へ横展開する','テレビCMで保護者の需要を喚起して学校からの問い合わせを増やす'],correct:2,why:'学校への導入において「実績のある学校が使っている」という事実は最も強い説得力を持ちます。教育機関はリスク回避志向が強く、新しいサービスの導入に慎重です。パイロット校での成功事例があることで①他の学校の「うちも試してみたい」という動機が生まれる②教師・生徒からの具体的なフィードバックが得られる③費用対効果の数字が示せる、という3つのメリットがあります。',tip:'B2B・公共機関への販売では「事例・実績」が最も強い営業ツールになります。まず1社・1校で成功事例を作ることに全力を注ぎましょう。',words:[{term:'パイロット（試験導入）',desc:'本格展開の前に限定的な範囲で試験的に導入すること。問題点の発見と実績作りを同時に行える。'},{term:'横展開',desc:'ある場所・顧客での成功事例を他の場所・顧客に展開すること。パイロットの成功が横展開の燃料になる。'}]},
  {type:'place',typeLabel:'🏪 Place',scene:'ハンドメイドアクセサリーを販売している作家がメルカリとミンネを利用している。売上を伸ばすために何を追加すべきか検討している。',q:'最も戦略的なチャネル拡張はどれか？',opts:['さらに多くのフリマアプリに登録する','Instagramでブランドアカウントを育てて自社ECに誘導する仕組みを作る','百貨店での出店を目指す','近隣のセレクトショップに卸す'],correct:1,why:'メルカリ・ミンネへの依存は「プラットフォームのルール変更・手数料引き上げ・突然のアカウント停止」というリスクを常に抱えます。Instagramで「ブランドの世界観・制作プロセス・作品」を継続的に発信してフォロワーを育て、自社ECに誘導することで「手数料ゼロ・顧客データ取得・価格コントロール」の直販基盤を作れます。フリマアプリ追加は管理コストが増えるだけで根本的解決にならず、百貨店・セレクトショップは初期の知名度がない段階では難しい。',tip:'ハンドメイド作家の最終的な目標は「プラットフォームに頼らず直接顧客と繋がること」。SNSは顧客との直接接点を作る最も低コストのチャネルです。',words:[{term:'プラットフォームリスク',desc:'特定のプラットフォームへの依存から生じるリスク。ルール変更・手数料引き上げ・アカウント停止が突然起きる可能性がある。'},{term:'自社EC',desc:'自分で運営する直販サイト。Shopify・BASE・STORESなどのツールで構築できる。手数料が低く顧客データも取得できる。'}]},
  {type:'place',typeLabel:'🏪 Place',scene:'BtoB向けソフトウェアをオンラインのみで販売している。大手企業への導入が進まない原因を分析したところ「担当者に会って話したい」という声が多かった。',q:'Place戦略として最も効果的な対応はどれか？',opts:['オンラインのみの販売を継続して待つ','対面営業チームを設置して大手企業向けに直販対応する','パートナー企業（SI・コンサル）を通じた間接販売チャネルを構築する','価格を下げてオンラインでの決断を促す'],correct:2,why:'大手企業への販売では「信頼できるパートナーが推薦してくれた」という情報の経路が購買決定に大きく影響します。SI（システムインテグレーター）・コンサルティング会社・業界特化のパートナーが「この製品を使うべき」と推薦してくれるチャネルを構築することで、信頼の問題を解決できます。さらにパートナーは既に大手企業との関係を持っているため、営業コストを下げながらリーチを拡大できます。',tip:'BtoB企業の「信頼」は製品の機能だけでなく「誰が勧めているか」に大きく依存します。チャネルパートナー戦略は信頼を借りる最も効率的な方法です。',words:[{term:'SI（システムインテグレーター）',desc:'企業のITシステムを設計・構築・運用する会社。大手企業との関係が深く、ソフトウェア販売の重要チャネルになることが多い。'},{term:'間接販売チャネル',desc:'自社が直接販売するのではなく、代理店・パートナー・卸業者などを通じて製品を顧客に届ける販売形態。'}]},
  {type:'place',typeLabel:'🏪 Place',scene:'クラフトビールブランドが醸造所に隣接したタップルームを開いている。遠方の顧客から「買えない」という声が増えてきた。',q:'チャネル拡大として最も効果的な順序はどれか？',opts:['全国のスーパーチェーンと交渉する','まず自社ECサイトを開設して直販し、その後地域の飲食店・酒販店に卸す','大手ビールメーカーと提携して流通を委託する','コンビニチェーンへの全国展開を目指す'],correct:1,why:'クラフトビールのブランド力はローカル・手作り・ストーリーにあります。チャネル拡大の順序は「ブランド価値を守りながら段階的に広げること」が重要です。まず自社ECで直販することで①顧客データが取れる②利益率が高い③ブランドコントロールができる、の3つを確保します。次に価値観の合う飲食店・酒販店に卸すことで「セレクトされた場所で飲める」というプレミアム感を維持します。',tip:'クラフトブランドのチャネル展開は「量を取るか価値を守るか」のトレードオフです。段階的に、ブランド価値を守れるチャネルから広げていくことが長期的に正解です。',words:[{term:'卸（おろし）',desc:'製造者から小売店・飲食店などに商品をまとめて販売すること。直販より利益率は下がるが、流通範囲を広げられる。'},{term:'ブランド価値の希釈',desc:'チャネルや流通を広げすぎることで、そのブランドの希少性・高級感・特別感が失われること。'}]},
  {type:'place',typeLabel:'🏪 Place',scene:'フィットネスジムが郊外の大型店舗のみで展開している。都心のOLをターゲットにした小型スタジオを開くかどうかを検討している。',q:'Place戦略として最も重要な検討事項はどれか？',opts:['家賃が高い都心は避けて郊外を増やす','ターゲット（都心OL）が通いやすい立地・業態かを最優先に確認する','まず全国チェーンを目指して多店舗展開する','既存店と全く同じ業態で都心に出店する'],correct:1,why:'「場所」は物理的なビジネスにとって最も重要なProductの一部です。都心OLをターゲットにするならば、「職場から徒歩5分・更衣室が綺麗・30分でできるプログラム・仕事帰りに立ち寄れる時間帯営業」という立地・業態の設計が必要です。大型郊外店をそのまま都心に持ってくるでは、ターゲットのライフスタイルと合いません。',tip:'物理的なビジネスの立地選択は最初に決めると後から変えにくい最重要戦略。「ターゲットが自然に通りがかる場所」を起点に考えましょう。',words:[{term:'生活導線',desc:'ターゲット顧客が日常生活の中で移動・行動するルートや行動パターンのこと。立地選択の最重要な考慮事項。'},{term:'業態',desc:'ビジネスのスタイル・形式のこと。大型店・小型店・セルフ型・スタッフ型など、業態が異なると顧客層や運営方法も変わる。'}]},
  {type:'promotion',typeLabel:'📣 Promotion',scene:'スタートアップが新しいタスク管理アプリをリリース。マーケティング予算は月10万円。まず1,000人のアクティブユーザー獲得がKPI。',q:'最もROIが高い初期Promotion施策はどれか？',opts:['Instagram広告に全額投下する','Product Hunt掲載＋プレスリリースで注目を集める','インフルエンサー1人に10万円で依頼する','SEO記事を20本作成して検索流入を狙う'],correct:1,why:'Product Huntへの掲載は無料でテック系ユーザーへ集中リーチでき、「今日のプロダクト」に選ばれればTechCrunchなどのメディアが取材に来ることがあります。プレスリリースと組み合わせると初日で数百〜数千ユーザーを獲得できた事例も多い。Instagram広告は10万円では認知獲得にとどまりCVRが低くなりがちです。インフルエンサー1人への集中投資はハイリスクで効果が読めません。SEO記事は長期的には最強ですが成果が出るまで3〜6ヶ月かかります。',tip:'初期スタートアップのPromotion鉄則は「少額で最大の注目を集める場所を選ぶこと」。Product Huntはテック系スタートアップにとって最もコスパの高い発表の場です。',words:[{term:'Product Hunt',desc:'新しいプロダクト・アプリを発見・共有するアメリカのプラットフォーム。テック系ユーザーやメディアが多く集まり、掲載されると一気に認知が広がる。'},{term:'ROI（Return On Investment）',desc:'投資に対してどれだけのリターンが得られたかを示す指標。ROIが高い＝少ない費用で大きな成果。'},{term:'CVR（Conversion Rate）',desc:'訪問者のうち目標行動（登録・購入など）を達成した割合。'}]},
  {type:'promotion',typeLabel:'📣 Promotion',scene:'食品メーカーがInstagramで新商品を宣伝しようとしている。フォロワーが100万人いるインフルエンサーと50万人いるインフルエンサーのどちらに依頼するか迷っている。',q:'インフルエンサー選定で最も重要な判断基準はどれか？',opts:['フォロワー数が多い方を選ぶ','エンゲージメント率とフォロワーとブランドの関連性','報酬が安い方を選ぶ','有名人であることを優先する'],correct:1,why:'インフルエンサーマーケティングで最も重要なのはフォロワー数ではなくエンゲージメント率（いいね・コメント・シェアの割合）と「フォロワーと製品の親和性」です。100万フォロワーでエンゲージメント率0.5%のインフルエンサーより、10万フォロワーでエンゲージメント率5%の食品専門インフルエンサーの方が、実際の購買に繋がる可能性が高い。',tip:'インフルエンサーの選定基準は「フォロワーが多い」より「フォロワーと製品のターゲットが一致しているか」「エンゲージメントが高いか」を優先してください。',words:[{term:'エンゲージメント率',desc:'投稿へのいいね・コメント・シェアなどのリアクション数をインプレッション（表示回数）で割った割合。フォロワーとの関係の深さを示す。'},{term:'インフルエンサーマーケティング',desc:'フォロワーに影響力を持つSNSユーザーを活用して製品・ブランドを広める手法。フォロワーとの信頼関係が効果を左右する。'}]},
  {type:'promotion',typeLabel:'📣 Promotion',scene:'Eコマースサイトでカート放棄率（カートに入れたのに購入しなかった割合）が70%と高い。',q:'最も効果的なPromotion施策はどれか？',opts:['SNS広告の予算を増やす','カート放棄後24時間以内にメールでリマインドを送る','商品ページのデザインを全面刷新する','割引キャンペーンを常時実施する'],correct:1,why:'カート放棄ユーザーは「購買意図が最も高い」ユーザー層です。何らかの理由（迷い・支払い情報入力の面倒・他比較）で離脱しただけで、正しいタイミングのリマインドで購買に戻る確率が高い。カート放棄後24時間以内のメールは最も効果が高く、カート放棄者の5〜15%が購買に戻るとされています。SNS広告増加は別のユーザーへのアプローチで即効性がなく、割引の常時実施はブランド価値を下げます。',tip:'カート放棄メールはEコマースで最もROIが高い施策の一つ。「放棄後1時間以内の最初のメール」が最も効果的で、件名に「忘れていませんか？」などのパーソナライズが効きます。',words:[{term:'カート放棄率',desc:'ECサイトでカートに商品を追加したが購入を完了しなかったユーザーの割合。平均70%前後と言われ、改善の余地が大きい。'},{term:'リマインドメール',desc:'行動を忘れているユーザーに思い出させるために送るメール。カート放棄・予約確認などに使われる。'}]},
  {type:'promotion',typeLabel:'📣 Promotion',scene:'BtoB SaaSがコンテンツマーケティングを始めようとしている。どのコンテンツから作るべきか検討中。',q:'BtoB企業のコンテンツマーケティングで最初に作るべきコンテンツはどれか？',opts:['自社サービスの紹介動画','ターゲット顧客が検索するキーワードに対応した課題解決記事','会社のSNSを更新するための投稿','プレスリリース'],correct:1,why:'BtoBのコンテンツマーケティングはSEOと連動させることで最大効果が出ます。ターゲット顧客が「採用管理 効率化 方法」「勤怠管理 ソフト 比較」などで検索するキーワードに対応した記事を作ることで、購買意図がある顧客が自社サイトに流入します。自社紹介動画はすでに認知がある人向けで、認知ゼロの状態では見てもらえません。',tip:'BtoBのコンテンツは「顧客が困っているときに検索するキーワード」から逆算して作ることが鉄則。「何が書きたいか」ではなく「顧客が何を知りたいか」が出発点です。',words:[{term:'コンテンツマーケティング',desc:'有益なコンテンツを提供して見込み客を集め育てるマーケティング。広告と違い、コンテンツは資産として積み上がる。'},{term:'SEO（Search Engine Optimization）',desc:'検索エンジンで上位表示されるようにサイトを改善する施策。良質なコンテンツが基本。'},{term:'キーワード',desc:'ユーザーが検索エンジンに入力する言葉。ターゲット顧客が検索するキーワードを狙ってコンテンツを作ることが重要。'}]},
  {type:'promotion',typeLabel:'📣 Promotion',scene:'地方の中小企業がデジタルマーケティングを始めたい。予算は月5万円。何から始めるべきかを検討している。',q:'最も効果的なPromotion施策の優先順位はどれか？',opts:['テレビCMを検討する','Googleビジネスプロフィール（旧Googleマイビジネス）の最適化から始める','InstagramとTikTokを同時に始める','自社アプリを開発する'],correct:1,why:'地方・中小企業にとって最もROIが高い初期施策はGoogleビジネスプロフィールの最適化です。無料で使え、「地域名＋業種」検索での上位表示、口コミ管理、写真・営業時間の更新ができます。地域住民が「近くのラーメン屋」「近くの美容院」で検索するときに表示されることは、地域ビジネスにとって最重要の集客チャネルです。',tip:'地方・中小企業のデジタルマーケティングはGoogleビジネスプロフィールから始めましょう。無料で始められ、効果が出るまでの速さも1〜2週間と早い。',words:[{term:'Googleビジネスプロフィール',desc:'Googleが提供する無料のビジネス情報掲載サービス。Google検索・Googleマップでの表示、口コミ管理ができる地域ビジネスの必須ツール。'},{term:'ローカルSEO',desc:'特定の地域での検索結果で上位表示されるための最適化。地域名＋業種のキーワードで上位に出ることが目的。'}]},
  {type:'promotion',typeLabel:'📣 Promotion',scene:'語学学習アプリが「英語学習を始めたい人」をターゲットにしたSNS広告を出している。CTRは高いがCVR（ダウンロード率）が低い。',q:'CVRを改善するための最も効果的なアプローチはどれか？',opts:['広告予算を増やしてインプレッションを上げる','広告のターゲット設定を見直し、LPのメッセージを広告と一致させる','別のSNSプラットフォームに乗り換える','広告のクリエイティブ（画像・動画）を変える'],correct:1,why:'CTRが高いのにCVRが低い場合、「広告に興味を持ってクリックしたが、LPに来たら期待と違った」という広告とLPのメッセージのミスマッチが最も多い原因です。「英語を3ヶ月でペラペラに！」という広告をクリックして来たユーザーが、LP上で別のメッセージを見ると「あれ、違う」となります。広告とLPのメッセージを完全に一致させることで転換率が改善します。',tip:'CTR（クリック率）が高いのにCVR（転換率）が低い場合は「広告とLPのメッセージのミスマッチ」を疑いましょう。広告でした約束をLPで履行することが重要です。',words:[{term:'CTR（Click Through Rate）',desc:'広告が表示された回数のうちクリックされた割合。CTRが高い＝広告に興味を持った人が多い。'},{term:'LP（ランディングページ）',desc:'広告などから来たユーザーを特定の行動（申込・ダウンロードなど）に誘導するための1枚ページ。'},{term:'メッセージの一致',desc:'広告で伝えたメッセージとLPで伝えるメッセージが統一されていること。ユーザーの期待とのズレをなくすことでCVRが上がる。'}]},
  {type:'promotion',typeLabel:'📣 Promotion',scene:'ECサイトで「送料無料」と「10%オフ」の2つのオファーをどちらにするか検討している。同等のコストがかかる。',q:'コンバージョン率向上に最も効果的なオファーはどれか？',opts:['10%オフの方が金額的メリットが明確で効果的','送料無料の方がコンバージョン率を上げやすい','どちらも同じ効果なので商品カテゴリで使い分ける','両方同時に提供する'],correct:1,why:'数多くの研究と実践事例で「送料無料は10%オフより高いCVRを生む」ことが確認されています。心理的な理由として「送料は余計なコスト・損失の感覚」があり、「送料が0になる」という完全な除去の方が「価格が10%安くなる」という割引より強く動機づける（損失回避性）からです。',tip:'「送料無料」は消費者の最大の離脱原因（送料の発生）を消す施策。「割引」は得する感覚を与えますが、「無料」は損する感覚を消す効果があり、より強く機能します。',words:[{term:'損失回避性',desc:'人は「得をする」より「損をしない」ことを強く動機づけられる心理傾向。「送料がかかる」という損失を避けるために行動する。'},{term:'オファー',desc:'顧客に提供する特典・条件のこと。割引・送料無料・ポイントなどが代表的なオファー形式。'}]},
  {type:'promotion',typeLabel:'📣 Promotion',scene:'SaaSスタートアップが「紹介プログラム」を導入することを検討している。',q:'最も効果的な紹介プログラムの設計はどれか？',opts:['紹介した人のみに報酬を与える','紹介した人と紹介された人の両方に報酬を与える「両面報酬」','紹介された人のみに割引を提供する','報酬ではなくバッジ・称号で感謝する'],correct:1,why:'紹介プログラムの最も成功した設計は「紹介した人と紹介された人の両方に報酬を与えること（両面報酬）」です。Dropboxが「紹介で双方がストレージ増量」という仕組みで爆発的成長を遂げた事例が代表例です。紹介する側にとって「友人に得をさせてあげられる」という動機が加わり、紹介されやすくなります。',tip:'紹介プログラムの鍵は「紹介する人が友人に自信を持って勧められるか」。自分も得するだけでなく「友人にとっても良いこと」という感覚を設計しましょう。',words:[{term:'紹介プログラム（リファラルプログラム）',desc:'既存ユーザーが友人・知人を紹介することで双方に報酬が得られる仕組み。口コミでの顧客獲得を体系化した手法。'},{term:'両面報酬（Double-sided Incentive）',desc:'紹介した人と紹介された人の両方に報酬を与えるプログラム設計。一方だけに報酬を与えるより高い紹介率を生む。'}]},
  {type:'promotion',typeLabel:'📣 Promotion',scene:'美容院がInstagramで集客を強化したい。毎日投稿しているが効果が出ていない。',q:'Instagram集客の改善として最も効果的なのはどれか？',opts:['投稿頻度をさらに増やす','Reels（動画）でビフォーアフターを定期的に投稿し、地元ハッシュタグを活用する','フォロワーを購入する','毎日違うジャンルの投稿をして幅広く発信する'],correct:1,why:'Instagramのアルゴリズムは動画（Reels）を静止画より大幅に優先表示します。美容院でのビフォーアフターは「視覚的な変化が明確」でシェアされやすく、美容情報を探しているユーザーに刺さります。地元のハッシュタグ（#渋谷美容院 #渋谷カット等）を使うことで「今すぐ予約できる地元の美容院を探している人」に届きます。投稿頻度は質より重要ではなく、ジャンルを散らすとアカウントのテーマが薄れます。',tip:'SNSは「継続」より「刺さるコンテンツ」が重要。美容院の場合、ビフォーアフター・施術プロセス動画・スタイリストの人柄が見える投稿が最も集客に繋がります。',words:[{term:'Reels（リール）',desc:'Instagramの短尺動画機能。静止画投稿より拡散されやすく、アルゴリズムでも優遇されるため集客に効果的。'},{term:'ハッシュタグ',desc:'SNSで投稿をカテゴリ分けする「#」から始まるキーワード。地元名＋業種のハッシュタグは近くにいるターゲット顧客への露出に効果的。'}]},
  {type:'promotion',typeLabel:'📣 Promotion',scene:'クラウドファンディングでプロジェクトを立ち上げる予定。目標金額は200万円で30日間のキャンペーン。',q:'クラウドファンディング成功のPromotion戦略として最も重要なのはどれか？',opts:['公開初日は何も特別なことはせず様子を見る','公開初日から3日間で目標の30%以上を達成できるよう、事前に支援者を確保しておく','SNS広告を30日間均等に出稿する','目標金額を低く設定してすぐ達成できるようにする'],correct:1,why:'クラウドファンディングのアルゴリズムは「支援の勢い（モメンタム）」を重視します。公開直後の3日間で目標の30%以上を達成しているプロジェクトはプラットフォームで注目・推薦され、新しい支援者が流入する好循環が生まれます。このため、家族・友人・SNSフォロワーなど「確実に支援してくれる人」を事前にリストアップしておき、公開初日に動いてもらう「ローンチ作戦」が成功の最重要施策です。',tip:'クラウドファンディングは「集合知のための広告」ではなく「社会的証明を作るためのメディア」。最初の勢いを人工的に作ることが成功の鍵です。',words:[{term:'クラウドファンディング',desc:'インターネットを通じて不特定多数から資金を調達する仕組み。Makuake・CAMPFIREが国内代表例。'},{term:'モメンタム（勢い）',desc:'クラウドファンディングで重要な初速の勢い。序盤の達成率が高いほどプラットフォームで推薦されやすくなる。'},{term:'社会的証明',desc:'多くの人が選んでいる・支援しているという事実が「良いものだ」という判断を促す心理効果。'}]},

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function show(id) {
  ['homeScreen','genreScreen','gameScreen','resultScreen'].forEach(s => {
    document.getElementById(s).style.display = s === id ? 'block' : 'none';
  });
}

function goHome() {
  show('homeScreen');
}

  {type:'target',typeLabel:'🎯 ターゲット設定',scene:'リフォーム会社がホームページをリニューアルした。施工事例を大量に掲載したが、問い合わせが増えない。',q:'問い合わせが増えない原因として最も考えられるのは？',opts:['施工事例の写真がスマホで見づらく、ビフォーアフターの差が伝わっていない','施工事例のページ数が少なく、訪問者が参考にできる事例が見つからない','訪問者の具体的な悩みに語りかけるコピーがなく「自分向けのサービスか」が伝わらない','ページの読み込みに3秒以上かかっており、モバイルユーザーが離脱している'],correct:2,why:'事例を見た人が「これは自分のことだ」と感じなければ問い合わせには至りません。「築20年の水回りが気になり始めた方へ」など悩みに直接語りかけることが重要です。',tip:'施工事例は「Before/After＋お客様の悩み」をセットで掲載すると、同じ悩みを持つ訪問者に刺さります。'},
  {type:'target',typeLabel:'🎯 ターゲット設定',scene:'カフェのオーナーが「誰でも来られる店にしたい」という方針でサイトを作った。しかし他のカフェとの差別化ができていない。',q:'この状況の根本的な問題は？',opts:['メニューの種類が少ない','SNSの発信が足りない','アクセス情報の掲載が不十分','ターゲットを絞らないと強みが伝わらない'],correct:3,why:'「誰でも歓迎」は「誰にも刺さらない」と同義です。「在宅ワーカーが集中できる静かなカフェ」など特定の人に向けたメッセージが差別化と集客を生みます。',tip:'ターゲットを絞ると「他の人が来なくなる」と心配しがちですが、実際は絞ることで刺さる人が増え、口コミも広がりやすくなります。'},
  {type:'target',typeLabel:'🎯 ターゲット設定',scene:'英会話スクールが「初心者から上級者まで対応」というキャッチコピーでサイトを運営している。体験申込が少ない。',q:'キャッチコピーを改善するとしたら、どの方向性が最も効果的か？',opts:['「3ヶ月で日常会話ができるビジネスパーソンへ」など対象と結果を明示する','「英会話スクール」というキーワードを増やす','価格の安さを前面に出す','先生の資格・経歴をトップに掲載する'],correct:0,why:'「誰向けか」と「どうなれるか」が明確なキャッチコピーは、該当する人の行動を促します。対象と成果をセットで伝えるのが最も効果的です。',tip:'キャッチコピーのテンプレート：「〇〇な△△が、□□になれるスクール」。対象・課題・成果の3つを入れるだけで格段に刺さります。'},
  // 導線設計
  {type:'lead',typeLabel:'🗺️ 導線設計',scene:'ECサイトで商品を大量に掲載しているが、カートに入れてもらえない。訪問者はサイトを見た後すぐに離脱している。',q:'導線設計として最も改善すべきポイントは？',opts:['商品数をさらに増やす','「人気商品ランキング」→「商品詳細」→「カートに入れる」という迷わない流れを作る','トップページのデザインをリニューアルする','送料無料の条件を緩和する'],correct:1,why:'訪問者は迷うと離脱します。「何を選べばいいか→詳細を知りたい→買う」という自然な流れを作り、各ステップで次のアクションを明示することが重要です。',tip:'導線設計の原則：各ページで「次に何をしてほしいか」を1つだけ明確にする。選択肢が多いほど離脱率は上がります。'},
  {type:'lead',typeLabel:'🗺️ 導線設計',scene:'施工事例ページを充実させたリフォーム会社のサイト。事例を見た訪問者がそのままサイトを閉じてしまう。',q:'事例ページに追加すべき最も重要な要素は？',opts:['さらに多くの施工事例','社長のメッセージ','事例ページ末尾の「この事例が気になった方は→無料相談はこちら」というCTAボタン','施工スタッフの紹介'],correct:2,why:'良い事例を見て「いいな」と思った瞬間が最も行動に移りやすいタイミングです。その直後にCTAを置くことで「気になる→相談する」の流れが生まれます。',tip:'コンテンツの末尾には必ずCTAを置く習慣を。読んで満足して離脱、という機会損失を防ぐ最も簡単な改善です。'},
  {type:'lead',typeLabel:'🗺️ 導線設計',scene:'士業（税理士）事務所のサイト。サービス内容は充実しているが、問い合わせフォームへたどり着く前に離脱する訪問者が多い。',q:'最も効果的な改善策は？',opts:['サービスページの文章量を増やす','料金をすべて非公開にして問い合わせを促す','事務所の写真を増やす','ナビゲーションメニューに「まず相談する（無料）」ボタンを常時表示する'],correct:3,why:'訪問者はどのページを見ているときでも「相談したい」と思う瞬間があります。ヘッダーや固定ナビに問い合わせボタンを常時表示することで取りこぼしを防げます。',tip:'問い合わせボタンはどのページ・どのスクロール位置でも見えるように。「ファーストビューに1回だけ」は機会損失です。'},
  {type:'lead',typeLabel:'🗺️ 導線設計',scene:'美容院のサイト。Instagramから集客できているが、サイトに来た人が予約せずに離脱している。',q:'離脱を防ぐために最初に確認すべきことは？',opts:['Instagramからサイトに来た人がすぐ予約ボタンを見つけられるか確認する','Instagramの投稿頻度を上げる','メニューと料金ページを充実させる','スタイリストの紹介ページを追加する'],correct:0,why:'SNSから来た人は「興味がある状態」で来訪します。その熱量が冷める前に予約ボタンが見つかるかどうかが離脱率を左右します。導線の入口と出口を必ずセットで確認しましょう。',tip:'流入元（どこから来た人か）によって、サイトに来た時の熱量や求める情報が違います。SNS流入者向けには予約CTAを最速で見せる設計を。'},
  {type:'lead',typeLabel:'🗺️ 導線設計',scene:'スクール系のLP（ランディングページ）を作成した。訪問者数は多いが、無料体験の申込率が低い。',q:'LPの構成として見直すべき最重要ポイントは？',opts:['ページを長くして情報量を増やす','「共感→課題提示→解決策→証拠→CTA」の流れになっているか確認する','デザインをシンプルにする','運営会社情報を充実させる'],correct:1,why:'LPはストーリーの流れが重要です。まず訪問者の悩みに共感し、課題を明確にし、解決策を提示し、証拠（実績・口コミ）で信頼を得てから申込ボタンを置く流れが基本です。',tip:'LPで最初にCTAを置いても効果は薄い。「この人は自分の悩みを分かっている」と思わせてから行動を促すのが鉄則です。'},
  // CTA・CV設計
  {type:'cta',typeLabel:'📣 CTA・CV設計',scene:'問い合わせフォームのボタン文言が「送信」になっているサービスサイトがある。フォームへの到達率は高いが送信率が低い。',q:'ボタン文言を変えるとしたら、最も改善が期待できるのはどれか？',opts:['「クリック」','「入力完了」','「無料で相談してみる」','「次へ進む」'],correct:2,why:'「送信」は動作を表すだけで価値が伝わりません。「無料で相談してみる」のようにボタンを押した後の価値・メリットを伝える文言にすることでCVRが上がります。',tip:'CTAボタンの文言テンプレート：「（無料で）〇〇する」。ユーザーが得られることを動詞で表現するのが効果的です。'},
  {type:'cta',typeLabel:'📣 CTA・CV設計',scene:'あるサービスのトップページに「資料請求」「無料体験」「お問い合わせ」「会員登録」の4つのボタンが並んでいる。',q:'このCTA設計の問題点は何か？',opts:['ボタンの色が統一されていない','ボタンのサイズが小さい','ボタンの数が少ない','選択肢が多すぎて訪問者が迷い、どれも押されなくなる'],correct:3,why:'選択肢が増えると人は決断を先延ばしにします（決定回避の法則）。最も重要なCTAを1つ選び、他は補助的な位置に置くことでCV率が上がります。',tip:'1ページのメインCTAは1つに絞る。どうしても複数必要なら「メイン（目立つ色）」と「サブ（テキストリンク程度）」に明確に差をつけましょう。'},
  {type:'cta',typeLabel:'📣 CTA・CV設計',scene:'不動産仲介サイトの物件詳細ページ。物件情報は充実しているが、「内見予約」ボタンのクリック率が低い。',q:'CTAの改善として最も効果的なのはどれか？',opts:['「今すぐ内見を予約する（今月3組限定）」のように希少性・緊急性を加える','物件の写真を増やす','物件の説明文を詳しくする','周辺施設情報を充実させる'],correct:0,why:'情報を十分に得た後でも「後で予約しよう」と先延ばしにするのが人の習性です。「限定」「今月中」など希少性・緊急性を加えることで今すぐ行動を促せます。',tip:'希少性・緊急性は過度に使うと信頼を損ないます。実際の事実（残り枠数・キャンペーン期間）を元にした表現が最も効果的です。'},
  {type:'cta',typeLabel:'📣 CTA・CV設計',scene:'フィットネスジムのLPでCTAボタンの色を青から緑に変えたら申込数が増えた。責任者が「緑色が最強だ」と結論づけた。',q:'この結論の問題点は何か？',opts:['緑は離脱率を高める色だから','色の効果はサイトのデザイン・ターゲット・周囲の色などで変わるため一概に言えない','青色のボタンは絶対に使ってはいけないから','CTAの色は関係ないから'],correct:1,why:'「緑が良かった」のはそのサイトの文脈では正しいですが、他のサイトでは異なる結果になることが多いです。重要なのはA/Bテストで「自分のサイトで検証する」習慣です。',tip:'Webの改善に「これが正解」はありません。仮説を立てて検証し、自分のユーザーで確認することが唯一の正解への道です。'},
  {type:'cta',typeLabel:'📣 CTA・CV設計',scene:'オンライン英会話サービスのトップページ。「無料体験レッスン受講」ボタンがファーストビュー（スクロール不要な範囲）の外にある。',q:'この配置の問題点は何か？',opts:['ボタンが見つからないまま離脱する訪問者が多くなる','スクロールを促す演出がないと意味がない','ファーストビューは情報量を減らすべき','無料体験の告知はSNSでやるべき'],correct:2,why:'訪問者の多くはスクロールせずに離脱します。最も重要なCTAはファーストビュー内に配置することで、サイトの目的を瞬時に伝え行動を促せます。',tip:'ファーストビューには「誰向けか」「何が得られるか」「次の行動（CTA）」の3点を必ず含めましょう。'},
  // SEO・集客
  {type:'seo',typeLabel:'🔍 SEO・集客',scene:'渋谷にあるカフェのサイトを作ったが、検索からの集客がない。サイトには「当店のこだわり」「メニュー」「アクセス」が掲載されている。',q:'SEO的に最も重要な改善は何か？',opts:['ページデザインをリニューアルする','メニュー写真を高品質にする','SNSと連携する','「渋谷 カフェ ランチ」など顧客が実際に検索するキーワードをページ内に盛り込む'],correct:3,why:'検索エンジンは「ユーザーが検索したキーワードと一致するページ」を上位表示します。顧客視点でどんな言葉で検索するかを考え、そのキーワードを自然に含めることがSEOの基本です。',tip:'まず「お客様は何と検索してこのサービスにたどり着くか」を10個書き出してみましょう。その言葉がそのままSEOキーワードになります。'},
  {type:'seo',typeLabel:'🔍 SEO・集客',scene:'外壁塗装会社が「外壁塗装」というキーワードでSEO対策をしている。しかし検索順位が上がらない。',q:'この状況を打開する最も効果的な戦略は？',opts:['「外壁塗装 費用 相場 〇〇市」など地域・ニーズを絞り込んだロングテールキーワードを狙う','「外壁塗装」のキーワードを全ページに大量に入れる','被リンクを購入する','SNS広告に切り替える'],correct:0,why:'「外壁塗装」は競合が多く中小企業が勝つのは困難です。地域や悩みを絞り込んだキーワード（ロングテール）は検索数は少ないが競合が少なく、購買意欲の高いユーザーが検索します。',tip:'地名＋サービス名、または「費用」「比較」「口コミ」などニーズキーワードとの組み合わせから攻めるのがローカルビジネスのSEO戦略の基本です。'},
  {type:'seo',typeLabel:'🔍 SEO・集客',scene:'料理教室がブログを始めた。毎日「今日のレッスン日記」を更新しているが、検索からの流入が増えない。',q:'ブログで検索流入を増やすために最も重要なことは何か？',opts:['更新頻度をさらに上げる','「初心者 パスタ 作り方」など検索ニーズに答える記事を書く','記事の文字数を増やす','写真の枚数を増やす'],correct:1,why:'「日記」は書き手の発信であり、検索ニーズとは一致しません。SEOで流入を増やすには「ユーザーが何を知りたくて検索するか」を起点にした記事を書く必要があります。',tip:'ブログを書く前に「このキーワードで検索する人は何を知りたいのか」を1文で書いてみましょう。答えられる記事だけSEO効果があります。'},
  {type:'seo',typeLabel:'🔍 SEO・集客',scene:'整体院がGoogleマップに登録していない。SEO対策としてブログを頑張っているが、近隣からの集客が増えない。',q:'地域ビジネスとして最優先すべき集客施策は何か？',opts:['YouTubeチャンネルを開設する','全国向けにSEOを強化する','Googleビジネスプロフィールを登録・最適化する','有料広告を出稿する'],correct:2,why:'地域ビジネスにとってGoogleマップ（Googleビジネスプロフィール）への表示は最も費用対効果の高い集客手段です。「〇〇市 整体」で検索した人に地図上で表示されます。',tip:'Googleビジネスプロフィールは無料で登録でき、写真・口コミ・営業時間を充実させるほど表示順位が上がります。地域ビジネスで未登録なら今すぐ登録しましょう。'},
  {type:'seo',typeLabel:'🔍 SEO・集客',scene:'あるWebサイトがSNS広告でアクセス数を伸ばしているが、広告費がかかりすぎて利益が出ていない。',q:'長期的に健全な集客を実現するための戦略は？',opts:['広告費をさらに増やして規模を拡大する','SNS広告をやめてリスティング広告に切り替える','メルマガを始める','SEOやコンテンツマーケティングで広告に依存しない自然流入を育てる'],correct:3,why:'広告は即効性があるが費用が永続します。SEO・ブログ・SNS運用などのコンテンツ資産は時間はかかりますが、積み上がると広告費なしで集客できる「資産型集客」になります。',tip:'広告とSEOは役割が違います。「今すぐ集客→広告」「中長期の資産形成→SEO・コンテンツ」と使い分けることが理想的です。'},
  {type:'target',typeLabel:'🎯 ターゲット設定',scene:'フリーランスのWebデザイナーがポートフォリオサイトを作った。「デザインが得意です」とだけ書いてあり、仕事の依頼がこない。',q:'最も改善すべき点は何か？',opts:['「飲食店専門」「LP制作が得意」など専門性・対象を明確にする','実績件数を増やす','デザインをさらにおしゃれにする','SNSのフォロワーを増やす'],correct:0,why:'「デザインが得意」は全デザイナーが言える言葉です。「飲食店のオーナーのためのLP制作専門デザイナー」のように専門特化すると、その業種のオーナーが「自分向けだ」と判断して依頼しやすくなります。',tip:'フリーランスこそニッチに特化する戦略が有効。専門性を絞ると競合が減り、単価も上がりやすくなります。'},
  {type:'lead',typeLabel:'🗺️ 導線設計',scene:'採用サイトを作ったが、エントリー数が増えない。会社概要・事業内容・募集要項は充実している。',q:'採用サイトの導線として最も重要な改善は何か？',opts:['募集職種を増やす','求職者の悩み（「転職すべきか迷っている」）に答えるコンテンツを追加し、エントリーへ誘導する','採用担当者の写真を掲載する','給与情報をわかりやすくする'],correct:1,why:'求職者は「情報収集→比較検討→応募」という段階を踏みます。悩みに答えるコンテンツ（社員インタビュー・職場環境など）で信頼を獲得してからエントリーボタンへ誘導する流れを設計することが重要です。',tip:'採用サイトは「いきなり応募して」より「まず会社を好きになってもらう」コンテンツ設計が効果的です。'},
  {type:'cta',typeLabel:'📣 CTA・CV設計',scene:'あるサービスのランディングページで、申し込みフォームの入力項目が「氏名・住所・電話番号・メールアドレス・生年月日・職業・年収」の7項目ある。',q:'このフォームの問題点は何か？',opts:['フォームのデザインが古い','確認ページがない','入力項目が多すぎて離脱率が上がる','送信ボタンの色が目立たない'],correct:2,why:'フォームの入力項目が増えるほど離脱率は上がります。最初の接点では「氏名・メール・電話」の3項目程度に絞り、必要な追加情報は後から取得する設計が効果的です。',tip:'フォームは「これは本当に必要か？」と1項目ずつ問い直しましょう。削除できる項目を削除するだけでCV率が大幅に改善することがあります。'},
  {type:'seo',typeLabel:'🔍 SEO・集客',scene:'競合他社が多い業界でSEO対策をしている。「最高のサービス」「業界No.1」などのキャッチコピーは充実しているが、流入が少ない。',q:'SEO上の根本的な問題は何か？',opts:['「最高」「No.1」などの言葉はSEO効果がない','コンテンツの量が少ない','デザインが古い','ユーザーが実際に検索するキーワードではなく、自社がアピールしたい言葉でコンテンツを作っている'],correct:3,why:'SEOは「自社の言いたいこと」ではなく「ユーザーが検索する言葉」に合わせてコンテンツを作る必要があります。ユーザーは「最高のサービス」とは検索しません。',tip:'SEOは「お客様代理人」になって考える作業。「自社をどう見せたいか」ではなく「お客様は何を知りたくて検索するか」を出発点にしましょう。'},
  {type:'target',typeLabel:'🎯 ターゲット設定',scene:'結婚式の二次会幹事代行サービスを立ち上げた。「結婚式・パーティー・イベント全般に対応」と広くアピールしているが、問い合わせが少ない。',q:'集客を改善するためのターゲット設定として最適なのは？',opts:['「初めて幹事を任された・何をすればいいか不安な方向け」と課題を絞って訴求する','対応イベントの種類をさらに増やす','価格を業界最安値にする','有名人のSNSで紹介してもらう'],correct:0,why:'「二次会幹事代行」を調べる人の最大の悩みは「初めてで不安」です。その課題に直接響くメッセージを出すことで「自分のことだ」と感じた人が問い合わせます。',tip:'ターゲットの「最大の不安・悩み」を1つ特定し、それを解消できると伝えるのが最もシンプルで強力なメッセージです。'},
  {type:'lead',typeLabel:'🗺️ 導線設計',scene:'オンラインコースのサイト。詳細ページを見た人の多くが購入せずに離脱している。価格は1万円。',q:'購入率を上げるために追加すべき要素として最も効果的なのは？',opts:['コースの動画を長くする','受講者の声（テスtimonial）と購入後のリスク軽減（返金保証など）を追加する','価格を下げる','コース内容のページ数を増やす'],correct:1,why:'1万円の購入には「本当に効果があるか」「失敗したらどうなるか」という不安が伴います。実際の受講者の声と返金保証はその不安を取り除く最も効果的な要素です。',tip:'価格が上がるほど「証拠（実績・口コミ）」と「安心（保証・サポート）」が重要になります。この2つをページに加えるだけで離脱率が下がります。'},
  {type:'cta',typeLabel:'📣 CTA・CV設計',scene:'BtoB向けSaaSのサービスページ。問い合わせは来るが、「資料請求」ばかりで「デモ申込」が来ない。',q:'デモ申込数を増やすための改善として最も効果的なのは？',opts:['資料請求ボタンを削除する','デモの内容を詳しく説明したページを作る','「15分でわかる無料デモ」のように所要時間と具体的なメリットを明示する','デモ申込の入力フォームを簡略化する'],correct:2,why:'「デモ申込」はハードルが高く感じられます。「15分」という時間の明示と「何がわかるか」という価値を伝えることで、申し込みへの心理的ハードルが下がります。',tip:'CTAのハードルを下げる方法：所要時間の明示・「無料」の強調・「まず〜だけ」という小さな一歩の表現。大きなコミットを求める前に小さなYESを積み重ねましょう。'},
  {type:'seo',typeLabel:'🔍 SEO・集客',scene:'パーソナルトレーニングジムが「ダイエット」というキーワードで検索上位を目指している。しかし大手サイトに勝てない。',q:'中小規模のジムが取るべきSEO戦略として最も現実的なのは？',opts:['より多くのページを作って「ダイエット」で勝負する','SEOをあきらめてSNS広告だけにする','被リンクを大量に増やす','「〇〇区 パーソナルトレーニング 産後ダイエット」など地域×ニーズの特化キーワードで上位を狙う'],correct:3,why:'大手が強いビッグキーワードで中小が勝つのは非効率です。地域・年代・目的を絞り込んだロングテールキーワードは競合が少なく、そのキーワードで検索する人は購買意欲が高いため成約率も上がります。',tip:'地域ビジネスのSEOは「エリア名×サービス×ニーズ」の3軸で絞り込むと上位表示が現実的になります。'},
  {type:'lead',typeLabel:'🗺️ 導線設計',scene:'不動産投資セミナーの告知ページ。参加申込率が低い。ページには日時・場所・内容が書かれているだけ。',q:'申込率を上げるために最初に改善すべき点は？',opts:['「参加するとどうなれるか（得られる未来）」を冒頭に伝える','セミナーの開催回数を増やす','著名人をゲストに呼ぶ','参加費を無料にする'],correct:0,why:'人は「何を学ぶか（内容）」より「参加してどうなれるか（未来）」に動機づけられます。「このセミナーに参加すると〇〇できるようになります」という未来像を最初に伝えることが重要です。',tip:'イベント告知の構成：「得られる未来→なぜ今必要か→登壇者の信頼性→詳細（日時・場所）→申込CTA」の順番が効果的です。'},
  {type:'cta',typeLabel:'📣 CTA・CV設計',scene:'ECサイトで「カートに入れる」ボタンの上に「在庫残り3点」という表示を追加したところ、購入率が上がった。担当者が同じ表示を全商品に一律で付けることにした。',q:'この判断の問題点は何か？',opts:['在庫表示はSEOに悪影響がある','実際に在庫が豊富な商品に「残り3点」と表示するのは虚偽表示になりかねない','ボタンの文言を変えるべきだった','在庫表示は購入率に影響しない'],correct:1,why:'希少性・緊急性の演出は効果的ですが、事実と異なる表示は景品表示法違反になる可能性があり、発覚すると信頼を大きく損ないます。施策は必ず事実に基づいて実施しましょう。',tip:'Webマーケティングの施策は「効果があるか」と同時に「法令・倫理的に問題ないか」を常に確認する習慣が重要です。'},

  // ターゲット設定（追加分）
  {type:'target',typeLabel:'🎯 ターゲット設定',scene:'ペットサロンがホームページを作成した。「犬・猫・うさぎ・ハムスターなど全てのペットに対応」と記載しているが、新規顧客が増えない。',q:'集客改善のためにまず行うべきことは何か？',opts:['対応ペットの種類を増やす','価格を下げる','最も利益率が高く来店頻度の多いペット種に絞ってメッセージを集中させる','SNSに毎日投稿する'],correct:2,why:'「全て対応」は強みに見えて弱みです。最も得意な顧客層に絞ることで「ここが専門だ」という印象を与え、その層からの信頼・紹介が生まれます。',tip:'「何でもできる」は「何も特別でない」に聞こえます。一番得意なことを前面に出す勇気が集客力を高めます。'},
  {type:'target',typeLabel:'🎯 ターゲット設定',scene:'プログラミングスクールが「文系・理系問わず誰でも歓迎」とアピールしている。しかし体験申込が少ない。',q:'より効果的なターゲット設定はどれか？',opts:['ITエンジニア志望者全員を対象にする','子ども向けプログラミングにも対応する','料金を安くして幅広い層を取り込む','「文系出身・プログラミング未経験で転職を考えている30代」に絞ってメッセージを作る'],correct:3,why:'「誰でも歓迎」より「あなたのためのスクール」の方が申込につながります。「文系・未経験・30代の転職」という具体的な像を持つ人が「ここは自分向けだ」と感じます。',tip:'ペルソナ設定は「自分が対応できない人を排除する」ではなく「最もフィットする人に刺さるメッセージを作る」ためのツールです。'},
  {type:'target',typeLabel:'🎯 ターゲット設定',scene:'税理士が「法人・個人・相続・確定申告、何でも対応します」とサイトに書いている。問い合わせは来るが単価が低い。',q:'単価と質の両方を上げるために取るべき戦略は？',opts:['「スタートアップ・ベンチャー企業専門」など得意な顧客層に特化する','対応業務をさらに増やす','料金表を非公開にする','広告費を増やす'],correct:0,why:'専門特化した士業は「この人しかいない」というポジションを獲得でき、単価交渉力も上がります。何でも対応は競合との差別化ができず価格競争に陥りやすくなります。',tip:'「専門家に絞ると仕事が減る」という不安はあるものの、実際には専門性が高い方が単価・成約率ともに上がることが多いです。'},
  {type:'target',typeLabel:'🎯 ターゲット設定',scene:'オンラインヨガスクールが「初心者〜上級者まで全員OK」とアピールしている。競合が多く差別化できていない。',q:'差別化に最も効果的なアプローチは？',opts:['レッスン数を増やす','「産後ママ向け」「デスクワーカーの肩こり改善」など悩みで絞ったコースを作る','先生の資格を増やす','価格を最安値にする'],correct:1,why:'同じヨガでも「産後ママ」「肩こり改善」に特化すると、その悩みを持つ人が「私のためのサービスだ」と感じて選びます。悩みで絞ることが最もシンプルな差別化です。',tip:'ターゲットの「悩み」で絞ると、コピー・デザイン・コンテンツが一気に整合します。悩みドリブンでサービスを再定義してみましょう。'},
  {type:'target',typeLabel:'🎯 ターゲット設定',scene:'地域の工務店が「注文住宅・リフォーム・外構工事・解体まで何でも対応」とアピールしているが、問い合わせの質が低い。',q:'高単価な問い合わせを増やすために最初にすべきことは？',opts:['対応工事の種類をさらに拡大する','チラシのポスティングを増やす','高単価の注文住宅に特化したページを作り、ターゲットの悩みに直接訴求する','GoogleAdwordsを始める'],correct:2,why:'何でも対応のサービスは「どこに相談すればよいかわからない」人が来る傾向があります。高単価商品に特化したランディングページを用意することで、そのニーズを持つ人が直接来訪します。',tip:'Webページは「商品・サービスごとに専用ページを作る」のが基本。1ページ1メッセージで設計すると集客の精度が上がります。'},
  {type:'target',typeLabel:'🎯 ターゲット設定',scene:'子ども向け英会話教室が「小学生〜高校生まで対応」と案内している。体験申込が少ない。',q:'申込を増やすために最も効果的な訴求変更は？',opts:['対象年齢を大人にも広げる','月謝を下げる','教室の広さを伝える','「英語が苦手な小学生が楽しみながら話せるようになる教室」と悩みと結果を明示する'],correct:3,why:'「小学生〜高校生対応」では保護者が「うちの子向けかわからない」と感じます。「英語が苦手な小学生」と悩みを特定し「話せるようになる」と結果を示すことで行動を促せます。',tip:'教育系サービスは「誰が・どんな状態から・どうなれるか」の3点セットを伝えると申込率が上がります。'},
  {type:'target',typeLabel:'🎯 ターゲット設定',scene:'フリーランスWebデザイナーが実績ページに様々な業種の制作物を掲載している。問い合わせは来るが予算が低い案件が多い。',q:'高予算案件を引き寄せるための戦略として最も適切なのは？',opts:['医療・法律・飲食など特定業種に絞った実績を前面に出し専門家として訴求する','実績ページに掲載する案件数を増やす','料金表を非公開にする','SNSのフォロワーを増やす'],correct:0,why:'特定業種の専門デザイナーとして認知されると「業界理解がある」という付加価値が生まれ、予算を出せる企業から選ばれやすくなります。実績の見せ方を業種でグルーピングするだけでも変わります。',tip:'ポートフォリオは「何でもできる」より「この業種が得意」を強調する方が単価が上がります。'},
  {type:'target',typeLabel:'🎯 ターゲット設定',scene:'オンラインコンサルタントが「経営・マーケティング・人事・財務まで幅広くサポート」と掲げている。成約率が低い。',q:'成約率を高めるために最も効果的なポジショニングは？',opts:['さらに対応範囲を広げる','「創業3年以内のスタートアップのマーケティング専門」など対象と分野を絞る','価格を下げる','実績数を増やしてから訴求する'],correct:1,why:'コンサルは「何でも相談できる人」より「この課題ならこの人」というポジションの方が指名されやすいです。対象×課題を絞ることで「私のことだ」と感じたクライアントが動きます。',tip:'専門特化は「他の案件を断る」ことではなく「主要なメッセージを絞る」こと。実際の対応範囲は広くても、集客メッセージは1つに集中させましょう。'},
  {type:'target',typeLabel:'🎯 ターゲット設定',scene:'ダイエット食品のECサイトが「健康を気にする全ての人に」というキャッチコピーを使っている。広告費に対してROIが低い。',q:'広告効果を高めるために最も重要な改善は何か？',opts:['広告予算を増やす','広告媒体をテレビに変える','「出産後に体重が戻らない30代ママ向け」など具体的なペルソナに絞った広告クリエイティブを作る','商品ラインナップを増やす'],correct:2,why:'広告は「多くの人に届ける」より「刺さる人に届ける」方がROIが高くなります。ターゲットを具体化すると広告のクリック率・成約率が両方上がります。',tip:'広告費の無駄遣いの多くはターゲットの解像度不足が原因です。「誰に」を絞るほど費用対効果は上がります。'},

  // 導線設計（追加分）
  {type:'lead',typeLabel:'🗺️ 導線設計',scene:'保険代理店のサイト。保険の種類を詳しく説明しているが、「相談予約」への誘導が少ない。',q:'導線改善として最も効果的なのはどれか？',opts:['保険の種類の説明をさらに詳しくする','価格比較ページを充実させる','競合他社との比較表を掲載する','「あなたに合う保険を無料で診断する」というコンテンツを作り相談予約へつなげる'],correct:3,why:'難しい保険の説明を読んでも「自分にどれが合うかわからない」状態では次のアクションに移れません。「診断」コンテンツで個別の悩みに答えながら相談へ誘導する流れが効果的です。',tip:'「情報を届ける」より「判断を助ける」コンテンツの方が次のアクションにつながります。診断・チェックリスト・シミュレーターはその代表例です。'},
  {type:'lead',typeLabel:'🗺️ 導線設計',scene:'Webデザイン会社のサイト。制作実績ページへのアクセスは多いが、その後の問い合わせに繋がらない。',q:'実績ページの改善として最も効果的なのは？',opts:['各実績に「この事例と似た課題をお持ちの方はこちらへ」というCTAと問い合わせリンクを追加する','実績数をさらに増やす','実績ページのデザインを刷新する','クライアント名を大きく表示する'],correct:0,why:'実績を見て「うちにも頼めるかも」と思った瞬間がアクションの最高タイミングです。その感情が冷める前に問い合わせへの導線を置くことで成約率が上がります。',tip:'コンテンツページは「読み終わったら終わり」にしない。必ず次のアクションへの橋渡しを置きましょう。'},
  {type:'lead',typeLabel:'🗺️ 導線設計',scene:'フィットネスアプリのダウンロードページ。機能説明が豊富だが、ダウンロード率が低い。',q:'ダウンロード率を上げる改善として最も優先すべきことは？',opts:['機能説明をさらに詳しくする','ファーストビューに「アプリで何が変わるか（成果・ビフォーアフター）」を配置しCTAを目立たせる','機能のスクリーンショットを増やす','料金プランを詳しく説明する'],correct:1,why:'機能説明が多すぎると「読む気がなくなる」効果があります。訪問者はまず「このアプリで自分の生活がどう変わるか」を知りたい。成果を最初に見せてからダウンロードボタンへ誘導しましょう。',tip:'LPやアプリDLページのファーストビューの役割は「続きを読ませること」ではなく「ここで完結させること」。成果→CTA→詳細の順に設計しましょう。'},
  {type:'lead',typeLabel:'🗺️ 導線設計',scene:'弁護士事務所のサイト。法律の解説記事が充実していて検索流入は多い。しかし法律相談の申込が増えない。',q:'相談申込を増やすための改善は？',opts:['法律解説記事をさらに増やす','弁護士の経歴を詳しく掲載する','記事の末尾に「この問題で弁護士に相談したい方はこちら」とCTAを追加する','料金体系を明示する'],correct:2,why:'法律の解説記事を読む人は「自分の問題を解決したい」人です。問題を理解した直後が「相談しよう」という気持ちの高まるタイミング。記事末尾のCTAが最も自然な誘導です。',tip:'コンテンツSEOの目的は「読んで満足させる」ことではなく「読んで行動させる」こと。全記事の末尾に関連するCTAを配置しましょう。'},
  {type:'lead',typeLabel:'🗺️ 導線設計',scene:'結婚式場のサイト。式場の写真や料金は充実しているが、見学予約の申込が少ない。',q:'見学予約を増やすための最も効果的な改善は？',opts:['式場の写真をさらに増やす','アクセスページを充実させる','SNSと連携する','「先輩カップルの体験談」と「見学予約の特典（試食無料など）」をセットで訴求する'],correct:3,why:'式場選びは「失敗したくない」という不安が強い。先輩カップルの体験談で不安を払拭し、見学予約に特典を付けることで「とりあえず行ってみよう」という行動を引き出せます。',tip:'高単価・高関与商品は「見て終わり」にならないよう、見学・体験・相談など小さな一歩を踏み出しやすくする設計が重要です。'},
  {type:'lead',typeLabel:'🗺️ 導線設計',scene:'ITスクールの資料請求ページ。資料を請求した人の受講申込率が低い。',q:'受講申込率を上げるために最も効果的な施策は何か？',opts:['資料請求後に「無料相談セッション」への案内メールを自動送信する','資料のページ数を増やす','資料請求フォームを簡略化する','資料のデザインを改善する'],correct:0,why:'資料請求は「まだ迷っている」状態です。資料を読んだ後に個別の疑問や不安を解消できる無料相談の場を設けることで、「申し込む」という次のステップに移りやすくなります。',tip:'資料請求→受講の転換率が低い場合は「資料を読んだ後の次の一手」が設計されていないことが多いです。見込み客へのフォローアップを自動化しましょう。'},
  {type:'lead',typeLabel:'🗺️ 導線設計',scene:'Webコンサルタントが自社サービスの説明ページを作った。サービス内容は詳しく書いているが、お問い合わせがこない。',q:'導線上の問題として最も考えられるのは？',opts:['サービスの価格が高すぎる','読者が「次に何をすればいいか」わからない状態になっている','実績が足りない','競合が多い'],correct:1,why:'どんなに詳しいサービス説明でも「次のアクション」が不明確だと訪問者は迷って離脱します。「まずはここをクリック」「無料相談はこちら」という明確な次のステップを用意することが必要です。',tip:'ページを作ったらまず「このページを読み終えた人に次に何をしてほしいか？」を1つ決めて、それを明示しましょう。'},
  {type:'lead',typeLabel:'🗺️ 導線設計',scene:'食料品のサブスクリプションサービス。トップページへのアクセスは多いが、申込フローの途中で離脱する人が多い。',q:'途中離脱を減らすために最も優先すべき改善は？',opts:['申込フローのステップ数を増やして説明を充実させる','商品の説明ページを充実させる','申込ステップをできる限り減らし、各画面で「残り〇ステップ」と進捗を表示する','申込画面のデザインを変える'],correct:2,why:'申込フローの離脱は「めんどくさい」「あとどれくらいかかるか不安」が原因の多くを占めます。ステップ数の削減と進捗表示の2つが最も効果的な離脱防止策です。',tip:'申込フローは「1画面1質問」を原則に。全体のステップ数と現在地を常に見せることで完了率が上がります。'},
  {type:'lead',typeLabel:'🗺️ 導線設計',scene:'Eラーニングプラットフォームが新講座を追加した。告知メールを送ったが、受講申込率が低かった。',q:'メールからの申込率を上げるために最も効果的なのは？',opts:['メールの配信頻度を上げる','メールのデザインを改善する','件名にキャンペーン情報を入れる','メール内のCTAを「詳細を見る」から「今すぐ無料で1講座体験する」に変更する'],correct:3,why:'「詳細を見る」はサイトへ誘導するだけですが、「無料で体験する」は具体的な価値と行動を示します。CTAを価値提供に変えることでクリック後の離脱も減ります。',tip:'メールCTAの文言は「何をするか（動詞）」より「何が得られるか（価値）」で書くと反応率が上がります。'},

  // CTA・CV設計（追加分）
  {type:'cta',typeLabel:'📣 CTA・CV設計',scene:'SaaS企業が「14日間無料トライアル」を提供しているが、トライアル後の有料転換率が低い。',q:'有料転換率を高めるために最も重要な施策は何か？',opts:['トライアル中に活用ガイドメールを送り、価値を体験させてから期間終了前に有料プランを案内する','トライアル期間を30日に延ばす','機能をトライアル中から全て開放する','価格を下げる'],correct:0,why:'トライアルで転換しない最大の理由は「価値を実感できなかった」ことです。活用ガイドで価値体験を促し、転換タイミングに合わせて有料プランを提案するオンボーディング設計が重要です。',tip:'SaaSのトライアルはゴールを「期間終了まで使ってもらう」ではなく「最初の3日でAha Momentを体験させる」に設定しましょう。'},
  {type:'cta',typeLabel:'📣 CTA・CV設計',scene:'ランディングページの申込ボタンが白背景のグレーで小さく表示されている。CV率が低い。',q:'ボタンの改善として最も優先すべきことは何か？',opts:['ボタンを赤色にする','ページ背景と明確にコントラストがつく色にし、「今すぐ〇〇する」という動詞で文言を統一する','ボタンのサイズを極限まで大きくする','ボタンを複数箇所に増やす'],correct:1,why:'ボタンが目立たない・文言が曖昧だと訪問者が「何をすれば良いか」わかりません。背景とのコントラストと具体的な動詞が、ボタンを「押すべきもの」として認識させます。',tip:'ボタンの色は「サイトで最も目立つ色」にするのが原則。文言は「クリック・送信・確認」の代わりに「〇〇を始める・〇〇を試す・無料で相談する」など価値を示しましょう。'},
  {type:'cta',typeLabel:'📣 CTA・CV設計',scene:'会員制コミュニティの入会ページ。月額3,000円のプランしか案内していないが、入会率が低い。',q:'入会率を改善するための料金プラン設計として最も効果的なのは？',opts:['月額を下げる','年払いオプションを追加する','月額3,000円の隣に月額5,000円の上位プランを置き、3,000円を「お得に見せる」','入会条件を緩和する'],correct:2,why:'人は「比較できないもの」は判断が難しい。高い選択肢を隣に置くことで「3,000円がお得」という認知が生まれます（松竹梅効果・アンカリング）。これだけで中間価格帯の選択率が上がります。',tip:'料金プランは「最も売りたいプランを真ん中に置き、それより高い選択肢を作る」設計が定番。比較対象を提供することで意思決定が楽になります。'},
  {type:'cta',typeLabel:'📣 CTA・CV設計',scene:'占いサービスのLPで無料鑑定のオファーをしているが、申込フォームの到達率が低い。',q:'フォーム到達率を上げる改善として最も効果的なのは？',opts:['無料鑑定の内容をより詳しく説明する','鑑定の実績件数を増やす','著名人の口コミを掲載する','「名前・生年月日だけでOK・30秒で完了」のように入力の簡単さと所要時間を明示する'],correct:3,why:'フォームへの到達率が低いのは「入力が面倒そう」「時間がかかりそう」という心理的ハードルが原因のことが多いです。「何を入力すればよいか・どれくらいかかるか」を事前に示すことで不安が消えます。',tip:'フォームの直前に「入力項目は3つだけ・所要時間は1分」と書くだけでCV率が改善することがあります。'},
  {type:'cta',typeLabel:'📣 CTA・CV設計',scene:'オンライン習い事サービスが「今すぐ入会する」ボタンをトップページのファーストビューに配置した。入会率が低い。',q:'この設計の問題点として最も考えられるのは？',opts:['サービスの価値・信頼性を理解する前に行動を求めているため温度感が合っていない','ボタンの位置が悪い','ファーストビューにCTAを置くべきではない','ボタンのデザインが悪い'],correct:0,why:'初めて訪れたユーザーはまだサービスへの信頼や理解がありません。「今すぐ入会」は既にサービスを知っている人向けのCTAです。初見ユーザーには「まず体験する・詳細を知る」という小さな一歩を促しましょう。',tip:'CTAはユーザーの「温度感（認知度・信頼度）」に合わせて設計します。初見向け・比較検討中向け・入会意向あり向けで異なるCTAが必要です。'},
  {type:'cta',typeLabel:'📣 CTA・CV設計',scene:'人材紹介サービスのサイト。求職者向けのCTAが「登録する」だけで、入力フォームへのアクセスが少ない。',q:'フォームへのアクセスを増やすための改善として最も効果的なのは？',opts:['登録ボタンを大きくする','「あなたに合う求人を無料で紹介してもらう」のようにユーザーが得られる価値を明示する','登録フォームを短くする','求人情報の数を増やす'],correct:1,why:'「登録する」は行動そのものを示すだけです。「無料で求人を紹介してもらう」という言葉は登録後に何が得られるかを示し、行動する理由を与えます。',tip:'CTAボタンは「ユーザーが登録した後に得られること」を書く。「登録・申込・送信」など手段を示す言葉より「〇〇を手に入れる・〇〇してもらう」という受益の言葉が効果的です。'},
  {type:'cta',typeLabel:'📣 CTA・CV設計',scene:'月額1万円のオンラインサロンに入会してもらうためのLPを作成した。問題のない構成だが申込率が伸びない。',q:'申込率を上げるためにLPに追加すべき最も効果的な要素は何か？',opts:['サロンのコンテンツ数を増やす','価格を下げる','主宰者の実績・権威性と、退会者がほとんどいないという継続率（社会的証明）を追加する','よくある質問を充実させる'],correct:2,why:'月額1万円という金額を払い続けるには「入って損したくない」という不安の解消が必要です。主宰者の実績（権威性）と継続率（社会的証明）の2つが最も強い不安解消要素です。',tip:'高額・継続課金サービスのLPには「入る前の不安リスト」を作り、それを1つずつ解消するコンテンツを配置することが成約率改善の基本です。'},
  {type:'cta',typeLabel:'📣 CTA・CV設計',scene:'不動産会社が問い合わせページのフォームに「電話番号は必須」と設定している。フォームの送信完了率が低い。',q:'送信完了率を改善するために最も効果的なことは何か？',opts:['フォームのデザインを変える','フォームの説明文を充実させる','送信ボタンの色を変える','電話番号を任意項目にするか削除し、「電話連絡なし・メールのみで相談可能」と明示する'],correct:3,why:'電話が来ることへの不安（しつこい営業への恐れ）がフォーム送信を妨げています。電話番号を任意にし「電話しません」と明示するだけで送信率が大幅に改善するケースがあります。',tip:'フォームの送信率が低い場合は「何を入力させているか」より「入力後に何が起きるか（電話が来る？）」への不安が原因のことが多いです。'},

  // SEO・集客（追加分）
  {type:'seo',typeLabel:'🔍 SEO・集客',scene:'ブログ記事を書いているが、いつも検索順位が上がらない。記事は2,000文字程度で書いている。',q:'検索順位が上がらない最も可能性が高い原因は何か？',opts:['そのキーワードで検索するユーザーが本当に知りたいこと（検索意図）に答えられていない','文字数が少ない','画像が少ない','更新頻度が足りない'],correct:0,why:'Googleは「ユーザーの検索意図に最も答えるページ」を上位表示します。文字数より「このキーワードで検索した人は何を知りたいのか」を正確に把握し、それに答える内容を書くことが先決です。',tip:'記事を書く前に「このキーワードで検索している人は、今どんな状況で、何を解決したいのか」を1文で書いてみましょう。その答えが記事のゴールになります。'},
  {type:'seo',typeLabel:'🔍 SEO・集客',scene:'「東京 賃貸 ペット可」というキーワードで不動産サイトのSEO対策をしている。大手ポータルサイトに勝てない。',q:'大手と競合しない現実的な戦略は？',opts:['より多くのキーワードで大手と戦う','「世田谷区 賃貸 ペット可 2LDK 駅徒歩5分以内」のような超特化キーワードで上位を狙う','SEOを諦めてSNSに切り替える','有料広告だけで集客する'],correct:1,why:'大手ポータルが強い広域キーワードより、地域・間取り・条件を組み合わせた超ロングテールキーワードは競合が少なく、具体的な検索ニーズに一致するため成約率も高くなります。',tip:'SEO戦略は「どのキーワードで勝てるか」を先に分析することが重要。検索ボリュームより「競合の少ないキーワードで着実に上位を積み上げる」方が中小企業には現実的です。'},
  {type:'seo',typeLabel:'🔍 SEO・集客',scene:'コンテンツマーケティングに取り組んでいるが、記事を書いても書いても検索流入が増えない。半年間で50記事書いた。',q:'改善すべき可能性が最も高い問題は何か？',opts:['記事数が少ない','記事の文字数が少ない','キーワード選定をせず「書きたいことを書いている」可能性が高い','SNSでのシェアが足りない'],correct:2,why:'50記事書いても効果がない場合、「誰も検索していないキーワード」または「競合が強すぎるキーワード」で書いている可能性が高い。まずキーワード調査から見直す必要があります。',tip:'記事を書く前に「このキーワードの月間検索数は？競合サイトのドメイン強度は？」を確認しましょう。Googleキーワードプランナーやラッコキーワードが役立ちます。'},
  {type:'seo',typeLabel:'🔍 SEO・集客',scene:'クリニックのサイトが「〇〇市 皮膚科」というキーワードで3ページ目にある。上位表示させたい。',q:'最も優先すべきSEO施策はどれか？',opts:['サイトのデザインをリニューアルする','キーワードをページに大量に埋め込む','被リンクを購入する','Googleビジネスプロフィールを最適化し、院内写真・診療内容・口コミを充実させる'],correct:3,why:'地域名＋診療科の検索では、Googleマップ（ローカルパック）が最上位に表示されます。Googleビジネスプロフィールの最適化がマップ表示順位に直結するため、最優先施策です。',tip:'地域ビジネスはまずGoogleビジネスプロフィールの充実を。写真・診療内容・口コミ返信が揃うほど地図上の表示順位が上がります。'},
  {type:'seo',typeLabel:'🔍 SEO・集客',scene:'Webショップが商品ページを1,000ページ作成した。しかし各ページの説明文が「商品名・価格・サイズ」だけで内容が薄い。',q:'SEO上の問題点として最も重要なのは何か？',opts:['内容が薄いページは検索エンジンから「低品質」と判断され順位が上がらない','ページ数が多すぎる','商品説明は短い方がいい','価格情報のみで十分'],correct:0,why:'Googleは「ユーザーにとって価値があるページ」を評価します。商品名と価格だけのページは「他のサイトと全く同じ情報」であり差別化できません。使い方・特徴・選び方などを加えることで評価が上がります。',tip:'ECサイトのSEOは「商品説明ページでユーザーの疑問（この商品はどんな人に向いているか・他との違いは）を解消する」コンテンツを加えることが基本です。'},
  {type:'seo',typeLabel:'🔍 SEO・集客',scene:'企業サイトのページ表示速度が非常に遅い（読み込みに5秒以上かかる）。',q:'この状況がSEOに与える影響として正しいのは？',opts:['SEOには影響しない','ページ速度はGoogleの順位決定要因であり、遅いほど順位が下がる上に離脱率も上がる','デザインを変えれば解決する','画像を増やせば改善する'],correct:1,why:'Googleはページ速度をランキング要因として公式に認めています。また速いページは離脱率が低く、滞在時間が長くなるため間接的にもSEOに好影響です。画像圧縮・キャッシュ設定から着手しましょう。',tip:'PageSpeed Insights（無料）でサイトの速度スコアを確認できます。スコアが50以下なら速度改善が最優先のSEO施策です。'},
  {type:'seo',typeLabel:'🔍 SEO・集客',scene:'飲食店が食べログ・Googleマップ・自社サイトの3つを運営している。どこに一番力を入れるか迷っている。',q:'新規集客として最優先すべきはどれか？',opts:['自社サイトのSEO','食べログのプロフィール充実','Googleビジネスプロフィール（Googleマップ）の最適化','SNS広告'],correct:2,why:'「近くの〇〇（飲食店）を検索する」行動の多くはGoogleマップから始まります。Googleビジネスプロフィールは無料で設定でき、写真・口コミ・メニューを充実させるほど表示優先度が上がります。',tip:'飲食店のオンライン集客はGoogleマップ→SNS→自社サイトの優先順位が現実的です。Googleマップは無料で始められる最高ROIの集客手段です。'},
  {type:'seo',typeLabel:'🔍 SEO・集客',scene:'自社ブログの記事が検索上位にあるが、サイトへのアクセスがあっても問い合わせにつながらない。',q:'この状況の問題として最も考えられるのは何か？',opts:['記事の品質が低い','SNSに記事をシェアしていない','記事の更新を止めている','集客できているキーワードが購買意図のない情報収集キーワードである'],correct:3,why:'「〇〇とは」「〇〇の方法」系のキーワードは情報収集目的のユーザーが多く、直接の問い合わせには繋がりにくい。問い合わせに繋げるには「〇〇 依頼」「〇〇 費用 相場」など購買意図のあるキーワードも対策する必要があります。',tip:'SEOのキーワードは「情報収集系（what・how）」と「購買意図系（比較・料金・依頼）」に分類して、両方のコンテンツを用意することがビジネスにつながるSEOの基本です。'},
  {type:'seo',typeLabel:'🔍 SEO・集客',scene:'競合サイトが自分のサイトより常に検索順位が上位にある。競合サイトを分析したい。',q:'SEOで競合分析するときに最も確認すべきことは何か？',opts:['競合が上位表示されているキーワード・コンテンツの質・被リンク数','競合サイトのデザイン','競合の会社規模','競合の広告費'],correct:0,why:'SEOの競合分析は「なぜあのサイトが上位にいるのか」を理解することが目的。上位表示キーワード・コンテンツの深さ・被リンク数の3つを調べることで自分のサイトに何が足りないかがわかります。',tip:'Ubersuggest・Ahrefs（有料）・Google検索で競合のタイトルとコンテンツを確認するだけでも多くの示唆が得られます。競合を「敵」でなく「教材」として使いましょう。'},
  {type:'seo',typeLabel:'🔍 SEO・集客',scene:'Webサイトにアクセス解析ツール（Googleアナリティクス）を設置していない企業がいる。',q:'アクセス解析を設置しない場合のリスクとして最も重大なのは何か？',opts:['サイトが遅くなる','どのページが見られているか・どこから来ているかがわからず、改善の根拠がなくなる','SEOランキングが下がる','デザインが崩れる'],correct:1,why:'アクセス解析なしでは「施策が効いているのか」「どこで離脱しているのか」がわかりません。勘や経験だけでの改善はリソースの無駄遣いにつながります。すべての改善はデータに基づいて行うべきです。',tip:'Googleアナリティクス4（GA4）は無料で設置でき、流入元・ページ別滞在時間・離脱率などが確認できます。まだ未設置なら今すぐ設置しましょう。'},
  {type:'seo',typeLabel:'🔍 SEO・集客',scene:'SNSのフォロワーを増やすことに集中しているが、売上への貢献度が見えない。',q:'SNSマーケティングで最も重視すべき指標はどれか？',opts:['フォロワー数','いいね数','フォロワーがサイトに訪れて問い合わせ・購入に至る数（CV数）','投稿のリーチ数'],correct:2,why:'フォロワー数はバニティメトリクス（見栄え指標）です。1万フォロワーいても売上ゼロの場合もあります。SNSの本来の目的は「サイト訪問→購入・問い合わせ」につなげることで、そのCV数こそが最重要指標です。',tip:'SNSの各投稿にサイトへの導線（リンク・プロフィールURLへの誘導）を設計し、どの投稿がCV貢献しているかをアナリティクスで追いましょう。'},
  {type:'seo',typeLabel:'🔍 SEO・集客',scene:'地域の清掃会社がSEOで集客を試みているが、Webサイトのドメインが取得してから3ヶ月しか経っていない。なかなか順位が上がらない。',q:'この状況で最も現実的な短期集客施策はどれか？',opts:['さらにたくさんの記事を書く','ドメインを変える','SNSを始める','Googleビジネスプロフィール＋地域キーワードのSEOと並行して、Googleローカル広告で即時集客する'],correct:3,why:'新しいドメインはSEOで成果が出るまで6ヶ月〜1年かかることが多い（サンドボックス効果）。短期間で集客が必要な場合は広告で補いながら、中長期のSEOを並行して育てる戦略が現実的です。',tip:'SEOは「今すぐ集客」には不向きです。立ち上げ期は広告で売上を作りながら、SEOを中長期の資産として育てる二段階戦略を取りましょう。'},
  {type:'target',typeLabel:'🎯 ターゲット設定',scene:'写真撮影サービスが「プロフィール写真・家族写真・商品撮影・建築写真など幅広く対応」とアピールしている。予約が入りにくい。',q:'予約数を増やすために最も効果的な戦略は？',opts:['「就活・転職者のプロフィール写真専門スタジオ」など一つのシーンに特化して訴求する','対応メニューをさらに増やす','価格を業界最安値にする','SNSで毎日投稿する'],correct:0,why:'「何でもできるスタジオ」は「自分向けかどうか判断できない」状態を作ります。「就活写真」など特定シーンに特化すると、そのニーズがある人が「ここしかない」と感じて予約します。',tip:'サービスの専門化は「他の客が来なくなる」のではなく「迷いなく選ばれる」状態を作ることです。'},
  {type:'lead',typeLabel:'🗺️ 導線設計',scene:'マンション管理会社のサイト。管理組合向けの情報が充実しているが、新規管理委託の問い合わせが少ない。',q:'問い合わせを増やすための最優先施策は？',opts:['管理の実績棟数を増やす','「管理組合が抱えがちな5つの課題と解決策」というコンテンツを作り、問い合わせへ誘導する','会社概要ページを充実させる','管理スタッフ紹介ページを作る'],correct:1,why:'管理組合の担当者は「今困っていること」を解決したくてサイトを訪れます。課題解決コンテンツで「この会社は自分の悩みを理解している」と信頼を得てから問い合わせへつなぐ流れが効果的です。',tip:'BtoBサービスの導線設計は「課題に共感する→解決策を示す→実績で証明する→問い合わせへ」の順番が基本です。'},
  {type:'cta',typeLabel:'📣 CTA・CV設計',scene:'葬儀社のサイトで「事前相談はこちら」ボタンのクリック率が低い。',q:'クリック率を上げるためのCTA改善として最も効果的なのは？',opts:['ボタンを赤色にする','ボタンを複数箇所に置く','「生前に知っておきたい費用・流れの無料相談」のように何を相談できるかを明示する','問い合わせフォームを簡略化する'],correct:2,why:'「事前相談」はどんな相談ができるかが不明確です。「費用・流れ・手続き」など具体的に相談できる内容を示すことで「これなら相談できる」という安心感が生まれます。',tip:'「相談する・問い合わせる」という曖昧なCTAより「〇〇について無料で相談する」というように相談内容を具体化するとクリック率が上がります。'},
  {type:'seo',typeLabel:'🔍 SEO・集客',scene:'EC事業者が商品ページにお客様レビュー（口コミ）を掲載し始めた。',q:'口コミの掲載がSEOに与える効果として正しいのは？',opts:['SEOへの効果はない','口コミはSEOに悪影響を与える','口コミはSEOより広告効果の方が大きい','ユーザー生成コンテンツ（UGC）として評価され、ページの独自性が増しSEO評価が上がる可能性がある'],correct:3,why:'口コミはユーザーが生成する独自コンテンツです。定期的に新しい口コミが増えることでページが「更新されている」と評価され、検索エンジンからの評価向上にも寄与します。また購入率向上にも直結します。',tip:'口コミは「購入者にメールで依頼する」などプロアクティブに集める仕組みを作ることが大切。放っておいても集まりにくいです。'},
  {type:'target',typeLabel:'🎯 ターゲット設定',scene:'新設の訪問介護サービス会社が「要支援〜要介護5まで全ての方に対応します」とアピールしているが、問い合わせが来ない。',q:'問い合わせを増やすために最も効果的な訴求変更は？',opts:['「認知症の親御さんの在宅介護で疲弊しているご家族へ」のように具体的な悩みを持つ家族に語りかける','対応エリアを広げる','スタッフ数を増やしてから告知する','価格を下げる'],correct:0,why:'介護サービスを探しているのは本人よりその家族であることが多いです。「認知症の介護に疲れている家族」という具体的な悩みに語りかけることで「ここは私たちのことをわかっている」と感じてもらえます。',tip:'サービスを選ぶのが「当事者」か「代わりに選ぶ家族・担当者」かを考えてターゲットを設定しましょう。BtoCでも実質的な意思決定者が違うケースがよくあります。'},
  {type:'lead',typeLabel:'🗺️ 導線設計',scene:'Webマーケティング会社のブログ。読者がブログを読んだ後、サービスページを見ずに離脱している。',q:'ブログからサービスページへの誘導を改善するために最も効果的なのは？',opts:['ブログの記事数を増やす','ブログの内容に関連するサービスページへのバナー・CTAを記事内と末尾に設置する','ブログのデザインを変える','メルマガを始める'],correct:1,why:'ブログ読者はその記事のテーマに興味がある状態です。記事内容と関連したサービスへのリンクを置くことで「もっと詳しく知りたい・依頼したい」という気持ちをサービスページで受け取れます。',tip:'ブログとサービスページは「認知→興味→検討→接触」のファネルで繋がっています。各記事に関連するサービスへの内部リンクを必ず設置しましょう。'},
  {type:'cta',typeLabel:'📣 CTA・CV設計',scene:'保険見直しサービスのLPで「今すぐ相談する」CTAを設置しているが、クリック率が低い。',q:'クリック率向上のために最も改善すべき点はどれか？',opts:['CTAボタンを赤くする','CTAの文字を大きくする','「今は相談するほどではない」という心理的ハードルを下げるため「まず保険料の無料診断だけする」というマイルドなCTAに変更する','CTAをページ上部にのみ配置する'],correct:2,why:'「相談する」はコミットメントが高く感じられます。「診断だけ」という低コストな最初の一歩を提供することで心理的ハードルが下がり、接触機会が増えます。接触後に信頼が生まれれば相談へ移行します。',tip:'転換率を上げるには「一気にゴールを求めない」設計が重要。資料請求→相談→契約のように段階を踏む「マイクロコンバージョン」の設計がBtoCでも有効です。'},
  {type:'seo',typeLabel:'🔍 SEO・集客',scene:'採用サイトが求人情報を掲載しているが、求職者からの応募がこない。',q:'採用サイトのSEOで最も重要な改善は何か？',opts:['求人票の文字数を増やす','会社のビジョンを詳しく書く','代表挨拶を充実させる','「〇〇職 未経験 転職」など求職者が実際に検索する言葉でページタイトルとコンテンツを最適化する'],correct:3,why:'求職者は「仕事名・条件・状況」で検索します。「マーケター募集」ではなく「Webマーケター 未経験 転職 〇〇市」などの言葉で検索する人に向けてページを最適化することが重要です。',tip:'採用ページのSEOは「自社がアピールしたいこと」ではなく「求職者が検索する言葉」から始めましょう。求人サイトで似た求人を検索してみると候補キーワードが見つかります。'},
  {type:'target',typeLabel:'🎯 ターゲット設定',scene:'フリーランスのコーチングサービスが「人生・仕事・人間関係すべての悩みに対応」とアピールしている。問い合わせの質が低い。',q:'高品質な問い合わせを増やすために最も効果的な戦略は？',opts:['「管理職になったばかりのビジネスパーソン向け」など対象と悩みを明確に絞る','コーチングの料金を上げる','実績記事を増やす','SNSでの発信を増やす'],correct:0,why:'「何でも対応」は逆に「自分の悩みに特化してくれるのか？」という不安を生みます。特定の悩みに絞ることで「この人なら私の問題を理解してくれる」という信頼感が生まれ、質の高い問い合わせが増えます。',tip:'コーチング・コンサル・士業など人が商品のサービスは「専門分野の明確さ」が最大の差別化要素です。'},
  {type:'lead',typeLabel:'🗺️ 導線設計',scene:'メンタルクリニックのサイト。「うつ・不眠・不安障害など幅広く対応」と書いてあるが、初診予約が少ない。',q:'初診予約を増やすための改善として最も効果的なのは？',opts:['対応疾患の説明を詳しくする','初診の流れ（予約→診察→処方）をわかりやすく図解し、受診へのハードルを下げる','院長の経歴を詳しく掲載する','口コミを集める'],correct:1,why:'メンタルクリニックへの受診は「行くのが怖い・敷居が高い」という心理的ハードルがあります。初診の具体的な流れを見せることで「こんな感じなら行けそう」という安心感が生まれ予約につながります。',tip:'サービスへの心理的ハードルが高い業種（医療・法律・金融）ほど「初めての人向けに何が起きるかを見える化する」コンテンツが有効です。'},
  {type:'cta',typeLabel:'📣 CTA・CV設計',scene:'旅行代理店のサイトで特集ページを作ったが、そこから旅行パッケージの問い合わせにつながらない。',q:'問い合わせ率を上げる改善として最も効果的なのは？',opts:['特集ページの写真をさらに増やす','特集ページのデザインを変える','特集内の各パッケージに「このプランを詳しく見る」「このプランの空き状況を確認する」という個別CTAを設置する','旅行先の説明文を増やす'],correct:2,why:'特集ページ全体への「問い合わせ」ボタンより、興味を持った個別プランに直接紐づいたCTAの方が行動を起こしやすい。ユーザーの「このプランが気になった」瞬間を逃さない設計が重要です。',tip:'コンテンツとCTAは「関連性が高いほど」クリック率が上がります。汎用的な「お問い合わせ」より「このプランについて聞く」の方が反応率は高いです。'},
  {type:'seo',typeLabel:'🔍 SEO・集客',scene:'Webサイトのタイトルタグが全ページ「株式会社〇〇 公式サイト」になっている。',q:'このことがSEOに与える影響として最も正確なのは？',opts:['影響はない','タイトルは内部向けなのでSEOに関係ない','ページ数が多い場合のみ問題になる','各ページのターゲットキーワードがタイトルに含まれず、検索エンジンがページの内容を正確に判断できない'],correct:3,why:'タイトルタグはSEOの最重要要素の一つ。各ページの内容・ターゲットキーワードを含む固有のタイトルを設定することで、検索エンジンにページの主題を正確に伝えられます。',tip:'各ページのタイトルタグは「ターゲットキーワード + サービス名/地域名 + 会社名」の形式にしましょう。全ページ同じタイトルは検索エンジンにとって最悪の設計です。'},

  // 追加20問
  {type:'target',typeLabel:'🎯 ターゲット設定',scene:'ヨガ教室が「初心者からプロまで対応、朝・昼・夜のクラスあり」と全方位にアピールしている。体験入会が少ない。',q:'体験入会を増やすための最も効果的な改善は？',opts:['「平日朝に通いたい働く女性向け・初心者歓迎」のように通う人の属性と時間帯を絞って訴求する','クラス数をさらに増やす','ヨガの効果をより詳しく説明する','有名インストラクターを招く'],correct:0,why:'「誰でもいつでも」は通いたい人が「自分に合うクラスがあるかわからない」状態を作ります。通う人の属性・時間帯・目的を絞ることで「まさに自分のためだ」と感じる人が体験に来ます。',tip:'教室・スクール系は「誰がいつ・どんな目的で通うか」を1パターン絞り込み、そのターゲットの言葉でサイトを書き直すだけで体験申込が増えることがあります。'},

function selectGenre(key) {
  currentGenreKey = key;
  const g = GENRES[key];
  document.getElementById('genreHero').style.setProperty('--genre-color', g.color);
  document.getElementById('genreHeroIcon').textContent = g.icon;
  document.getElementById('genreHeroName').textContent = g.name;
  document.getElementById('genreHeroDesc').textContent = g.desc;
  document.getElementById('playBtn').style.background = `linear-gradient(135deg, ${g.color}, #e8c878)`;

  // 問題数オプション
  const sel = document.getElementById('countSelect');
  sel.innerHTML = '';
  const max = g.maxCount;
  [[10,'10問（約5分）'],[20,'20問（約10分）'],[30,'30問（約15分）'],[Math.min(50,max),`${Math.min(50,max)}問（約25分）`]].forEach(([v,t]) => {
    if (v <= max) {
      const o = document.createElement('option');
      o.value = v; o.textContent = t;
      sel.appendChild(o);
    }
  });

  show('genreScreen');
}

function startGame() {
  const g = GENRES[currentGenreKey];
  numQ = parseInt(document.getElementById('countSelect').value);

  const pool = currentGenreKey === 'mindreader' ? MINDREADER_Q : currentGenreKey === 'love' ? LOVE_Q : currentGenreKey === 'fourp' ? FOURP_Q : currentGenreKey === 'webdesign' ? WEBDESIGN_Q : BIZWORD_Q;
  gameQuestions = shuffle(pool).slice(0, numQ);

  currentQ = 0; score = 0; streak = 0; answered = false;
  typeScores = {};
  g.types.forEach(t => { typeScores[t.key] = {c:0, t:0}; });

  show('gameScreen');
  loadQ();
}

function loadQ() {
  answered = false;
  const q = gameQuestions[currentQ];
  const g = GENRES[currentGenreKey];

  document.getElementById('hudQ').textContent = `${currentQ+1}/${numQ}`;
  document.getElementById('hudScore').textContent = score;
  document.getElementById('hudStreak').textContent = streak > 0 ? `${streak}🔥` : '0';

  const badge = document.getElementById('typeBadge');
  badge.textContent = q.typeLabel;
  const typeInfo = g.types.find(t => t.key === q.type) || g.types[0];
  badge.style.background = typeInfo.color + '22';
  badge.style.color = typeInfo.color;
  badge.style.border = `1px solid ${typeInfo.color}55`;

  document.getElementById('sceneText').innerHTML = q.scene;
  document.getElementById('qText').textContent = q.q;

  const optEl = document.getElementById('options');
  optEl.innerHTML = '';
  ['A','B','C','D'].forEach((l, i) => {
    if (i >= q.opts.length) return;
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt-letter">${l}</span><span>${q.opts[i]}</span>`;
    btn.onclick = () => answer(i);
    optEl.appendChild(btn);
  });

  document.getElementById('explainBox').classList.remove('show');
  document.getElementById('nextBtn').classList.remove('show');
  document.getElementById('wordsBox').classList.remove('show');
  window.scrollTo({top:0, behavior:'smooth'});
}

function answer(idx) {
  if (answered) return;
  answered = true;
  const q = gameQuestions[currentQ];
  const btns = document.querySelectorAll('.opt');

  if (typeScores[q.type]) typeScores[q.type].t++;

  btns.forEach((b, i) => {
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  const isCorrect = idx === q.correct;
  if (isCorrect) {
    score++;
    streak++;
    if (typeScores[q.type]) typeScores[q.type].c++;
  } else {
    streak = 0;
  }

  document.getElementById('hudScore').textContent = score;
  document.getElementById('hudStreak').textContent = streak > 0 ? `${streak}🔥` : '0';
  document.getElementById('explainIcon').textContent = isCorrect ? '✅' : '💡';
  document.getElementById('explainTitle').textContent = isCorrect ? '正解！' : '惜しい！解説';
  document.getElementById('explainResult').textContent = isCorrect ? '＋1' : '';
  document.getElementById('explainResult').style.color = isCorrect ? 'var(--teal)' : 'var(--rose)';
  document.getElementById('explainWhy').textContent = q.why;
  document.getElementById('tipText').textContent = q.tip;
  document.getElementById('explainBox').classList.add('show');

  // 用語解説
  const wordsBox = document.getElementById('wordsBox');
  const wordsContent = document.getElementById('wordsContent');
  if (q.words && q.words.length > 0) {
    wordsContent.innerHTML = q.words.map(w =>
      `<div class="word-item"><div class="word-term">▷ ${w.term}</div><div class="word-desc">${w.desc}</div></div>`
    ).join('');
    wordsBox.classList.add('show');
  } else {
    wordsBox.classList.remove('show');
  }

  const nb = document.getElementById('nextBtn');
  nb.textContent = currentQ < numQ-1 ? `次へ (${currentQ+2}/${numQ}) →` : '結果を見る 🏆';
  nb.classList.add('show');
}

function nextQ() {
  currentQ++;
  if (currentQ >= numQ) { showResult(); return; }
  loadQ();
}

function showResult() {
  show('resultScreen');
  const g = GENRES[currentGenreKey];
  document.getElementById('resultNum').textContent = score;
  document.getElementById('resultDenom').textContent = `正解 / ${numQ}問`;

  const pct = score / numQ;
  let emoji, rank, sub;
  if (pct >= 0.9)      { emoji='🏆'; rank='マスター'; sub='完璧な理解力です！'; }
  else if (pct >= 0.7) { emoji='⭐'; rank='上級者'; sub='鋭い洞察力があります'; }
  else if (pct >= 0.5) { emoji='🌱'; rank='中級者'; sub='あと一歩で上級者！'; }
  else                 { emoji='📚'; rank='トレーニング中'; sub='解説を読んで復習しましょう'; }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultRank').textContent = rank;
  document.getElementById('resultSub').textContent = sub;

  // タイプ別breakdown
  let bHtml = '<div class="breakdown-title">タイプ別 正解率</div>';
  g.types.forEach(t => {
    const s = typeScores[t.key] || {c:0, t:0};
    const p = s.t > 0 ? Math.round((s.c/s.t)*100) : 0;
    bHtml += `<div class="breakdown-row">
      <span class="breakdown-type">${t.label}</span>
      <div class="breakdown-bar-wrap"><div class="breakdown-bar" style="width:0%;background:${t.color}" data-w="${p}"></div></div>
      <span class="breakdown-val">${s.c}/${s.t}</span>
    </div>`;
  });
  document.getElementById('typeBreakdown').innerHTML = bHtml;
  setTimeout(() => {
    document.querySelectorAll('.breakdown-bar').forEach(el => { el.style.width = el.dataset.w+'%'; });
  }, 100);

  // 弱点アドバイス
  const adviceMap = g.advice;
  const weakest = g.types.reduce((a, b) => {
    const as = typeScores[a.key] || {c:0,t:1};
    const bs = typeScores[b.key] || {c:0,t:1};
    return (as.c/as.t) < (bs.c/bs.t) ? a : b;
  });
  document.getElementById('adviceText').textContent = adviceMap[weakest.key] || '';

  window.scrollTo({top:0, behavior:'smooth'});
}

function retryGame() {
  startGame();
}

// 初期表示
show('homeScreen');
</script>
