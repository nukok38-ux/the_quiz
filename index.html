<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Quiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

  :root {
    --bg: #1c1917;
    --card: #28251f;
    --card2: #332f27;
    --warm: #f5f0e8;
    --gold: #d4a843;
    --gold2: #e8c878;
    --rose: #c8614a;
    --teal: #4ab8a8;
    --purple: #a06cd5;
    --muted: #8a8070;
    --border: #3d3830;
    --text: #f0ebe0;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Noto Sans JP',sans-serif; min-height:100vh; }

  .wrap { max-width:620px; margin:0 auto; padding:0 16px 80px; }

  /* ===== HOME ===== */
  #homeScreen { animation:fadeUp 0.4s ease; }

  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

  .home-header { padding:48px 0 32px; text-align:center; }
  .home-eyebrow { font-size:11px; letter-spacing:5px; color:var(--gold); text-transform:uppercase; margin-bottom:10px; }
  .home-title { font-family:'DM Serif Display',serif; font-size:clamp(44px,10vw,72px); color:var(--warm); line-height:1; margin-bottom:6px; }
  .home-sub { font-size:13px; color:var(--muted); letter-spacing:2px; }

  .section-label { font-size:10px; letter-spacing:4px; color:var(--muted); text-transform:uppercase; margin-bottom:14px; padding-left:2px; }

  .genre-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:32px; }

  .genre-card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px 18px;
    cursor:pointer;
    transition:all 0.2s;
    text-align:left;
    position:relative;
    overflow:hidden;
  }

  .genre-card::before {
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:2px;
    background:var(--genre-color, var(--gold));
    transform:scaleX(0);
    transition:transform 0.2s;
  }

  .genre-card:hover { border-color:var(--genre-color, var(--gold)); transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,0.3); }
  .genre-card:hover::before { transform:scaleX(1); }

  .genre-icon { font-size:28px; margin-bottom:10px; display:block; }
  .genre-name { font-size:15px; font-weight:700; color:var(--warm); margin-bottom:4px; }
  .genre-desc { font-size:11px; color:var(--muted); line-height:1.5; }
  .genre-count { position:absolute; top:14px; right:14px; font-size:10px; color:var(--muted); font-family:'DM Serif Display',serif; }

  .coming-soon { opacity:0.4; cursor:not-allowed; }
  .coming-soon:hover { transform:none; box-shadow:none; border-color:var(--border); }
  .coming-badge { position:absolute; bottom:12px; right:12px; background:var(--card2); border:1px solid var(--border); border-radius:4px; font-size:9px; color:var(--muted); padding:2px 6px; letter-spacing:1px; }

  /* ===== GENRE SELECT (問題数) ===== */
  #genreScreen { display:none; animation:fadeUp 0.3s ease; padding-top:96px; }

  .back-btn { background:transparent; border:none; color:var(--muted); font-family:'Noto Sans JP',sans-serif; font-size:13px; cursor:pointer; padding:0; margin-bottom:24px; display:flex; align-items:center; gap:6px; transition:color 0.2s; }
  .back-btn:hover { color:var(--warm); }

  .genre-hero { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:28px 24px; margin-bottom:20px; position:relative; overflow:hidden; }
  .genre-hero::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--genre-color, var(--gold)); }
  .genre-hero-icon { font-size:40px; margin-bottom:12px; display:block; }
  .genre-hero-name { font-family:'DM Serif Display',serif; font-size:28px; color:var(--warm); margin-bottom:8px; }
  .genre-hero-desc { font-size:13px; color:var(--muted); line-height:1.8; }

  .count-select { width:100%; background:var(--card2); border:1px solid var(--border); border-radius:12px; padding:14px 16px; color:var(--text); font-family:'Noto Sans JP',sans-serif; font-size:14px; margin-bottom:16px; appearance:none; cursor:pointer; }

  .play-btn { width:100%; border:none; border-radius:14px; padding:18px; font-family:'Noto Sans JP',sans-serif; font-size:16px; font-weight:700; cursor:pointer; transition:all 0.2s; letter-spacing:1px; background:linear-gradient(135deg, var(--genre-color, var(--gold)), var(--gold2)); color:#1c1917; }
  .play-btn:hover { opacity:0.9; transform:translateY(-2px); }

  /* ===== GAME ===== */
  #gameScreen { display:none; }

  .hud { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 20px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; }
  .hud-stat { text-align:center; }
  .hud-label { font-size:9px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:3px; }
  .hud-val { font-family:'DM Serif Display',serif; font-size:24px; color:var(--gold); }
  .hud-val.accent { color:var(--genre-accent, var(--gold)); }
  .hud-div { width:1px; height:30px; background:var(--border); }

  .type-badge { display:inline-flex; align-items:center; gap:8px; border-radius:8px; padding:7px 14px; font-size:12px; font-weight:500; letter-spacing:1px; margin-bottom:16px; }

  .q-card { background:var(--card); border:1px solid var(--border); border-radius:20px; overflow:hidden; margin-bottom:16px; animation:slideUp 0.35s ease; }
  @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

  .q-scene { background:var(--card2); border-bottom:1px solid var(--border); padding:22px 24px; }
  .q-scene-label { font-size:10px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; margin-bottom:12px; }
  .q-scene-text { font-size:15px; line-height:1.9; color:var(--warm); }
  .q-scene-text .hl { background:rgba(212,168,67,0.15); border-bottom:1px solid rgba(212,168,67,0.4); padding:0 2px; color:var(--gold2); }

  .q-body { padding:20px 24px; }
  .q-text { font-size:15px; font-weight:700; line-height:1.6; margin-bottom:20px; color:var(--warm); }

  .options { display:flex; flex-direction:column; gap:10px; }
  .opt { background:var(--card2); border:1px solid var(--border); border-radius:12px; padding:15px 18px; color:var(--text); font-family:'Noto Sans JP',sans-serif; font-size:14px; text-align:left; cursor:pointer; transition:all 0.18s; line-height:1.6; display:flex; align-items:flex-start; gap:12px; }
  .opt-letter { width:24px; height:24px; border-radius:6px; background:var(--border); color:var(--muted); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; transition:all 0.18s; }
  .opt:hover { border-color:var(--gold); background:rgba(212,168,67,0.06); }
  .opt:hover .opt-letter { background:var(--gold); color:#1c1917; }
  .opt.correct { border-color:var(--teal); background:rgba(74,184,168,0.1); }
  .opt.correct .opt-letter { background:var(--teal); color:#1c1917; }
  .opt.wrong { border-color:var(--rose); background:rgba(200,97,74,0.1); opacity:0.7; }
  .opt.wrong .opt-letter { background:var(--rose); color:white; }
  .opt.dim { opacity:0.4; cursor:default; pointer-events:none; }

  .explain-box { display:none; background:var(--card2); border-radius:14px; overflow:hidden; margin-bottom:16px; animation:slideUp 0.3s ease; }
  .explain-box.show { display:block; }
  .explain-header { padding:12px 18px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border); }
  .explain-icon { font-size:20px; }
  .explain-title { font-size:13px; font-weight:700; color:var(--gold2); }
  .explain-result { margin-left:auto; font-family:'DM Serif Display',serif; font-size:22px; }
  .explain-body { padding:18px; }
  .explain-why { font-size:13px; line-height:1.9; color:#b0a898; margin-bottom:14px; }
  .tip-box { background:rgba(212,168,67,0.08); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:12px 14px; }
  .tip-label { font-size:9px; letter-spacing:3px; color:var(--gold); text-transform:uppercase; margin-bottom:6px; }
  .tip-text { font-size:13px; line-height:1.8; color:var(--gold2); }

  .next-btn { display:none; width:100%; background:transparent; border:1px solid var(--gold); border-radius:12px; padding:15px; color:var(--gold); font-family:'Noto Sans JP',sans-serif; font-size:14px; font-weight:700; cursor:pointer; transition:all 0.2s; letter-spacing:1px; margin-bottom:12px; }
  .next-btn:hover { background:var(--gold); color:#1c1917; }
  .next-btn.show { display:block; }

  /* 用語解説ボックス */
  .words-box { display:none; background:rgba(160,108,213,0.08); border:1px solid rgba(160,108,213,0.25); border-radius:12px; padding:16px 18px; margin-bottom:16px; animation:slideUp 0.3s ease; }
  .words-box.show { display:block; }
  .words-box-label { font-size:9px; letter-spacing:3px; color:#a06cd5; text-transform:uppercase; margin-bottom:12px; font-weight:700; }
  .word-item { margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid rgba(160,108,213,0.15); }
  .word-item:last-child { margin-bottom:0; padding-bottom:0; border-bottom:none; }
  .word-term { font-size:13px; font-weight:700; color:#c49de8; margin-bottom:3px; }
  .word-desc { font-size:12px; color:#b0a898; line-height:1.7; }

  /* ===== RESULT ===== */
  #resultScreen { display:none; animation:fadeUp 0.5s ease; }
  .result-top { background:var(--card); border:1px solid var(--border); border-radius:20px; overflow:hidden; margin-bottom:16px; }
  .result-hero { background:linear-gradient(160deg,#2a2318,#1c1917); padding:40px 24px 32px; text-align:center; border-bottom:1px solid var(--border); }
  .result-big-emoji { font-size:64px; margin-bottom:12px; display:block; }
  .result-rank { font-family:'DM Serif Display',serif; font-size:28px; color:var(--gold); margin-bottom:6px; }
  .result-sub { font-size:13px; color:var(--muted); }
  .result-score-area { padding:28px 24px; text-align:center; }
  .result-score-num { font-family:'DM Serif Display',serif; font-size:68px; color:var(--gold2); line-height:1; margin-bottom:4px; }
  .result-score-denom { font-size:12px; color:var(--muted); letter-spacing:3px; margin-bottom:4px; }

  .type-breakdown { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:16px; }
  .breakdown-title { font-size:11px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; margin-bottom:16px; }
  .breakdown-row { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .breakdown-row:last-child { margin-bottom:0; }
  .breakdown-type { font-size:12px; color:var(--muted); width:80px; flex-shrink:0; }
  .breakdown-bar-wrap { flex:1; height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
  .breakdown-bar { height:100%; border-radius:3px; transition:width 1s ease 0.3s; }
  .breakdown-val { font-family:'DM Serif Display',serif; font-size:16px; color:var(--gold2); width:40px; text-align:right; flex-shrink:0; }

  .advice-box { background:var(--card); border:1px solid var(--border); border-left:3px solid var(--teal); border-radius:0 16px 16px 0; padding:18px 20px; margin-bottom:20px; font-size:13px; line-height:1.9; color:#b0a898; }
  .advice-label { font-size:10px; letter-spacing:3px; color:var(--teal); text-transform:uppercase; margin-bottom:8px; }

  .result-btns { display:flex; gap:10px; }
  .retry-btn { flex:1; background:linear-gradient(135deg,var(--gold),var(--gold2)); border:none; border-radius:14px; padding:16px; color:#1c1917; font-family:'Noto Sans JP',sans-serif; font-size:14px; font-weight:700; cursor:pointer; transition:all 0.2s; }
  .retry-btn:hover { opacity:0.9; transform:translateY(-2px); }
  .home-btn { flex:1; background:transparent; border:1px solid var(--border); border-radius:14px; padding:16px; color:var(--muted); font-family:'Noto Sans JP',sans-serif; font-size:14px; font-weight:700; cursor:pointer; transition:all 0.2s; }
  .home-btn:hover { border-color:var(--warm); color:var(--warm); }
</style>
</head>
<body>
<div class="wrap">

<!-- ===== HOME ===== -->
<div id="homeScreen">
  <div class="home-header">
    <div class="home-eyebrow">Knowledge Game</div>
    <div class="home-title">The Quiz</div>
    <div class="home-sub">ジャンルを選んでスタート</div>
  </div>

  <div class="section-label">ジャンルを選ぶ</div>
  <div class="genre-grid">

    <div class="genre-card" style="--genre-color:#4ab8a8" onclick="selectGenre('mindreader')">
      <span class="genre-count">100問</span>
      <span class="genre-icon">🔍</span>
      <div class="genre-name">心を読む</div>
      <div class="genre-desc">会話・表情・行動から相手の本音を読む</div>
    </div>

    <div class="genre-card" style="--genre-color:#e87080" onclick="selectGenre('love')">
      <span class="genre-count">100問</span>
      <span class="genre-icon">💘</span>
      <div class="genre-name">コミュ力</div>
      <div class="genre-desc">会話術・自己磨き・関係構築のコツ</div>
    </div>

    <div class="genre-card" style="--genre-color:#a06cd5" onclick="selectGenre('fourp')">
      <span class="genre-count">100問</span>
      <span class="genre-icon">📊</span>
      <div class="genre-name">マーケティング4P</div>
      <div class="genre-desc">CMOになって戦略を判断する実践クイズ</div>
    </div>

    <div class="genre-card" style="--genre-color:#5ba8f5" onclick="selectGenre('bizword')">
      <span class="genre-count">100問</span>
      <span class="genre-icon">💼</span>
      <div class="genre-name">ビジネス用語</div>
      <div class="genre-desc">Web・マーケ・経営の必須単語を学ぶ</div>
    </div>

    <div class="genre-card" style="--genre-color:#f5945b" onclick="selectGenre('webdesign')">
      <span class="genre-count">100問</span>
      <span class="genre-icon">🖥️</span>
      <div class="genre-name">Webサイト設計思考</div>
      <div class="genre-desc">目的・ターゲット・導線設計で売上につなげる</div>
    </div>

  </div>
</div>

<!-- ===== GENRE SCREEN ===== -->
<div id="genreScreen">
  <div class="genre-hero" id="genreHero">
    <span class="genre-hero-icon" id="genreHeroIcon">🔍</span>
    <div class="genre-hero-name" id="genreHeroName">心を読む</div>
    <div class="genre-hero-desc" id="genreHeroDesc"></div>
  </div>
  <select class="count-select" id="countSelect">
    <option value="10">10問モード（約5分）</option>
    <option value="20">20問モード（約10分）</option>
    <option value="30">30問モード（約15分）</option>
  </select>
  <button class="play-btn" id="playBtn" onclick="startGame()">スタート →</button>
  <button class="play-btn" style="margin-top:12px;background:linear-gradient(135deg,#4a4a4a,#2a2a2a);color:var(--warm);" onclick="goHome()">← ジャンル選択に戻る</button>
</div>

<!-- ===== GAME ===== -->
<div id="gameScreen">
  <button class="back-btn" onclick="goHome()" style="margin-bottom:12px">← ホームへ戻る</button>
  <div class="hud" id="hud">
    <div class="hud-stat"><div class="hud-label">問題</div><div class="hud-val" id="hudQ">1/10</div></div>
    <div class="hud-div"></div>
    <div class="hud-stat"><div class="hud-label">正解</div><div class="hud-val accent" id="hudScore">0</div></div>
    <div class="hud-div"></div>
    <div class="hud-stat"><div class="hud-label">連続正解</div><div class="hud-val" id="hudStreak">0🔥</div></div>
  </div>

  <div class="type-badge" id="typeBadge">💬 会話</div>
  <div class="q-card">
    <div class="q-scene">
      <div class="q-scene-label">場面</div>
      <div class="q-scene-text" id="sceneText"></div>
    </div>
    <div class="q-body">
      <div class="q-text" id="qText"></div>
      <div class="options" id="options"></div>
    </div>
  </div>

  <div class="explain-box" id="explainBox">
    <div class="explain-header">
      <span class="explain-icon" id="explainIcon">💡</span>
      <span class="explain-title" id="explainTitle">解説</span>
      <span class="explain-result" id="explainResult"></span>
    </div>
    <div class="explain-body">
      <div class="explain-why" id="explainWhy"></div>
      <div class="tip-box">
        <div class="tip-label">💡 実践のコツ</div>
        <div class="tip-text" id="tipText"></div>
      </div>
    </div>
  </div>

  <div class="words-box" id="wordsBox">
    <div class="words-box-label">📖 用語解説</div>
    <div id="wordsContent"></div>
  </div>

  <button class="next-btn" id="nextBtn" onclick="nextQ()">次へ →</button>
</div>

<!-- ===== RESULT ===== -->
<div id="resultScreen">
  <div class="result-top">
    <div class="result-hero">
      <span class="result-big-emoji" id="resultEmoji">🏆</span>
      <div class="result-rank" id="resultRank"></div>
      <div class="result-sub" id="resultSub"></div>
    </div>
    <div class="result-score-area">
      <div class="result-score-num" id="resultNum">0</div>
      <div class="result-score-denom" id="resultDenom">正解 / 10問</div>
    </div>
  </div>
  <div class="type-breakdown" id="typeBreakdown"></div>
  <div class="advice-box" id="adviceBox">
    <div class="advice-label">🌱 今後のヒント</div>
    <div id="adviceText"></div>
  </div>
  <div class="result-btns">
    <button class="retry-btn" onclick="retryGame()">もう一度</button>
    <button class="home-btn" onclick="goHome()">ホームへ</button>
  </div>
</div>

</div>

<script>
// ===================================================
// データ定義
// ===================================================

const GENRES = {
  mindreader: {
    name: '心を読む',
    icon: '🔍',
    color: '#4ab8a8',
    desc: '日常の会話・表情・行動・ビジネス場面から相手の本音を読み取るトレーニング。100問からランダム出題。',
    types: [
      {key:'conv', label:'💬 会話', color:'#4ab8a8'},
      {key:'body', label:'👁️ 表情', color:'#d4a843'},
      {key:'biz',  label:'💼 仕事', color:'#c8614a'},
    ],
    advice: {
      conv: '会話の裏読みは「言葉よりも間・タイミング・その後の行動」に注目する練習を。言葉はコントロールできますが、沈黙や間は本音が出やすいです。',
      body: '表情・行動の読解は「上半身（表情）と下半身（足・姿勢）のずれ」を意識するのがコツ。顔は嘘をつけますが体は正直です。',
      biz:  'ビジネス場面での読解力は「発言の後のアクション（次の約束・具体的な質問）があるか」を観察することで向上します。',
    },
    maxCount: 30,
  },
  love: {
    name: 'コミュ力',
    icon: '💘',
    color: '#e87080',
    desc: '会話術・自己磨き・デートの誘い方・関係構築のコツを学ぶクイズ。100問からランダム出題。',
    types: [
      {key:'talk',  label:'💬 会話術',   color:'#e87080'},
      {key:'mind',  label:'🧠 マインド', color:'#a06cd5'},
      {key:'date',  label:'📅 デート',   color:'#d4a843'},
    ],
    advice: {
      talk:  '会話は「I→You→We」の順で進めると距離が縮まります。まず相手の話を引き出し、共通の世界を作っていきましょう。',
      mind:  '自信は外見・知識・体を磨くことで自然と身につきます。モテの本質は「この人と一緒にいると楽しい」と思わせること。',
      date:  'デートは計画より「一緒に楽しむ姿勢」が大切。あなたが楽しめば相手も楽しくなります。',
    },
    maxCount: 100,
  },
  bizword: {
    name: 'ビジネス用語',
    icon: '💼',
    color: '#5ba8f5',
    desc: 'Webデザイン・マーケティング・経営の必須ビジネス用語を単語の意味を答える形式で学ぶ。100問からランダム出題。',
    types: [
      {key:'web',  label:'🖥️ Web・デザイン', color:'#5ba8f5'},
      {key:'mkt',  label:'📊 マーケティング', color:'#4ab8a8'},
      {key:'biz',  label:'💡 経営・ビジネス',  color:'#d4a843'},
    ],

  {type:'mind',typeLabel:'🧠 マインド',scene:'モテない男に共通する言葉の習慣について正しいのはどれ？',q:'普段から使わない方が良い「非モテワード」はどれ？',opts:['「ありがとう」「嬉しい」「好き」','「無理」「疲れた」「すみません」「面倒くさい」','「なるほど」「確かに」「それいいね」','「頑張ります」「やってみます」「考えます」'],correct:1,why:'「無理」「疲れた」「すみません」「面倒くさい」はネガティブな印象を与え、一緒にいて楽しくない雰囲気を作ります。ポジティブワードに置き換えるだけで印象が変わります。',tip:'「無理」→「難しいな」、「疲れた」→言わない、「すみません」→「ありがとう」に変換するクセをつけましょう。'},
  {type:'date',typeLabel:'📅 デート',scene:'女性に手間をかけさせることへの考え方として正しいのはどれ？',q:'女性に手間をかけてもらうことについて正しい認識は？',opts:['なるべく手間をかけさせないようにする','手間をかけてもらうことで愛着が生まれる','常に自分が全てやってあげるのが正解','手間をかけさせると嫌われる'],correct:1,why:'女性の「お世話したい欲求」を奪わないことが大切です。頼ることで相手は「この人に必要とされている」と感じ、関係が深まります。',tip:'「〇〇してもらえる？」と甘えることは関係を深めます。何でも自分でやってしまう男より、頼れる男の方が距離が縮まります。'},
  {type:'talk',typeLabel:'💬 会話術',scene:'会話が苦手な人が最初に身につけるべきスキルはどれ？',q:'会話を弾ませるために最初に鍛えるべきことは？',opts:['面白い話題を見つける力','リアクションと興味を示す能力','話し続ける体力','知識を増やして話のネタを作る'],correct:1,why:'会話が盛り上がるかどうかはリアクション次第。「すごい！」「それってどういうこと？」という反応があれば話題が何でも盛り上がります。話題より反応が先です。',tip:'話を聞いたときのリアクションを大きくするだけで相手は「この人と話すの楽しい」と感じます。オーバーリアクションくらいがちょうど良いです。'},
  {type:'mind',typeLabel:'🧠 マインド',scene:'モテの本質として最も正しい考え方はどれ？',q:'モテの根本にあるものは何か？',opts:['清潔感とファッション','トーク力とユーモア','自信と自分を磨き続けること','お金と地位'],correct:2,why:'自信は外見・知識・体・経済力を磨くことで自然と身につきます。強いオスに惹かれるのは本能的なもの。自信がある人が放つ雰囲気は言葉より強く伝わります。',tip:'モテを目的にするより「自分を高め続けること」を目的にする方が長期的に魅力的な人間になれます。男磨きの継続が全ての土台です。'},
  {type:'talk',typeLabel:'💬 会話術',scene:'女性に物でなく「褒め」をプレゼントする方法として正しいのはどれ？',q:'相手が最も喜ぶ褒め方はどれ？',opts:['外見（顔・スタイル）を具体的に褒める','センスや考え方など目に見えない内面を褒める','みんなに言えるような無難な言葉で褒める','比較で褒める（「他の子と違って」など）'],correct:1,why:'外見を褒めるのは誰でもできます。センス・気遣い・考え方など目に見えない「ノンバーバル」な部分を褒めることで「この人はちゃんと見てくれている」と感じさせられます。',tip:'「〇〇ちゃんって、話し方がすごく丁寧だよね」「気遣いが細かくて素敵だなと思って」など内面への気づきを伝えましょう。'},
  {type:'date',typeLabel:'📅 デート',scene:'初対面でやりがちな「一発アウト」な印象はどれ？',q:'初対面で特に避けるべき印象はどれ？',opts:['少し生意気な印象','チャラい印象','真面目で優しそうな印象','クールで無口な印象'],correct:2,why:'「真面目で優しそう」という印象は後から崩すのが難しく、距離が縮まりにくい。チャラい→真面目は好印象ですが、真面目→チャラいは悪印象です。最初から少し余裕のある雰囲気を出す方が有利です。',tip:'最初の印象は「真面目すぎず、でも礼儀はある」くらいのバランスが理想です。少し余裕のある笑顔が効果的です。'},
  {type:'talk',typeLabel:'💬 会話術',scene:'メッセージの語尾を疑問文で終わらせることについて正しいのはどれ？',q:'LINEやメッセージで最も効果的な文の終わらせ方は？',opts:['全て疑問文で終わらせて会話を続ける','断定口調でリードする','絵文字をつけて明るい雰囲気にする','長文で気持ちを丁寧に伝える'],correct:1,why:'「いつ空いてる？」「どこがいい？」などの疑問文だけでは相手に委ねすぎで弱い印象になります。「▲日の夜空けといて」という断定口調でリードする方が余裕と自信が伝わります。',tip:'デートの誘いは「〇日の夜どう？」より「〇日の夜空けといて」くらいの断定的な表現の方が相手は安心してついてきやすくなります。'},

  {type:'talk',typeLabel:'💬 会話術',scene:'女性と話すとき、最初の話題として最も自然に警戒心を解くのはどれ？',q:'初対面で最も使いやすい話しかけ方は？',opts:['「一目惚れしました」と正直に伝える','「連絡先交換しませんか？」と単刀直入に聞く','「このあたりでおすすめのカフェ知りませんか？」と用件で話しかける','「暇ですか？」と聞く'],correct:2,why:'「用事がある自然な理由」で話しかけると警戒心が下がります。目的を最初に見せないことで会話のきっかけを自然に作れます。',tip:'最初から目的を出すと身構えられます。「ちょっと聞いていいですか？」と始めて、自然に会話に移行しましょう。'},

  {type:'mind',typeLabel:'🧠 マインド',scene:'「いい人だけど…」と言われて振られた経験がある。この原因として最も正確なのは？',q:'「いい人なんだけど」と思われる男に足りないものは？',opts:['清潔感','お金','いざというとき守れる強さや余裕','会話力'],correct:2,why:'女性が「いい人なんだけど」と言うのは、安全すぎて刺激がない・いざというとき頼れない、という意味です。優しさは必要ですが、強さの中の優しさが求められます。',tip:'「優しい男」より「強くて時々優しい男」を目指しましょう。自分の意見を持ち、リードできる姿勢が重要です。'},
  {type:'talk',typeLabel:'💬 会話術',scene:'女性のネガティブな意見や愚痴を聞いているとき、最も効果的な返し方は？',q:'相手のネガティブな発言への最善の対応は？',opts:['「そんなことないよ！」と否定して元気づける','「それは辛いね、でもこうすれば…」と解決策を出す','「わかるわかる、それって〇〇な感じだよね」と肯定して代弁する','「気にしすぎだよ」と軽く流す'],correct:2,why:'ネガティブな意見を肯定して感情を代弁すると、相手は「わかってもらえた」と感じます。解決策は求められていないことが多く、まず共感が先です。',tip:'「それは確かに嫌だよね」「そう感じるの当然だと思う」と気持ちを受け止めてから、必要なら提案に移りましょう。'},
  {type:'date',typeLabel:'📅 デート',scene:'デート中に相手が楽しんでいるか不安になってきた。最も良い対応は？',q:'デート中に相手の楽しさを引き出す最善の方法は？',opts:['「楽しい？」と直接確認する','自分自身が全力で楽しんでいる姿を見せる','相手の好みに全て合わせる','話題を増やして間を埋める'],correct:1,why:'自分が楽しめば相手も楽しくなります。「楽しい？」と確認するのは逆効果。人は楽しそうな人と一緒にいたいので、まず自分が楽しむことが最善策です。',tip:'「楽しい？」より「これ面白くない？笑」と自分が楽しんでいる状態を示す方が、相手も自然と楽しくなります。'},
  {type:'talk',typeLabel:'💬 会話術',scene:'女性との会話でLINEが続かなくなってきた。最も効果的な対応は？',q:'LINEの返信が遅くなった・短くなったときの最善の対応は？',opts:['「返信遅いけど何かあった？」と聞く','毎日必ず連絡を送り続ける','少し間を空けて、面白い話題や「ちょっと聞いていい？」で再開する','長文で気持ちを伝える'],correct:2,why:'返信が減ったとき、追い続けると逆効果。少し間を空けてから新鮮な話題で再開する方が自然に関係をリセットできます。',tip:'「ちょっと聞いていい？」という一言は相手の気を引きやすい。「実は〇〇があって」と話題を作って送ると返信率が上がります。'},
  {type:'mind',typeLabel:'🧠 マインド',scene:'好きな女性の前で緊張してしまう。この問題への最善のアプローチは？',q:'好きな女性の前での緊張を和らげる最も根本的な解決策は？',opts:['緊張しないよう深呼吸する','「緊張してる」と正直に言う','場数を踏んで経験値を増やす','好きという気持ちを消す'],correct:2,why:'緊張は経験不足から来ます。好きな女性だけでなく、日常的にいろんな人と話す経験を積むことで、自然体で接せるようになります。',tip:'特定の一人に集中しすぎると緊張が増します。普段から色んな人に気軽に話しかける習慣が、好きな人への自然体を作ります。'},
  {type:'talk',typeLabel:'💬 会話術',scene:'女性と初めてLINEを交換した。最初のメッセージとして最も良いのは？',q:'LINE交換直後の最初のメッセージで最も効果的なのは？',opts:['「よろしくお願いします！」とだけ送る','交換した直後に「さっき会えてよかった」と一言送る','「今何してるの？」とすぐ聞く','スタンプだけ送る'],correct:1,why:'交換直後に「会えてよかった」という感想を送ると、余韻を大切にしている印象を与えます。最初の一言が関係の始まりの温度を決めます。',tip:'「さっき楽しかった」「また話したいな」など、今の気持ちを素直に一言送ると関係がスムーズに続きます。'},
  {type:'date',typeLabel:'📅 デート',scene:'デートで食事の場所を決めるとき、最もスマートな決め方は？',q:'デートの場所・お店を決めるときの最善の方法は？',opts:['「どこでもいいよ」と相手に全て任せる','「何が食べたい？」と聞いてから決める','「〇〇か〇〇どっちが好き？」と二択で聞いてから自分で予約する','事前に調べて「ここ行こう」と自分で決める'],correct:3,why:'デートのリードは男がすることで安心感が生まれます。「どこでもいい」は決断を押し付けているのと同じ。事前に調べて提案する姿勢が最も頼もしく映ります。',tip:'「〇〇ってお店調べておいたけど行ってみない？」という一言で「この人はちゃんと準備してくれた」という好印象になります。'},
  {type:'mind',typeLabel:'🧠 マインド',scene:'女性から「友達として好き」と言われた。この状況の正しい解釈は？',q:'「友達として好き」という言葉の本当の意味として最も近いのは？',opts:['関係を大切にしたいから友人でいたい','異性として魅力を感じていない','まだ距離が縮まっていないだけ','脈ありのサイン'],correct:1,why:'「友達として好き」は基本的に異性としての関心がないことを丁寧に伝えた言葉です。この段階からの逆転は難しく、執着より新しい出会いに力を注ぐ方が賢明です。',tip:'「友達として好き」と言われたら引きずらず、「そっか、ありがとう」とさらっと受け取れる男の方が最終的にかっこよく見えます。'},
  {type:'talk',typeLabel:'💬 会話術',scene:'女性が自分の趣味や好きなことを話しているとき、最も良いリアクションは？',q:'相手が好きなことを話しているときの最善の反応は？',opts:['「へー、そうなんだ」とシンプルに返す','「すごい！それってどういうこと？もっと教えて」と興味を示す','自分も同じ趣味があると話す','「それって楽しいの？」と確認する'],correct:1,why:'好きなことを話しているときに「もっと教えて」と言われると、相手は「この人は自分のことを知りたがっている」と感じ、一気に距離が縮まります。',tip:'相手の趣味に関する質問を深堀りしましょう。「それいつから好きなの？」「きっかけは？」と聞くと会話が自然に広がります。'},
  {type:'date',typeLabel:'📅 デート',scene:'初デートで最も避けるべきことはどれ？',q:'初デートで絶対にやってはいけないことは？',opts:['奢ること','元カノや過去の話をすること','自分の話をすること','お酒を飲むこと'],correct:1,why:'初デートで元カノや過去の話は絶対NG。相手は「この人はまだ過去を引きずっているのか」「私と比べているのか」と感じます。過去より今・未来の話をしましょう。',tip:'過去の話は「昔は〇〇だったけど今は全然違う」くらいでとどめましょう。大切なのは「今のあなた」を見せることです。'},
  {type:'mind',typeLabel:'🧠 マインド',scene:'筋トレを始めようと思っているがモテとの関係が気になる。',q:'筋トレがモテに与える効果として最も正確なのは？',opts:['筋肉があれば無条件にモテる','体を鍛えることで自己肯定感と自信が上がり結果的にモテる','外見より内面が大事なので効果は少ない','モテには関係ない'],correct:1,why:'筋トレの最大の効果は「体の変化」より「自信と自己肯定感の向上」です。自信がある人から出るオーラが最もモテに直結します。',tip:'筋トレは「モテるため」より「自分が変わるため」という動機の方が続きます。継続した先に自信がつき、それがモテに繋がります。'},
  {type:'talk',typeLabel:'💬 会話術',scene:'女性から「〇〇くんって彼女いるの？」と聞かれた。最もモテる返し方は？',q:'「彼女いるの？」と聞かれたときの最善の返し方は？',opts:['「いないよ、なんで？」と正直に答える','「どうだろうね〜」とはぐらかす','「なんで気になるの？笑」と逆に聞き返す','「いたらダメなの？」とちょっと意地悪に返す'],correct:2,why:'「なんで気になるの？」と逆に聞き返すと、相手が自分への関心を自覚するきっかけになります。素直に答えるより会話が面白くなります。',tip:'この質問は相手があなたに興味を持っているサイン。焦って答えず「なんで気になるの？笑」と返すと距離が縮まります。'},
  {type:'date',typeLabel:'📅 デート',scene:'デートの終わりに次のデートに繋げるための最善の方法は？',q:'デートの最後に次を約束するための最も効果的な方法は？',opts:['「また会いたい」とLINEで送る','帰り際に「次さ、〇〇行こうよ」と具体的に提案する','「楽しかったよ、ありがとう」と伝えるだけ','後日タイミングを見て誘う'],correct:1,why:'「また会いたい」より「次は〇〇行こう」と具体的に言う方がはるかに実現しやすい。余韻がある帰り際が最もOKをもらいやすいタイミングです。',tip:'「今日楽しかった、次は〇〇行きたいな」と帰り道に言えると、次のデートがほぼ確定します。LINEより対面で言う方が効果的です。'},
  {type:'talk',typeLabel:'💬 会話術',scene:'女性と話すとき「相手に共感させる」ために最も大切なことは？',q:'女性に「わかるー！」と言わせるために最も有効な方法は？',opts:['面白い話をたくさんする','「〇〇って感じじゃない？」と相手が感じていることを先に言語化する','共通の趣味について話す','有名人の話題を出す'],correct:1,why:'相手が感じていることを先に言語化すると「そうそう！まさにそれ！」と共感が生まれます。相手が共感するのではなく、相手に共感させることが会話の主導権を握るコツです。',tip:'「〇〇って時ってなんか〇〇な感じしない？」と先に感情を言葉にするクセをつけましょう。相手が「わかる！」と言いやすくなります。'},
  {type:'mind',typeLabel:'🧠 マインド',scene:'告白して断られた後の最もスマートな対応は？',q:'告白して断られたときに最もかっこいい対応は？',opts:['「友達に戻れる？」とお願いする','「そっか、正直に言ってくれてありがとう」とさらっと受け入れる','「なんで？」と理由を聞く','しばらく距離を置いて関係を断つ'],correct:1,why:'「ありがとう」とさらっと受け入れられる男は、断った後も「やっぱりいい人だな」と印象が上がることがあります。執着・追及は最も逆効果です。',tip:'断られた後こそ本当のかっこよさが出ます。「そっか、教えてくれてありがとう」の一言で終われる男が最終的にモテます。'},

  {type:'date',typeLabel:'📅 デート',scene:'デート中に相手が「お腹すいた」「疲れた」と言ってきた。最善の対応は？',q:'デート中に相手の体調や要望への最善の対応は？',opts:['「もう少し我慢して」と続けることを促す','「じゃあどうしたい？」と聞いて相手に決めさせる','「じゃあここ入ろう」とすぐ行動して連れて行く','「ごめんね」と謝る'],correct:2,why:'女性の「疲れた」「お腹すいた」にはすぐ行動して解決してあげることが大切。「どうしたい？」と聞くのは決断を押し付けています。瞬時に動ける男が頼もしく見えます。',tip:'「お腹すいた」と言われたら迷わず「じゃあここ入ろう」とリードしましょう。相手に考えさせない、即決できる男が好まれます。'},

  {type:'date',typeLabel:'📅 デート',scene:'初デートの場所として最も適しているのはどれ？',q:'初デートの場所として最も成功しやすいのは？',opts:['映画館','家でNetflix','昼間のカフェ＋夜のバー（2軒設定）','テーマパーク'],correct:2,why:'昼間のカフェで会話を楽しみ、夜は少し特別な場所に移動する「2軒設定」が最も距離が縮まりやすいです。映画は会話できず、テーマパークは疲れます。',tip:'「まずお茶して、その後気が向いたら夜ご飯も」という緩い設定が断られにくく、実際には夜まで続きやすいです。'},

  {type:'date',typeLabel:'📅 デート',scene:'女性が「どこでもいい」と言ってきた。最善の対応は？',q:'「どこでもいい」と言われたときの最もスマートな対応は？',opts:['「じゃあどこがいい？」とさらに聞く','「だよな〜」と流す','「じゃあここにしよう」と自分で決める','「何でもいいってことはないでしょ笑」とつっこむ'],correct:2,why:'「どこでもいい」は「決めてほしい」というサインです。ここで自分で決められる男がリードできる男。迷わず提案できる決断力が魅力になります。',tip:'「どこでもいい」と言われたら「じゃあここ行こう」と即決しましょう。決断力と余裕が一瞬で伝わります。'},
  {type:'mind',typeLabel:'🧠 マインド',scene:'モテる男の「塩対応」について正しく理解しているのはどれ？',q:'「塩対応がモテる」の正しい意味は？',opts:['冷たく無視することでモテる','ときに断ったり自分の意見を持つことで価値が上がる','常にクールな態度をとることでミステリアスに見える','媚びないために優しくしない'],correct:1,why:'塩対応とは「冷たくする」ことではなく「全てに従わない・自分の軸を持つ」ことです。全て従う男より、たまに断れる男の方が「この人を繋ぎ止めたい」と思わせられます。',tip:'「たまに断れる」「自分の意見を持てる」ことが塩対応の本質です。冷たくするのではなく、自分を持つことが大切です。'},
  {type:'talk',typeLabel:'💬 会話術',scene:'女性が「最近仕事がつらい」と打ち明けてきた。',q:'この状況での最善の返し方は？',opts:['「転職したら？」とアドバイスする','「わかる、俺も最近しんどくて」と自分の話にする','「それは辛いね、何があったの？」と続きを聞く','「大丈夫だよ！」と励ます'],correct:2,why:'打ち明けてきたということは「聞いてほしい」サインです。アドバイスや励ましより「続きを聞く」姿勢が最も求められています。',tip:'「何があったの？」と続きを促すことが最も大切。解決策は求められてから。まず全部吐き出させてあげましょう。'},
  {type:'date',typeLabel:'📅 デート',scene:'デートの帰り際に「また会いたい」とLINEで送った。既読がついたが返信がない。',q:'この状況での最善の対応は？',opts:['「返信ください」と催促する','追いLINEを送る','数日待ってから別の話題で連絡する','もう諦める'],correct:2,why:'既読無視に焦って追いLINEをすると「重い」と思われます。数日空けて全く関係ない話題で連絡すると自然にリセットできます。',tip:'「返信ないな…」と焦るほど追いかけたくなりますが、それが最も逆効果。「余裕のある男」を演出するために待てることが大事です。'},

  {type:'mind',typeLabel:'🧠 マインド',scene:'合コンや初対面の場で最初に好印象を作る方法として正しいのはどれ？',q:'初対面の場での最初の印象作りで最も大切なことは？',opts:['面白い話を準備していく','高いブランド品を身につける','笑顔・声の大きさ・姿勢の3つを整える','相手の話を全て覚える'],correct:2,why:'最初の印象は「中身より見た目と雰囲気」で決まります。笑顔・ハキハキした声・背筋が伸びた姿勢の3つで「自信がある人」という印象になります。',tip:'合コン前は背筋チェック・笑顔練習・声のトーン確認の3つだけで十分。中身より第一印象の雰囲気が最初の数分を決めます。'},

  {type:'talk',typeLabel:'💬 会話術',scene:'「また連絡するね」と言ったのに連絡していない。どう対応する？',q:'「また連絡するね」と言って間が空いてしまったとき、最善の再連絡の仕方は？',opts:['「連絡遅くてごめん」と謝罪から始める','謝罪なしに「そういえば〇〇なんだけど」と自然に話しかける','「覚えてる？」と聞いてから始める','もう連絡しない'],correct:1,why:'謝罪から入ると「間が空いたこと」を強調してしまいます。謝罪なしに自然な話題で連絡することで、間が空いたことを気にしていない余裕を演出できます。',tip:'「そういえば〇〇ってこの前言ってたけど、どうなった？」と相手の話を覚えていた形で連絡すると自然に再開できます。'},

  {type:'date',typeLabel:'📅 デート',scene:'デートで話が盛り上がりすぎて終電を逃した。最善の対応は？',q:'デート中に予想外に長く一緒にいることになったときの最善の対応は？',opts:['「やばい終電！」と焦る','「ごめん、気をつけなくて」と謝る','「なんか名残惜しいね、もう少し話そう」と自然に延長する','タクシーを黙って呼ぶ'],correct:2,why:'終電を逃しても焦らず「名残惜しいね」と言えると、むしろ「それだけ楽しかった」という演出になります。ピンチをチャンスに変える余裕が魅力的です。',tip:'「時間経つの早いね」「まだ話したかったな」という言葉は相手も同じ気持ちになりやすい言葉です。'},

  {type:'talk',typeLabel:'💬 会話術',scene:'女性に「今度ご飯行こう」と言われたが、その後具体的な話が進まない。',q:'「今度ご飯行こう」と言われた後の最善の行動は？',opts:['相手から誘ってくるのを待つ','「いつにする？」とすぐ自分から動く','「本当に行く気ある？笑」と確認する','「楽しみにしてる」とだけ返す'],correct:1,why:'「今度行こう」は相手が誘っているサイン。ここで受け身になると「社交辞令だったのかな」と流れてしまいます。「いつにする？」とすぐ具体化する男がリードできる男です。',tip:'「いつにする？来週か再来週ならどっちが空いてる？」と二択で聞くと話がすぐ前に進みます。機会を逃さないことが大切です。'},

  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「ホワイトスペース」',q:'ホワイトスペース（余白）の正しい意味はどれ？',opts:['背景を白くすること','要素と要素の間の空きスペース・余白','未使用のディスク容量','白いバナー広告'],correct:1,why:'ホワイトスペースはデザインの「間」。適切な余白は読みやすさを上げ、高品質な印象を与えます。',tip:'余白は「無駄なスペース」ではなく「読みやすさと品質を作るデザイン要素」です。詰め込みすぎはNG。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「モックアップ」',q:'モックアップの正しい意味はどれ？',opts:['完成前のサンプルや試作品・見本','プログラムのバグの種類','ユーザーのフィードバック','サイトの運用マニュアル'],correct:0,why:'モックアップは実際の完成品に近い形で作られたサンプル。デザインの確認・プレゼンに使います。',tip:'ワイヤーフレーム（骨格）→モックアップ（見た目）→プロトタイプ（動く試作）の順で精度が上がります。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「プロトタイプ」',q:'プロトタイプの正しい意味はどれ？',opts:['実際に動作する試作品・デモ版','完成したデザインデータ','サイトのバックアップ','ユーザーテストの結果'],correct:0,why:'プロトタイプは実際にクリックや操作ができる試作品。FigmaなどでもプロトタイプモードでUIの動きを確認できます。',tip:'プロトタイプでユーザーテストを行い、問題を早期発見することで開発コストを削減できます。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「ブレイクポイント」',q:'ブレイクポイントの正しい意味はどれ？',opts:['サイトがクラッシュする原因','レスポンシブデザインでレイアウトが切り替わる画面幅の基準値','デザインの修正が必要な箇所','コンテンツの分岐点'],correct:1,why:'ブレイクポイントはスマホ・タブレット・PCなどで表示が切り替わる画面幅の数値（例：768px、1024pxなど）です。',tip:'一般的なブレイクポイントはSP：〜767px、タブレット：768〜1023px、PC：1024px〜が目安です。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「スラッグ」',q:'URLのスラッグの正しい意味はどれ？',opts:['URLの末尾にある、ページを識別する文字列','サイトのタイトル','ページの読み込み速度','画像のファイル名'],correct:0,why:'スラッグはURLの「/about」「/blog/post-1」の部分。SEOにも影響するため、わかりやすい英単語を使うのが基本です。',tip:'スラッグは日本語より英語が推奨。「/サービス」より「/service」の方がSEO・シェア・管理の面で有利です。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「ペルソナ」',q:'Webデザインにおけるペルソナの正しい意味はどれ？',opts:['デザイナーの役割','サービスの理想的なターゲットユーザーを具体的に設定した架空の人物像','ウェブサイトのキャラクター','競合分析の手法'],correct:1,why:'ペルソナはターゲットユーザーを「27歳・女性・東京在住・OL」のように具体化した架空の人物。デザイン・コンテンツの方向性を統一するために使います。',tip:'ペルソナが明確だと「この人が見たらどう感じるか？」という視点でデザインを判断できます。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「カラーパレット」',q:'カラーパレットの正しい意味はどれ？',opts:['写真の編集ツール','デザインで使用する色の組み合わせセット','ページの背景色','フォントの色一覧'],correct:1,why:'カラーパレットはプロジェクトで使う色を事前に決めたセット。メインカラー・サブカラー・アクセントカラーで構成されることが多い。',tip:'統一されたカラーパレットを使うと、ブランドの一貫性が生まれ、プロっぽいデザインになります。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「インフォグラフィック」',q:'インフォグラフィックの正しい意味はどれ？',opts:['サイトのアクセス解析レポート','情報やデータを視覚的にわかりやすく表現した図・グラフィック','動画コンテンツ','写真と文章を組み合わせたコンテンツ'],correct:1,why:'インフォグラフィックは複雑な情報やデータをグラフ・イラスト・アイコンで視覚化したもの。SNSでの拡散力が高いです。',tip:'インフォグラフィックはSEO効果も高く、他サイトからの被リンク（バックリンク）を獲得しやすいコンテンツ形式です。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「ナビゲーション」',q:'Webサイトのナビゲーションの正しい意味はどれ？',opts:['サイトのアクセス解析','ユーザーがサイト内を移動するためのメニュー・リンク構造','サイトの更新履歴','ページの読み込み速度'],correct:1,why:'ナビゲーションはユーザーがサイト内を迷わず移動できるためのメニュー。グローバルナビ・サイドナビ・フッターナビなどがあります。',tip:'ナビゲーションはUXの核心。3クリック以内に必要な情報にたどり着けることが理想的とされています。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「パンくずリスト」',q:'パンくずリストの正しい意味はどれ？',opts:['エラーログの一覧','現在のページの階層構造を示すナビゲーション（ホーム＞カテゴリ＞記事）','サイトマップのこと','フッターのリンク一覧'],correct:1,why:'パンくずリストは「ホーム > ブログ > 記事タイトル」のように現在地を示すナビゲーション。SEOにも効果があります。',tip:'パンくずリストはユーザーの迷子防止とGoogleのクローリング効率化の両方に役立ちます。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「タイポグラフィ」',q:'タイポグラフィの正しい意味はどれ？',opts:['サイトの文字数','文字の配置・書体・サイズ・行間などを用いたデザイン技術','フォントのダウンロード','テキストのSEO最適化'],correct:1,why:'タイポグラフィは文字を使ったデザインの技術全般。読みやすさ・美しさ・ブランド感は全てタイポグラフィで決まります。',tip:'行間（line-height）は本文で1.6〜1.8が読みやすい目安。文字サイズは最低16pxが推奨されています。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「アンカーリンク」',q:'アンカーリンクの正しい意味はどれ？',opts:['外部サイトへのリンク','同一ページ内の特定の位置に移動するリンク','画像に貼られたリンク','新しいタブで開くリンク'],correct:1,why:'アンカーリンクはページ内の「#見出し」などに飛ぶリンク。LPの目次や「このページのトップへ戻る」ボタンに使われます。',tip:'長いLPや記事には目次アンカーリンクを設置すると離脱率が下がります。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「スティッキーヘッダー」',q:'スティッキーヘッダーの正しい意味はどれ？',opts:['重いヘッダー画像','スクロールしても画面上部に固定され続けるヘッダー','ヘッダーのアニメーション','スマホ用のハンバーガーメニュー'],correct:1,why:'スティッキー（sticky）は「くっついた」という意味。スクロールしてもヘッダーが追従して表示され続ける実装です。',tip:'スティッキーヘッダーはナビゲーションへのアクセス性を高めますが、画面を狭くするデメリットもあります。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「ハンバーガーメニュー」',q:'ハンバーガーメニューの正しい意味はどれ？',opts:['飲食店のWebサイト専用メニュー','三本線のアイコンをクリックするとナビゲーションが展開されるUI','フッターのメニュー一覧','縦に並んだサイドメニュー'],correct:1,why:'三本線（≡）がハンバーガーに見えることからこの名前。スマホサイトでよく使われるナビゲーションパターンです。',tip:'ハンバーガーメニューはスペース節約になりますが、メニューの存在に気づかれにくいデメリットもあります。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「ベクター画像」',q:'ベクター画像の正しい意味はどれ？',opts:['写真などのピクセルで構成された画像','数式・座標で描かれた拡大しても劣化しない画像（SVGなど）','アニメーション画像','背景が透明な画像'],correct:1,why:'ベクターは数学的な式で描かれるため、どんなサイズに拡大しても劣化しません。ロゴ・アイコンなどに最適です。',tip:'ロゴはSVG（ベクター）で用意しましょう。PNGと違い、Retinaディスプレイでも鮮明に表示されます。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「ラスター画像」',q:'ラスター画像（ビットマップ画像）の正しい意味はどれ？',opts:['数式で描かれた拡大しても劣化しない画像','ピクセルの集合で構成された画像（JPG・PNGなど）','動画ファイルの一種','アイコン専用の画像形式'],correct:1,why:'JPG・PNG・GIFなどがラスター画像。ピクセルで構成されるため、拡大すると劣化（ぼやける）します。',tip:'写真はラスター（JPG・WebP）、ロゴ・アイコンはベクター（SVG）が使い分けの基本です。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「WebP」',q:'WebPの正しい意味はどれ？',opts:['Webページの設計手法','Googleが開発した高圧縮・高品質な次世代画像フォーマット','Webサイトのプログラミング言語','Web会議ツールの一種'],correct:1,why:'WebPはJPGより約30%ファイルサイズが小さく、同等の画質を保てます。ページ速度改善に効果的な画像フォーマットです。',tip:'Core Web VitalsのLCP改善にはWebPへの変換が効果的。ほぼ全ての主要ブラウザで対応済みです。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「コンポーネント」',q:'Webデザインにおけるコンポーネントの正しい意味はどれ？',opts:['パソコンのハードウェア部品','再利用可能なUIの部品（ボタン・カード・ナビなど）','ページのコード全体','プラグインのこと'],correct:1,why:'コンポーネントはボタン・カード・フォームなどの再利用可能なUI部品。一度作れば複数箇所で使い回せます。',tip:'Figmaのコンポーネント機能を使うと、デザイン変更が全箇所に一括反映されて効率的です。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「フォントウェイト」',q:'フォントウェイトの正しい意味はどれ？',opts:['フォントの大きさ','フォントの太さ（細い〜太い）','フォントの種類','フォントの色'],correct:1,why:'フォントウェイトは文字の太さのこと。100〜900の数値やthin・regular・boldなどで指定します。',tip:'見出しはbold（700）、本文はregular（400）が基本。太さでメリハリをつけると読みやすいデザインになります。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「スケルトンスクリーン」',q:'スケルトンスクリーンの正しい意味はどれ？',opts:['透明なデザインスタイル','コンテンツ読み込み中に表示されるグレーの枠（仮のプレースホルダー）','骨格を見せるワイヤーフレーム','ダーク系のデザインテーマ'],correct:1,why:'スケルトンスクリーンはコンテンツが読み込まれる前にグレーの枠を表示する手法。ただのロード画面より体感速度が速く感じられます。',tip:'YouTubeやTwitterのロード時に表示されるグレーの枠がスケルトンスクリーンです。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「Core Web Vitals」',q:'Core Web Vitalsの正しい意味はどれ？',opts:['Googleが提供するWebデザインテンプレート','Googleが定めたWebページの品質（速度・安定性・操作性）を測る指標群','サイトのセキュリティ評価基準','ウェブサイトのアクセス解析ツール'],correct:1,why:'Core Web VitalsはLCP（読み込み速度）・FID（操作応答性）・CLS（レイアウトの安定性）の3指標でSEOにも影響します。',tip:'PageSpeed Insightsで自分のサイトのCore Web Vitalsを確認できます。特にLCPは2.5秒以下が目標です。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「ランディングページ（LP）」',q:'ランディングページ（LP）の正しい意味はどれ？',opts:['サイトの全ページの総称','広告などから来たユーザーを特定の行動（申込・購入）に誘導するための1枚ページ','エラーページのこと','サイトのホームページ'],correct:1,why:'LPは1ページで完結し、ナビゲーションを省いて1つの行動（CVR）に集中させるページです。広告との組み合わせで使います。',tip:'LPの離脱率を下げるにはファーストビューの改善が最重要。キャッチコピー・ベネフィット・CTAの3点セットを最上部に配置しましょう。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「ダークモード対応」',q:'Webサイトのダークモード対応の正しい意味はどれ？',opts:['夜間にのみ表示されるデザイン','OSの設定に応じて自動で背景が暗い配色に切り替わるデザイン対応','黒い背景のデザインテーマ','エラー時に表示される暗い画面'],correct:1,why:'ダークモード対応はCSSのprefers-color-schemeメディアクエリを使って実装。ユーザーのOS設定に合わせて自動切替します。',tip:'ダークモードでは色のコントラスト比の再確認が必要です。ライトモードで問題ない色でもダークで見えにくくなることがあります。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「マイクロコピー」',q:'マイクロコピーの正しい意味はどれ？',opts:['小さいフォントのコピーライト表記','ボタン・エラーメッセージ・プレースホルダーなどUIの中の短い文言','モバイル専用のキャッチコピー','画像のaltテキスト'],correct:1,why:'マイクロコピーはUIの中の小さな文言。「送信する」vs「今すぐ無料で始める」のように、たった数文字でCVRが大きく変わります。',tip:'フォームの「送信する」を「〇〇を受け取る」に変えるだけでCVRが上がることがあります。マイクロコピーは軽視禁物です。'},
  {type:'web',typeLabel:'🖥️ Web・デザイン',scene:'Webデザインの基本用語「フォールドライン」',q:'フォールドライン（Above the fold）の正しい意味はどれ？',opts:['ページの折り返し地点・スクロールしないと見えない境界線','フォントの基準線','レイアウトの中心線','コードの区切り'],correct:0,why:'フォールドライン（折り目線）はスクロールせずに見える範囲の境界。重要な情報はこのライン上に配置するのが基本です。',tip:'「Above the fold」が最重要エリア。CTAや主要メッセージはここに配置しましょう。'},
  {type:'mkt',typeLabel:'📊 マーケティング',scene:'マーケティング用語「ROI」',q:'ROI（Return On Investment）の正しい意味はどれ？',opts:['月間の売上合計','投資に対してどれだけのリターンが得られたかを示す指標','広告のクリック数','従業員の満足度'],correct:1,why:'ROI＝（利益 ÷ 投資額）× 100。ROIが高いほど少ない投資で多くのリターンを得ています。',tip:'マーケ施策の効果測定に必須の指標。「この施策のROIは？」と常に考える習慣が重要です。'},
  {type:'mkt',typeLabel:'📊 マーケティング',scene:'マーケティング用語「CVR」',q:'CVR（Conversion Rate）の正しい意味はどれ？',opts:['サイトの訪問者数','訪問者のうち目標行動（購入・申込など）を達成した割合','広告のクリック率','コンテンツの閲覧数'],correct:1,why:'CVR＝コンバージョン数 ÷ セッション数 × 100。ECサイトなら購入率、LPなら申込率がCVRです。',tip:'CVRを1%改善するだけで売上が大きく変わります。LPのデザイン・コピー・CTAを改善しましょう。'},
  {type:'mkt',typeLabel:'📊 マーケティング',scene:'マーケティング用語「KPI」',q:'KPI（Key Performance Indicator）の正しい意味はどれ？',opts:['会社の最終目標','目標達成度を測るための重要な中間指標','競合他社の分析結果','予算計画書'],correct:1,why:'KPIは目標（KGI）を達成するための中間指標。「月間PV数」「CVR」「新規顧客獲得数」などが代表例です。',tip:'KGI（最終目標）→KPI（中間指標）の順で設定。KPIが達成されるとKGIに近づく設計が重要です。'},
  {type:'mkt',typeLabel:'📊 マーケティング',scene:'マーケティング用語「LTV」',q:'LTV（Life Time Value）の正しい意味はどれ？',opts:['サイトの滞在時間','一人の顧客が生涯を通じてもたらす総利益・総売上','広告の掲載期間','コンテンツの寿命'],correct:1,why:'LTVは顧客1人の生涯価値。LTVを上げるには解約率低下・リピート促進・アップセルが有効です。',tip:'新規獲得コスト（CAC）よりLTVが高ければビジネスが成立します。LTV ÷ CAC ≥ 3が健全な目安とされています。'},
  {type:'mkt',typeLabel:'📊 マーケティング',scene:'マーケティング用語「CPC」',q:'CPC（Cost Per Click）の正しい意味はどれ？',opts:['1コンバージョンあたりの費用','広告が1回クリックされるごとにかかる費用','1000回表示あたりの費用','月間広告費の合計'],correct:1,why:'CPC＝広告費 ÷ クリック数。Google広告やSNS広告でよく使われる指標です。',tip:'CPCが高くてもCVRが高ければ問題ない場合も。CPA（1件あたりのコスト）も合わせて評価しましょう。'},
  {type:'mkt',typeLabel:'📊 マーケティング',scene:'マーケティング用語「CPM」',q:'CPM（Cost Per Mille）の正しい意味はどれ？',opts:['1クリックあたりの費用','1コンバージョンあたりの費用','広告1,000回表示あたりの費用','月間の広告表示回数'],correct:2,why:'CPM＝広告費 ÷ 表示回数 × 1000。認知獲得目的の広告ではCPMでコスト評価することが多いです。',tip:'クリック率（CTR）が低い場合、CPMが安くてもCPCは高くなります。目的に合わせた指標で評価しましょう。'},
  {type:'mkt',typeLabel:'📊 マーケティング',scene:'マーケティング用語「CTR」',q:'CTR（Click Through Rate）の正しい意味はどれ？',opts:['コンテンツの離脱率','広告やリンクが表示された回数のうちクリックされた割合','購入完了率','メールの開封率'],correct:1,why:'CTR＝クリック数 ÷ インプレッション数 × 100。バナー広告・Google検索広告・メールなどで使われます。',tip:'CTRが低い場合はクリエイティブ（画像・コピー）の改善が必要。A/Bテストで比較するのが基本です。'},
  {type:'mkt',typeLabel:'📊 マーケティング',scene:'マーケティング用語「CPA」',q:'CPA（Cost Per Acquisition）の正しい意味はどれ？',opts:['1クリックあたりの費用','1,000回表示あたりの費用','1件のコンバージョン（購入・申込）を獲得するためにかかった費用','月間広告費の合計'],correct:2,why:'CPA＝広告費 ÷ コンバージョン数。CPAが目標値以下なら広告は黒字、以上なら赤字と判断できます。',tip:'CPAの目標値は商品の利益率から逆算して設定します。LTVも考慮することが重要です。'},
  {type:'mkt',typeLabel:'📊 マーケティング',scene:'マーケティング用語「ROAS」',q:'ROAS（Return On Ad Spend）の正しい意味はどれ？',opts:['広告費の総額','広告費に対して何倍の売上を生んだかを示す指標','広告のクリック率','広告の表示回数'],correct:1,why:'ROAS＝広告経由の売上 ÷ 広告費 × 100（%）。ROAS 300%なら1万円の広告費で3万円の売上を意味します。',tip:'ROIは利益ベース、ROASは売上ベースで測ります。利益率が低い商材はROASを高く設定する必要があります。'},
  {type:'mkt',typeLabel:'📊 マーケティング',scene:'マーケティング用語「SEO」',q:'SEO（Search Engine Optimization）の正しい意味はどれ？',opts:['SNS広告の最適化','検索エンジンで上位表示されるようにサイトを改善する施策','サイトのセキュリティ対策','メールマーケティングの手法'],correct:1,why:'SEOは検索エンジン最適化。GoogleなどでユーザーがキーワードをY検索したとき、上位に表示されるよう対策します。',tip:'SEOはコンテンツ・技術・被リンクの3軸で評価されます。良質なコンテンツが全ての基本です。'},
  {type:'mkt',typeLabel:'📊 マーケティング',scene:'マーケティング用語「オーガニック流入」',q:'オーガニック流入の正しい意味はどれ？',opts:['SNSからの流入','広告費を使わず検索エンジンから自然に訪れたユーザー','メールからの流入','直接URLを入力してきたユーザー'],correct:1,why:'オーガニック（有機的）流入は広告なしで検索結果から来たユーザー。SEOで増やせる最もコスト効率の良い流入源です。',tip:'オーガニック流入を増やすにはSEOが重要。一度上位表示されれば広告費ゼロで継続的に流入します。'},
  {type:'mkt',typeLabel:'📊 マーケティング',scene:'マーケティング用語「ファネル」',q:'マーケティングファネルの正しい意味はどれ？',opts:['漏斗型のグラフ','認知→興味→検討→購入という顧客の購買プロセスを示したモデル','広告の配信設定','コンテンツの分類方法'],correct:1,why:'ファネル（漏斗）は上から認知・興味・比較・購入と絞り込まれていく顧客の行動モデル。施策をファネルのどの段階に当てるか設計します。',tip:'TOFu（Top of Funnel：認知）→MOFu（Middle：検討）→BOFu（Bottom：購入）と施策を分けて考えましょう。'},
  {type:'mkt',typeLabel:'📊 マーケティング',scene:'マーケティング用語「リターゲティング」',q:'リターゲティング広告の正しい意味はどれ？',opts:['新規ユーザーへの広告配信','一度サイトを訪れたユーザーに再度表示される広告','特定の地域にだけ配信する広告','メールで送る広告'],correct:1,why:'リターゲティングは一度サイトを訪問したユーザーに追いかけるように表示される広告。購入検討中のユーザーへのリーチに効果的です。',tip:'リターゲティングは認知ではなく「迷っているユーザーの背中を押す」施策。CVRが高い傾向があります。'},
  {type:'mkt',typeLabel:'📊 マーケティング',scene:'マーケティング用語「A/Bテスト」',q:'A/Bテストの正しい意味はどれ？',opts:['2つの商品の売上比較','2つのバージョン（A案・B案）を同時に配信し効果を比較する手法','広告とSEOの効果比較','AとBの2人のデザイナーが作ったデザインの比較'],correct:1,why:'A/Bテストはバナー・LP・メールなど2パターンをランダムに表示し、どちらがCVR・CTRが高いかを測定する手法です。',tip:'A/Bテストは感覚でなくデータで改善する最も基本的な手法。変数は一度に一つだけ変えることが原則です。'},
  {type:'mkt',typeLabel:'📊 マーケティング',scene:'マーケティング用語「インプレッション」',q:'インプレッションの正しい意味はどれ？',opts:['クリックされた回数','広告やコンテンツが表示された回数','購入された回数','シェアされた回数'],correct:1,why:'インプレッション（imp）は広告・投稿が画面に表示された回数。クリックされなくても表示されればカウントされます。',tip:'インプレッションが多くてもCTRが低い場合はクリエイティブに問題あり。まず「見てもらえているか」を確認しましょう。'},
  {type:'mkt',typeLabel:'📊 マーケティング',scene:'マーケティング用語「バウンス率」',q:'バウンス率（直帰率）の正しい意味はどれ？',opts:['サイトからの離脱率（全ページ共通）','1ページだけ見てサイトを離れたユーザーの割合','広告のキャンセル率','メールの開封率'],correct:1,why:'バウンス率（直帰率）は1ページだけ見て帰ったユーザーの割合。高いほど「期待と内容が合っていない」サインです。',tip:'直帰率が高いページはファーストビューの改善が必要。ユーザーが期待していた情報をすぐ見せることが重要です。'},
  {type:'mkt',typeLabel:'📊 マーケティング',scene:'マーケティング用語「コンテンツマーケティング」',q:'コンテンツマーケティングの正しい意味はどれ？',opts:['広告を大量に出すマーケティング手法','有益なコンテンツを提供して見込み客を集め育てるマーケティング','商品のパッケージデザインを改善すること','イベントを開催して集客すること'],correct:1,why:'コンテンツマーケティングはブログ・動画・SNSなどで価値ある情報を発信し、潜在顧客を引き寄せて購買につなげる手法です。',tip:'広告は止めたら消えますが、良質なコンテンツは資産になります。長期投資として取り組む視点が重要です。'},
  {type:'mkt',typeLabel:'📊 マーケティング',scene:'マーケティング用語「エンゲージメント率」',q:'SNSにおけるエンゲージメント率の正しい意味はどれ？',opts:['投稿の表示回数','フォロワー数の増加率','いいね・コメント・シェアなどのリアクション数をインプレッションで割った割合','広告のクリック率'],correct:2,why:'エンゲージメント率は投稿への反応率。インプレッションが多くてもエンゲージメント率が低ければコンテンツが刺さっていないサインです。',tip:'フォロワー数よりエンゲージメント率が重要。少数精鋭のフォロワーとの深いつながりを目指しましょう。'},
  {type:'mkt',typeLabel:'📊 マーケティング',scene:'マーケティング用語「バイラルマーケティング」',q:'バイラルマーケティングの正しい意味はどれ？',opts:['TVCMを使った大規模広告','口コミ・シェアで爆発的に情報が広がることを狙ったマーケティング','インフルエンサーへの広告依頼','メールで大量送信する広告'],correct:1,why:'バイラル（viral）はウイルスのように広がるという意味。SNSでシェアされやすいコンテンツを作り、口コミで認知を広げます。',tip:'バイラルは狙えるものではなく「結果としてなるもの」。感情を動かす・役に立つ・驚きがあるコンテンツが広がりやすいです。'},
  {type:'mkt',typeLabel:'📊 マーケティング',scene:'マーケティング用語「オウンドメディア」',q:'オウンドメディアの正しい意味はどれ？',opts:['テレビや雑誌などのマスメディア','自社が所有・運営するブログ・サイト・SNSアカウントなどのメディア','インフルエンサーのSNS','有料広告枠'],correct:1,why:'オウンド（owned）は「所有している」。自社ブログ・公式サイト・メルマガなどがオウンドメディアです。長期的な資産になります。',tip:'トリプルメディア：オウンド（自社）・アーンド（口コミ）・ペイド（広告）の3つを組み合わせるのがマーケの基本です。'},
  {type:'mkt',typeLabel:'📊 マーケティング',scene:'マーケティング用語「グロースハック」',q:'グロースハックの正しい意味はどれ？',opts:['不正な方法で成長すること','データ分析と実験を繰り返して最速で成長する手法・考え方','ハッカーがサービスを攻撃すること','急激な値下げで顧客を獲得すること'],correct:1,why:'グロースハックはFacebook・Dropbox・Airbnbが採用した成長手法。A/Bテスト・ファネル分析・ユーザーインタビューを繰り返します。',tip:'DropboxのリファラルプログラムはグロースハックÃ代表例。「友達を招待すると容量増加」で爆発的に拡大しました。'},
  {type:'biz',typeLabel:'💡 経営・ビジネス',scene:'ビジネス用語「PDCA」',q:'PDCAサイクルの正しい意味はどれ？',opts:['Plan（計画）→Do（実行）→Check（評価）→Action（改善）の繰り返し','Product・Design・Cost・Analysisの頭文字','プレゼン・デモ・コンセプト・アクションの流れ','価格・デザイン・コンテンツ・広告の4要素'],correct:0,why:'PDCAは業務改善の基本サイクル。計画→実行→振り返り→改善を繰り返すことで継続的に成果を上げます。',tip:'PDCAは「Check（振り返り）」が最も重要で最も省略されがちです。数値で評価する習慣をつけましょう。'},
  {type:'biz',typeLabel:'💡 経営・ビジネス',scene:'ビジネス用語「MVP」',q:'ビジネスにおけるMVP（Minimum Viable Product）の正しい意味はどれ？',opts:['最も優れた製品','最小限の機能で市場に出せる製品（試作品）','最高価値の提案','最も売れている製品'],correct:1,why:'MVPは「最低限動く製品」。完成を待たずに市場に出して反応を見ることで、無駄な開発を防ぎます。スタートアップで多用される概念。',tip:'完璧を目指してリリースを遅らせるより、MVPで早く出してフィードバックをもらう方が結果的に良い製品ができます。'},
  {type:'biz',typeLabel:'💡 経営・ビジネス',scene:'ビジネス用語「バリュープロポジション」',q:'バリュープロポジションの正しい意味はどれ？',opts:['商品の価格設定','顧客に提供できる独自の価値・なぜ自社を選ぶべきかの理由','従業員への福利厚生','投資家への提案書'],correct:1,why:'バリュープロポジションは「なぜうちを選ぶのか」という独自価値の定義。競合と差別化されていることが重要です。',tip:'「誰の・どんな問題を・どう解決するか」を明確にしたのがバリュープロポジション。ブレがあると全ての施策がズレます。'},
  {type:'biz',typeLabel:'💡 経営・ビジネス',scene:'ビジネス用語「ピボット」',q:'スタートアップにおけるピボットの正しい意味はどれ？',opts:['資金調達のこと','事業の方向性を大きく転換すること','新しいメンバーを採用すること','オフィスを移転すること'],correct:1,why:'ピボット（pivot）はバスケのターンが語源。市場の反応を見て事業モデル・ターゲット・製品を大きく変えることです。',tip:'YouTubeは元々動画出会い系サービス、Instagramは位置情報ゲームアプリでした。ピボットで成功した代表例です。'},
  {type:'biz',typeLabel:'💡 経営・ビジネス',scene:'ビジネス用語「SaaS」',q:'SaaS（Software as a Service）の正しい意味はどれ？',opts:['パッケージソフトウェアの販売','インターネット経由でソフトウェアをサブスクで提供するビジネスモデル','ハードウェアのレンタルサービス','セキュリティソフトのこと'],correct:1,why:'SaaSはGoogle Workspace・Slack・Notionなどのようにブラウザからサブスクで使うソフトウェアサービスです。',tip:'SaaS事業のKPIはMRR（月次定期収益）・チャーン率・LTV。一度契約してもらえば安定収益が続くのが特徴です。'},
  {type:'biz',typeLabel:'💡 経営・ビジネス',scene:'ビジネス用語「アジャイル」',q:'アジャイルの正しい意味はどれ？',opts:['大規模な計画を立てて一気に実行する手法','小さく素早く繰り返す開発・業務改善の手法','会議を減らす働き方','外部に業務委託すること'],correct:1,why:'アジャイルは「素早い」という意味。短いサイクルで開発・改善を繰り返すことで、変化に柔軟に対応します。',tip:'アジャイルの反対はウォーターフォール（大きな計画を順番に実行）。現代のWeb開発ではアジャイルが主流です。'},
  {type:'biz',typeLabel:'💡 経営・ビジネス',scene:'ビジネス用語「ステークホルダー」',q:'ステークホルダーの正しい意味はどれ？',opts:['会社の株主のみ','企業の活動に利害関係を持つ人・組織（顧客・従業員・株主・地域社会など）','プロジェクトのチームメンバー','取引先企業'],correct:1,why:'ステークホルダーは「利害関係者」の総称。顧客・従業員・株主・取引先・地域住民など全員が含まれます。',tip:'CSR（企業の社会的責任）やESGはステークホルダー全体を考慮した経営の概念です。'},
  {type:'biz',typeLabel:'💡 経営・ビジネス',scene:'ビジネス用語「クロスセル」',q:'クロスセルの正しい意味はどれ？',opts:['競合製品を比較して販売すること','購入者に関連商品・追加商品を勧めること','高額な上位商品を勧めること','複数チャンネルで販売すること'],correct:1,why:'クロスセルは「ハンバーガーを買った人にポテトも勧める」のような関連商品の提案。LTVを上げる有効な手法です。',tip:'アップセルは「より高い商品を勧める」、クロスセルは「関連商品を追加で勧める」の違いを覚えましょう。'},
  {type:'biz',typeLabel:'💡 経営・ビジネス',scene:'ビジネス用語「アップセル」',q:'アップセルの正しい意味はどれ？',opts:['関連商品を追加で勧めること','現在の商品より上位・高額なものを勧めること','過去の購入者に再購入を促すこと','無料プランから有料プランへの移行を促すこと'],correct:1,why:'アップセルは「スタンダードプランを買う人にプレミアムプランを勧める」などの上位版提案。単価アップに効果的です。',tip:'アップセルの成功率は新規獲得より高い。既存顧客への提案は重要な売上向上施策です。'},
  {type:'biz',typeLabel:'💡 経営・ビジネス',scene:'ビジネス用語「チャーン率」',q:'チャーン率（解約率）の正しい意味はどれ？',opts:['新規顧客の獲得率','一定期間内に解約・離脱した顧客の割合','顧客満足度の指標','売上の成長率'],correct:1,why:'チャーン率はSaaSや会員制ビジネスで特に重要。チャーン率5%でも10年後には半分以下の顧客になります。',tip:'バケツに水を入れても穴が開いていれば溜まりません。新規獲得と同時にチャーン率の低下が最重要課題です。'},
  {type:'biz',typeLabel:'💡 経営・ビジネス',scene:'ビジネス用語「スケール」',q:'ビジネスにおける「スケールする」の正しい意味はどれ？',opts:['規模を縮小すること','コストを比例させずに売上・事業規模を拡大できること','スケジュールを延長すること','デザインのサイズを変えること'],correct:1,why:'スケールは「拡大再生産できる状態」。人やコストを増やさずに売上が増える仕組みを作ることがスケールの本質です。',tip:'SaaSやプラットフォームビジネスはスケールしやすい代表例。手作業が多いビジネスはスケールしにくいです。'},
  {type:'biz',typeLabel:'💡 経営・ビジネス',scene:'ビジネス用語「ボトルネック」',q:'ボトルネックの正しい意味はどれ？',opts:['予算が足りない状況','全体の流れの中で最も遅く・弱い部分（全体の速度を制限する箇所）','意見の対立が起きている部分','コストが最もかかっている部分'],correct:1,why:'ボトルネック（瓶の首）は全体の処理速度を制限している箇所。ここを改善すると全体のパフォーマンスが上がります。',tip:'TOC（制約理論）では「ボトルネックを見つけて集中して改善する」ことが最も効率的な改善方法とされています。'},
  {type:'biz',typeLabel:'💡 経営・ビジネス',scene:'ビジネス用語「オンボーディング」',q:'オンボーディングの正しい意味はどれ？',opts:['新しいオフィスへの移転','新入社員や新規顧客がスムーズに使い始められるよう支援するプロセス','製品のアップデート','海外展開のこと'],correct:1,why:'オンボーディングは「船に乗せる」が語源。新しい環境（製品・職場）に素早く慣れてもらうための支援プロセスです。',tip:'SaaSの解約の多くは「使い方がわからなかった」から。オンボーディングを充実させるとチャーン率が下がります。'},
  {type:'biz',typeLabel:'💡 経営・ビジネス',scene:'ビジネス用語「アジェンダ」',q:'アジェンダの正しい意味はどれ？',opts:['プロジェクトの最終目標','会議や打ち合わせの議題・進行表','業務の優先順位リスト','提案書のこと'],correct:1,why:'アジェンダは会議で話し合う議題・順序をまとめたリスト。事前共有することで会議の質と効率が大幅に上がります。',tip:'アジェンダなしの会議は目的地なしのドライブと同じ。必ず事前に「今日決めること」を明示しましょう。'},
  {type:'biz',typeLabel:'💡 経営・ビジネス',scene:'ビジネス用語「コンセンサス」',q:'コンセンサスの正しい意味はどれ？',opts:['上司の承認','関係者全員の合意・同意','多数決による決定','専門家の意見'],correct:1,why:'コンセンサスは全員が納得した状態での合意。多数決と違い、反対意見も聞いた上で全員が受け入れた状態です。',tip:'「コンセンサスを得る」は全員に賛成してもらうことが必須ではなく「全員が受け入れられる」状態を目指すことです。'},
  {type:'biz',typeLabel:'💡 経営・ビジネス',scene:'ビジネス用語「PMF」',q:'PMF（Product Market Fit）の正しい意味はどれ？',opts:['製品の最終完成状態','製品が市場のニーズにぴったりはまった状態','プロジェクト管理の手法','マーケティング施策の一種'],correct:1,why:'PMFは「市場が求めているものと製品が合致している状態」。PMF前にスケールしようとするのは最も危険な失敗パターンです。',tip:'PMFの確認方法：「この製品が使えなくなったら非常に困る」と回答するユーザーが40%以上なら達成の目安とされています。'},
  {type:'biz',typeLabel:'💡 経営・ビジネス',scene:'ビジネス用語「NPS」',q:'NPS（Net Promoter Score）の正しい意味はどれ？',opts:['月間の新規顧客数','顧客がサービスを他者に勧めたいかを0〜10で測る顧客ロイヤルティ指標','従業員満足度調査の結果','SNSのフォロワー増加数'],correct:1,why:'NPSは「友人・知人にこのサービスをすすめますか？」の回答で測定。推奨者の割合から批判者の割合を引いた数値です。',tip:'NPS 50以上が優秀とされています。Appleは70以上。NPSが高いと口コミで顧客が増えます。'},
  {type:'biz',typeLabel:'💡 経営・ビジネス',scene:'ビジネス用語「KGI」',q:'KGI（Key Goal Indicator）の正しい意味はどれ？',opts:['日々の業務の進捗指標','事業の最終目標を数値化したもの（売上・利益など）','競合との比較指標','顧客満足度の指標'],correct:1,why:'KGIは「最終的にどこを目指すか」という数値目標。KPIはKGI達成のための中間指標です。',tip:'KGIから逆算してKPIを設定するのが正しい順序。「KGIが売上1億円なら、CVRとアクセス数のKPIはいくつ？」と考えます。'},

  {type:'biz',typeLabel:'💡 経営・ビジネス',scene:'ビジネス用語「SWOT分析」',q:'SWOT分析の正しい意味はどれ？',opts:['売上・費用・利益・損失の4指標分析','強み・弱み・機会・脅威の4軸で事業を分析するフレームワーク','顧客・競合・市場の3C分析','製品・価格・流通・販促の4P分析'],correct:1,why:'SWOT＝Strengths（強み）・Weaknesses（弱み）・Opportunities（機会）・Threats（脅威）。内部・外部環境を整理する基本フレームです。',tip:'SWOTは分析だけでなく「SOクロス（強みで機会を活かす）」「STクロス（強みで脅威を回避）」など戦略立案まで活用しましょう。'},

  {type:'biz',typeLabel:'💡 経営・ビジネス',scene:'ビジネス用語「リテンション」',q:'ビジネスにおけるリテンションの正しい意味はどれ？',opts:['新規顧客の獲得','既存顧客・従業員を維持・引き留めること','製品の品質保証','データの保管'],correct:1,why:'リテンション（retention）は「維持・保持」という意味。顧客リテンション＝解約させないこと、人材リテンション＝離職させないことを指します。',tip:'新規顧客獲得コストは既存顧客維持コストの5倍とされています。リテンションへの投資はROIが高い施策です。'},
